uf Masse.","caution":"Pin-1-Markierung (Kerbe/Punkt) an Chip und Sockel beachten. Wandler, Klingelrechner und LED-Streifen brauchen dieselbe Masse, das Signal wird gegen sie gemessen."}},"led":{"en":{"what":"Solder three wires to the +5V, DIN (data in) and GND solder pads at the end the arrows point away from. Put the 1000 µF capacitor (a small charge store) across +5 V and GND at the strip, stripe to minus.","caution":"Reversed, the capacitor can fail. The joints sit outside the sealed box, and a short circuit there takes down the 5 V of the whole box, so seal them."},"de":{"what":"Drei Drähte an die Lötflächen +5V, DIN (Dateneingang) und GND an dem Ende, von dem die Pfeile wegzeigen. Den 1000-µF-Kondensator (kleiner Ladungsspeicher) am Streifen über +5 V und GND, markierte Seite an Minus.","caution":"Verpolt kann der Kondensator ausfallen. Die Lötstellen liegen außerhalb des Kastens und müssen dicht sein, sonst legt ein Kurzschluss die 5 V im Kasten lahm."}},"amp":{"en":{"what":"Solder the 7-pin header (a row of pins) and the speaker screw terminal. Add a 100 kΩ resistor from GAIN to Vin (the supply pin): lowest gain (amplification), 3 dB. 10 µF (stripe to GND) + 0.1 µF across Vin and GND.","caution":"GAIN to ground gives 12 dB, louder than open. The amp can deliver 1.8 W, the speaker takes 1 W max: also cap the volume in firmware. Check the datasheet first."},"de":{"what":"Die 7-polige Stiftleiste (Reihe von Pins) und die Lautsprecher-Schraubklemme einlöten. 100-kΩ-Widerstand von GAIN nach Vin (Versorgungspin): kleinste Verstärkung, 3 dB. 10 µF (Markierung an GND) + 0,1 µF an Vin und GND.","caution":"GAIN an Masse ergibt 12 dB, lauter als offen. Verstärker bis 1,8 W, Lautsprecher max. 1 W: Lautstärke auch in der Firmware begrenzen. Datenblatt prüfen."}},"speaker":{"en":{"what":"Solder two wires to the speaker's solder lugs (small metal tabs), keeping the iron on each lug only briefly. Do this before the speaker is screwed to the box wall. The other ends go into the amplifier's screw terminal.","caution":"Both wires carry signal, neither is ground: never connect either to ground. Route them into the box; the cavity in front of the speaker counts as outside."},"de":{"what":"Zwei Drähte an die Lötfahnen (kleine Metalllaschen) des Lautsprechers löten, Kolben jeweils nur kurz ansetzen. Vor dem Anschrauben an die Kastenwand erledigen. Die anderen Enden kommen in die Klemme des Verstärkers.","caution":"Beide Drähte führen Signal, keiner ist Masse: keinen davon mit Masse verbinden. Die Drähte in den Kasten führen, der Raum vor dem Lautsprecher zählt als außen."}},"mic":{"en":{"what":"Solder the loose 6-pin header (a row of pins), or wires straight to the pads (solder points). Mount it with the labelled side, which carries the sound hole, facing the membrane behind the mic holes.","caution":"Feed it from the talk computer's 3.3 V, never from the 5 V distribution. The wrong way round it hears almost nothing; keep the gap to the membrane small."},"de":{"what":"Die lose 6-polige Stiftleiste (Reihe von Pins) einlöten oder Drähte direkt an die Lötpads. Die beschriftete Seite trägt das Schallloch und zeigt zur Membran hinter den Mikrofonlöchern.","caution":"Versorgung von den 3,3 V des Sprechrechners, nie von der 5-V-Verteilung. Falsch herum hört es fast nichts; Spalt zur Membran klein halten."}},"bme":{"en":{"what":"Solder the sensor's 6-pin header into the distribution board (D20–I20, VCC in D20), chip to the front. Bridges: D19 → J19 (3.3 V) and E18 → A18 (ground).","caution":"It is a 3.3 V module. A single stray strand at its pins once shorted 3.3 V to ground: beep-test before the power goes on."},"de":{"what":"Die 6-polige Stiftleiste des Sensors in die Verteilerplatine löten (D20–I20, VCC in D20), Chip nach vorn. Brücken: D19 → J19 (3,3 V) und E18 → A18 (Masse).","caution":"Es ist ein 3,3-V-Modul. Ein einzelnes abstehendes Litzenhärchen an seinen Pins schloss einmal 3,3 V gegen Masse kurz: vor dem Einschalten durchpiepen."}},"mosfet":{"en":{"what":"Planned: the MOSFET, a gate resistor and a pull-down (a resistor that holds the gate at 0 V) on the free area C1–J7 of the distribution board.","caution":"Check that the heater stays cold while the doorbell computer boots."},"de":{"what":"Geplant: der MOSFET, ein Gate-Widerstand und ein Pull-down (Widerstand, der das Gate auf 0 V hält) auf der freien Fläche C1–J7 der Verteilerplatine.","caution":"Prüfen, dass die Heizung kalt bleibt, während der Klingelrechner startet."}},"fuse":{"en":{"what":"Put the 73 °C thermal fuse (a one-time cut-out for overheating) in series with the heater pad. Crimping (a squeezed metal sleeve, no heat) is preferred. If soldering: long legs, pliers between joint and fuse body.","caution":"Soldering heat can blow a 73 °C fuse for good; the pliers act as a heat sink (they draw the heat away). Check with a meter that it still conducts."},"de":{"what":"Die 73-°C-Thermosicherung (trennt einmalig bei Überhitzung) in Reihe mit dem Heizpad. Am besten crimpen (Metallhülse aufquetschen, ohne Hitze). Beim Löten: Beine lang lassen, Zange zwischen Lötstelle und Sicherung.","caution":"Lötwärme kann eine 73-°C-Sicherung dauerhaft auslösen, die Zange leitet die Wärme ab. Danach mit dem Messgerät prüfen, ob sie noch Durchgang hat."}},"waveshare":{"en":{"what":"Solder the wires straight onto the talk computer's header pins: 5Vin and GND from the doorbell computer, the four supervision wires, three wires to the amplifier, five to the microphone.","caution":"Heat shrink over every joint: the pins are only 2.54 mm apart. Keep the strapping pins 0, 3, 45 and 46 free."},"de":{"what":"Die Drähte direkt an die Stifte des Sprechrechners löten: 5Vin und GND vom Klingelrechner, die vier Wächter-Leitungen, drei Adern zum Verstärker, fünf zum Mikrofon.","caution":"Schrumpfschlauch über jede Lötstelle: die Stifte stehen nur 2,54 mm auseinander. Die Strapping-Pins 0, 3, 45 und 46 frei lassen."}},"wt32":{"en":{"what":"Solder the pin header row IO43 ... VBUS (the kit comes with loose headers). The button line uses 3V3, IO1 and GND.","caution":"Check for solder bridges between neighbours before power-up, above all between 3V3, 3V3_EN and GND."},"de":{"what":"Die Stiftleiste IO43 … VBUS einlöten (liegt lose bei). Die Klingelleitung nutzt 3V3, IO1 und GND.","caution":"Vor dem Einschalten auf Lötbrücken zwischen Nachbarpins prüfen, vor allem zwischen 3V3, 3V3_EN und GND."}},"rail5":{"en":{"what":"Build the distribution board: bare wire rails on the back (GND A1–A24, 5 V B1–B7, 3V3 J9–J24), the button-line circuit, the BME280, then 16 numbered wires with 15–30 cm each.","caution":"Only 3 mm of air under the board: cut every lead to 1 mm. Beep-test GND, 5 V and 3V3 against each other before the first power-on."},"de":{"what":"Die Verteilerplatine bauen: Schienen aus blankem Draht auf der Rückseite (GND A1–A24, 5 V B1–B7, 3V3 J9–J24), die Klingelleitungs-Schaltung, den BME280, dann 16 nummerierte Adern mit je 15–30 cm.","caution":"Unter der Platine sind nur 3 mm Luft: jedes Bein auf 1 mm kürzen. Vor dem ersten Einschalten GND, 5 V und 3V3 gegeneinander durchpiepen."}},"lilygo":{"en":{"what":"Solder wire 4 (5 V) into edge-row hole 1 (VBUS) and wire 3 (ground) into hole 3 (GND), from the component side. The radar gets hole 2 (VBUS), a GND hole and the RX/TX holes.","caution":"Cut the wires flush on the other side: the e-paper glass lies there."},"de":{"what":"Ader 4 (5 V) in Loch 1 (VBUS) und Ader 3 (Masse) in Loch 3 (GND) der Randreihe löten, von der Bauteilseite. Das Radar bekommt Loch 2 (VBUS), ein GND-Loch und die Löcher RX/TX.","caution":"Die Drähte auf der anderen Seite bündig abschneiden: dort liegt das E-Paper-Glas."}}},"zones":{"internet":{"en":{"name":"Internet","plain":"Outside services on the internet: only Telegram, a messenger that is planned to carry visitor voice messages to your phone."},"de":{"name":"Internet","plain":"Dienste im Internet: nur Telegram, ein Messenger, über den Sprachnachrichten von Besuchern auf dein Handy kommen sollen (geplant)."}},"house":{"en":{"name":"House","plain":"Inside the house: the Home Assistant server (runs the home automations), the WiFi access point, a local speech-to-text server and your phone, plus planned house speakers and a planned family app."},"de":{"name":"Haus","plain":"Im Haus: der Home-Assistant-Server (steuert die Hausautomation), der WLAN-Access-Point, ein lokaler Server für Spracherkennung und dein Handy, dazu geplante Hauslautsprecher und eine geplante Familien-App."}},"technikraum":{"en":{"name":"Technical room","plain":"Indoor room that feeds the door: UPS (battery-backed mains supply), PoE switch (sends power and data down one network cable), surge protector and house earth; the door needs no power supply of its own here."},"de":{"name":"Technikraum","plain":"Der Raum im Haus, der die Tür versorgt: USV (Stromversorgung mit Akku), PoE-Switch (schickt Strom und Daten über ein Netzwerkkabel), Überspannungsschutz und Hauserde; die Tür braucht hier kein eigenes Netzteil."}},"wall":{"en":{"name":"Outside wall","plain":"14 cm of facade insulation in front of masonry; one outdoor network cable crosses it into the box through a split cable gland (a sealed cable entry), and its exact route is still open."},"de":{"name":"Außenwand","plain":"14 cm Fassadendämmung vor dem Mauerwerk; ein Outdoor-Netzwerkkabel führt hindurch und über eine geteilte Kabelverschraubung (dichte Kabeldurchführung) in den Kasten, der genaue Kabelweg ist noch offen."}},"box":{"en":{"name":"Box at the door","plain":"Sealed 3D-printed box (v3), surface-mounted on the wooden door frame behind the front: the three door computers, the distribution board, the sensors and small parts; heated in winter (heater switch still to come)."},"de":{"name":"Kasten an der Tür","plain":"Dichter, 3D-gedruckter Kasten (v3), auf die Holzzarge neben der Tür geschraubt, hinter der Front: die drei Türrechner, die Verteilerplatine, die Sensoren und Kleinteile; im Winter beheizt (der Heizungsschalter kommt noch)."}},"front":{"en":{"name":"Brass front","plain":"The visible brass front with all parts in or right behind it: light and diffuser (spreads the light) under the folded roof, speaker, screen, mic holes and push button; there is no camera."},"de":{"name":"Messingfront","plain":"Die sichtbare Messingfront mit allem, was darin oder direkt dahinter sitzt: Licht mit Diffusor (streut das Licht) unter dem gekanteten Dach, Lautsprecher, Bildschirm, Mikrofonlöcher, Taster; keine Kamera."}}},"layers":{"mains":{"en":{"name":"Mains 230 V","plain":"Household mains power at 230 V, only indoors: it feeds the UPS (a battery-backed power supply), and the UPS feeds the network switch."},"de":{"name":"Netz 230 V","plain":"Netzspannung 230 V aus der Hausinstallation, nur im Haus: Sie versorgt die USV (Stromversorgung mit Akku), und die USV versorgt den Netzwerk-Switch."}},"poe":{"en":{"name":"PoE (48 V)","plain":"Power over Ethernet: one network cable carries data and about 48 V power from the switch to the box; the high voltage keeps the current, and with it the loss in the cable, small."},"de":{"name":"PoE (48 V)","plain":"Power over Ethernet: Ein Netzwerkkabel bringt Daten und Strom mit etwa 48 V vom Switch zum Kasten; die hohe Spannung hält den Strom und damit den Verlust im Kabel klein."}},"ethernet":{"en":{"name":"Ethernet data","plain":"Wired network data only, with no power on the line."},"de":{"name":"Ethernet-Daten","plain":"Nur Netzwerkdaten über Kabel, ohne Stromversorgung."}},"wifi":{"en":{"name":"WiFi","plain":"Radio network; the screen computer and the talk computer use it. The doorbell computer stays on the cable."},"de":{"name":"WLAN","plain":"Funknetz; Bildschirm- und Sprechrechner nutzen es. Der Klingelrechner bleibt am Kabel."}},"v5":{"en":{"name":"5 V supply","plain":"5 V made from 12 V by one step-down converter (turns a higher voltage into a lower one); it feeds all three computers, the amplifier, the LED strip and the level shifter (raises the LED signal to 5 V)."},"de":{"name":"5-V-Versorgung","plain":"5 V, von einem Abwärtswandler (macht aus höherer Spannung eine niedrigere) aus 12 V erzeugt; versorgt alle drei Rechner, Verstärker, LED-Streifen und Pegelwandler (hebt das LED-Signal auf 5 V)."}},"v3":{"en":{"name":"3.3 V supply","plain":"3.3 V made on the doorbell and talk computer boards from their 5 V; it feeds the BME280 climate sensor and the pull-up (a resistor that holds a line at a known voltage) on the button line, and the microphone."},"de":{"name":"3,3-V-Versorgung","plain":"3,3 V, auf den Platinen von Klingel- und Sprechrechner aus deren 5 V erzeugt; versorgt den Klimasensor BME280 und den Pull-up (Widerstand, der eine Leitung auf fester Spannung hält) der Klingelleitung sowie das Mikrofon."}},"gnd":{"en":{"name":"Ground (0 V)","plain":"The shared return path: every part sends its current back through it and every signal is measured against it, so all grounds in the box join at one point."},"de":{"name":"Masse (0 V)","plain":"Der gemeinsame Rückweg: Jeder Strom fließt über sie zurück und jedes Signal wird gegen sie gemessen, deshalb treffen sich alle Masseleitungen des Kastens in einem Punkt."}},"earth":{"en":{"name":"Protective earth","plain":"The house protective earth; of the doorbell parts, only the surge protector (diverts voltage spikes from lightning) is connected to it, by an electrician. It carries no current in normal operation."},"de":{"name":"Schutzerde","plain":"Die Schutzerde des Hauses; von der Klingel hängt nur der Überspannungsschutz (leitet Spannungsspitzen durch Blitz ab) daran, angeschlossen vom Elektriker. Im Normalbetrieb fließt darüber kein Strom."}},"i2c":{"en":{"name":"I2C sensor bus","plain":"I2C: a slow two-wire bus (shared wires that chips use to talk), SDA for data and SCL for the clock; it connects the BME280 climate sensor to the doorbell computer."},"de":{"name":"I2C-Sensorbus","plain":"I2C: ein langsamer Bus aus zwei Leitungen (über die Chips miteinander reden), SDA für Daten und SCL für den Takt; er verbindet den Klimasensor BME280 mit dem Klingelrechner."}},"i2s":{"en":{"name":"I2S audio bus","plain":"I2S: a three-wire digital audio bus (bit clock, word clock, data) between the talk computer and both the microphone and the amplifier; being digital it resists noise, yet the wires must stay short."},"de":{"name":"I2S-Audiobus","plain":"I2S: ein digitaler Audiobus mit drei Leitungen (Bittakt, Worttakt, Daten) zwischen Sprechrechner, Mikrofon und Verstärker; digital und daher störfest, die Leitungen müssen trotzdem kurz bleiben."}},"gpio":{"en":{"name":"Control lines","plain":"Single lines from one computer pin each (GPIO, a general-purpose pin): the LED data line through the level shifter (raises 3.3 V to 5 V) and the heater on/off signal."},"de":{"name":"Steuerleitungen","plain":"Einzelne Leitungen von je einem Rechner-Pin (GPIO, frei nutzbarer Ein-/Ausgang): die LED-Datenleitung über den Pegelwandler (hebt 3,3 V auf 5 V) und das Ein/Aus-Signal der Heizung."}},"button":{"en":{"name":"Doorbell line","plain":"Monitored button line: resistors create three voltages (idle about 1.73 V, pressed about 0.30 V, wire cut about 3.1 to 3.3 V) that the computer measures on an analog pin, so a cut wire is reported."},"de":{"name":"Klingelleitung","plain":"Überwachte Klingelleitung: Widerstände erzeugen drei Spannungen (Ruhe etwa 1,73 V, gedrückt etwa 0,30 V, Drahtbruch etwa 3,1 bis 3,3 V), die der Rechner analog misst; ein Drahtbruch wird gemeldet."}},"speaker":{"en":{"name":"Speaker wires","plain":"The two amplified wires from the amplifier screw terminal to the loudspeaker; both carry the signal and neither is ground (the 0 V return)."},"de":{"name":"Lautsprecherkabel","plain":"Die zwei verstärkten Leitungen von der Schraubklemme des Verstärkers zum Lautsprecher; beide führen Signal, keine davon ist Masse (der 0-V-Rückleiter)."}},"software":{"en":{"name":"Software links","plain":"Logical links over the network: the ESPHome connection (firmware on the door computers) to Home Assistant, phone notifications, screen content, and the planned voice-message and push-to-talk paths."},"de":{"name":"Datenflüsse","plain":"Logische Verbindungen über das Netz: die ESPHome-Verbindung (Firmware der Türrechner) zu Home Assistant, Handy-Benachrichtigungen, Bildschirminhalte sowie die geplanten Wege für Sprachnachrichten und Push-to-Talk."}},"mech":{"en":{"name":"Mechanics & seals","plain":"How parts are mounted and sealed, and where air, water, light and sound may pass."},"de":{"name":"Mechanik & Dichtung","plain":"Wie die Teile befestigt und abgedichtet sind und wo Luft, Wasser, Licht und Schall durchgelassen werden."}}},"pending":[{"en":"Heater switch: a logic-level MOSFET on the distribution board, and the heater control in the doorbell computer's firmware.","de":"Heizungsschalter: ein Logic-Level-MOSFET auf der Verteilerplatine und die Heizungsregelung in der Firmware des Klingelrechners."},{"en":"Climate sensors: their firmware is written but not yet on the device; the first readings from the box are still to come.","de":"Klimasensoren: Ihre Firmware ist geschrieben, aber noch nicht auf dem Gerät; die ersten Werte aus dem Kasten stehen noch aus."},{"en":"Radar: wired to the screen computer; the firmware is still to come (the screen's log has to move off the radar's serial pins first).","de":"Radar: am Bildschirmrechner verdrahtet; die Firmware kommt noch (das Log des Bildschirms muss erst von den seriellen Pins des Radars weg)."},{"en":"Light: which COB strip, the level shifter on the distribution board, and the cable through the front.","de":"Licht: welcher COB-Streifen, der Pegelwandler auf der Verteilerplatine und das Kabel durch die Front."},{"en":"Service USB: three data-only USB-C breakouts in the bottom, not wired yet. The firmware has to keep USB alive and pause the supervision wires while a board is being flashed.","de":"Service-USB: drei USB-C-Breakouts nur mit Datenleitungen im Boden, noch nicht verdrahtet. Die Firmware muss USB am Leben halten und die Wächter-Leitungen pausieren, solange eine Platine geflasht wird."},{"en":"The PoE module in frost: it has no published temperature range, and a cold start was not tested. The industrial splitter is the fallback.","de":"Das PoE-Modul im Frost: Es hat keinen veröffentlichten Temperaturbereich, und ein Kaltstart wurde nicht getestet. Der Industriesplitter ist der Plan B."},{"en":"A full call with a room key and its transcript, with everything in the box.","de":"Ein ganzes Gespräch mit einem Raumschlüssel und seiner Mitschrift, mit allem im Kasten."},{"en":"A water test of the box; then the v4 box without glued parts, and the metal front from a metal shop.","de":"Ein Wassertest des Kastens; danach der v4-Kasten ohne Klebeteile und die Metallfront aus einem Metallbetrieb."}],"milestones":{"m_concept":{"en":{"title":"Concept and architecture","why":"Decide what the device is before buying and printing: the front design, the parts and how they connect.","done_when":"Every part, wire and open decision is on the map.","tasks":{"t_front":"Front design v5: one bent brass sheet, 100 × 260 mm, light band under the roof","t_arch":"Architecture: one PoE cable, three computers (doorbell, talk, screen)","t_parts":"Parts chosen and drawn with their dimensions","t_map":"This map and the public repository"}},"de":{"title":"Konzept und Architektur","why":"Festlegen, was das Gerät ist, bevor gekauft und gedruckt wird: Frontdesign, Teile und wie sie zusammenhängen.","done_when":"Jedes Teil, jede Leitung und jede offene Entscheidung steht auf der Karte.","tasks":{"t_front":"Frontdesign v5: ein gekantetes Messingblech, 100 × 260 mm, Lichtband unter dem Dach","t_arch":"Architektur: ein PoE-Kabel, drei Rechner (Klingel, Sprechen, Bildschirm)","t_parts":"Teile ausgewählt und mit ihren Maßen gezeichnet","t_map":"Diese Karte und das öffentliche Repository"}}},"m_parts":{"en":{"title":"All hardware on the table","why":"Nothing can be measured, fitted or programmed for real until every part of the final build is here.","done_when":"Every part of the final build is here and identified.","tasks":{"t_split":"Power path: the doorbell computer's PoE module feeds the box (heater load test passed, 9.37 W)","t_inhand":"In hand: all three computers, microphone, amplifier, speaker, both climate sensors, radar, heater pad, thermal fuses, level shifter","t_mail":"Bench checks on arrival: touch chip GT911, real BME280, heater on PoE","t_order":"Still to buy: a logic-level MOSFET, the COB LED strip, the outdoor cable"}},"de":{"title":"Alle Hardware auf dem Tisch","why":"Solange nicht jedes Teil des fertigen Geräts da ist, lässt sich nichts wirklich messen, einpassen oder programmieren.","done_when":"Jedes Teil des fertigen Geräts ist da und bestimmt.","tasks":{"t_split":"Stromweg: Das PoE-Modul des Klingelrechners versorgt den Kasten (Lasttest mit Heizung bestanden, 9,37 W)","t_inhand":"Da: alle drei Rechner, Mikrofon, Verstärker, Lautsprecher, beide Klimasensoren, Radar, Heizpad, Thermosicherungen, Pegelwandler","t_mail":"Prüfen bei Ankunft: Touch-Chip GT911, echter BME280, Heizung am PoE","t_order":"Noch zu kaufen: ein Logic-Level-MOSFET, der COB-LED-Streifen, das Außenkabel"}}},"m_fit":{"en":{"title":"Measure and alpha print","why":"Find out whether everything fits before designing the real box: first the parts alone, then with every cable.","done_when":"Every part and every cable fits in a printed box, and the number of cables entering it is final.","tasks":{"t_measure":"Measure what makers don't publish: display, doorbell computer, talk computer, microphone, amplifier, SHT31, radar","t_cables":"Count the cables entering the box: one network cable; service USB through the bottom","t_alpha1":"Alpha print v2: all parts in place, surface-mounted on the door frame (12–13 Oct)","t_alpha2":"Box v3 (v3.0–v3.7): every part and every cable fits, with reserve","t_size":"Box size locked: 92 × 252 × 60 mm, on the wall (the door frame)"}},"de":{"title":"Messen und Alpha-Druck","why":"Herausfinden, ob alles passt, bevor der echte Kasten entsteht: erst die Teile allein, dann mit allen Kabeln.","done_when":"Jedes Teil und jedes Kabel passt in einen gedruckten Kasten, und die Zahl der Kabel hinein steht fest.","tasks":{"t_measure":"Messen, was die Hersteller nicht veröffentlichen: Display, Klingel- und Sprechrechner, Mikrofon, Verstärker, SHT31, Radar","t_cables":"Die Kabel in den Kasten zählen: ein Netzwerkkabel; Service-USB durch den Boden","t_alpha1":"Alpha-Druck v2: alle Teile am Platz, auf die Türzarge geschraubt (12.–13.10.)","t_alpha2":"Kasten v3 (v3.0–v3.7): jedes Teil und jedes Kabel passt, mit Reserve","t_size":"Kastengröße festgelegt: 92 × 252 × 60 mm, auf der Wand (der Türzarge)"}}},"m_soft":{"en":{"title":"Bench build and software","why":"Wire everything together and build the software until the experience at the door and in the house is release quality.","done_when":"The device does everything at release quality, and the measured power stays within 802.3af.","tasks":{"t_s1":"Doorbell: all three line states; storm ringing 20 of 20 at the bell, in Home Assistant and on the screen","t_s2":"Screen pages change on a ring; Wi-Fi in the box (−29 dBm from the doorbell computer's own access point)","t_s3":"Talk between the door and a room key, with transcripts on the screen","t_s4":"Duplex settled: the door arbitrates, its microphone is muted toward the keys while its speaker plays","t_s5":"One cable and the power rail: 4.82 W in the box, 9.37 W with the heater on the bench","t_sens":"Climate sensors in the firmware (written), the heater control and its switch","t_radar":"Radar in the screen firmware; light under the roof","t_audio":"Lock in: which extra audio features (voice messages, push-to-talk into the house)","t_ux":"UX until release quality: screen pages, light, sounds"}},"de":{"title":"Aufbau und Software","why":"Alles zusammen verdrahten und die Software bauen, bi nd das Dichtungsrezept ist aufgeschrieben.","tasks":{"t_mount":"Montage festgelegt: auf die massive Holzzarge geschraubt","t_material":"Kastenmaterial festgelegt: PETG (druckt gut auf einem offenen Drucker)","t_bracket":"Das Stahlblech als Wasserebene, das Messing darauf; gedruckte Stellvertreter in v3","t_seals":"Dichtungen: Silikonraupe, O-Ring an jeder Schraube, Taster-O-Ring, Mikrofonmembran, teilbare Kabelverschraubung","t_test":"Wassertest des abgedichteten Kastens: Schlauch oder Dusche, danach innen trocken"}}},"m_beta":{"en":{"title":"Beta box on the desk","why":"The complete device in its real box, running on the desk over the one cable. Not watertight yet.","done_when":"The whole device runs in its box for two weeks without a surprise.","tasks":{"t_bprint":"Print the box from what the alpha prints showed (v3.7)","t_bwire":"All inside wiring soldered, with reserve; first power-on in the box (20 Oct)","t_bbracket":"Fit the steel and brass stand-ins with everything running","t_bsoak":"Two weeks on the desk: scripted rings and calls, 20 PoE power cycles, no unexpected reboot"}},"de":{"title":"Beta-Kasten auf dem Tisch","why":"Das ganze Gerät in seinem echten Kasten, auf dem Tisch am einen Kabel. Noch nicht wasserdicht.","done_when":"Das ganze Gerät läuft zwei Wochen in seinem Kasten ohne Überraschung.","tasks":{"t_bprint":"Den Kasten nach den Erkenntnissen der Alpha-Drucke drucken (v3.7)","t_bwire":"Die ganze Innenverdrahtung gelötet, mit Reserve; erstes Einschalten im Kasten (20.10.)","t_bbracket":"Stahl- und Messing-Stellvertreter montieren, während alles läuft","t_bsoak":"Zwei Wochen auf dem Tisch: Klingeln und Gespräche per Skript, 20 PoE-Neustarts, kein unerwarteter Neustart"}}},"m_pre":{"en":{"title":"Pre-release box","why":"Bring the lessons of v3 and the water test into the final box and order the real metal front.","done_when":"The finished device passes the water test and the cold start.","tasks":{"t_papply":"Apply the findings of v3 and the water test: the v4 box, without glued parts","t_pbrass":"Order the steel and brass front from a metal shop (cut, bent, engraved)","t_pprint":"Final print","t_pwater":"Water test of the complete device","t_pcold":"Freezer cold start: heater, screen and PoE module come up in frost"}},"de":{"title":"Vorserien-Kasten","why":"Die Erkenntnisse aus v3 und dem Wassertest in den endgültigen Kasten bringen und die echte Metallfront bestellen.","done_when":"Das fertige Gerät besteht Wassertest und Kaltstart.","tasks":{"t_papply":"Die Erkenntnisse aus v3 und dem Wassertest umsetzen: der v4-Kasten ohne Klebeteile","t_pbrass":"Stahl- und Messingfront bei einem Metallbetrieb bestellen (geschnitten, gekantet, graviert)","t_pprint":"Enddruck","t_pwater":"Wassertest des ganzen Geräts","t_pcold":"Kaltstart im Gefrierschrank: Heizung, Bildschirm und PoE-Modul starten im Frost"}}},"m_door":{"en":{"title":"At the door","why":"Install the finished device at the front door and switch it on for good.","done_when":"A ring at the real door reaches the phone.","tasks":{"t_elec":"Electrician: earth the surge protector, remove the old bell transformer","t_route":"Cable route through the wall","t_fix":"Mount the box and seal the joint to the facade","t_live":"Go live with the watchdogs on (stuck button, cut wire, offline)"}},"de":{"title":"An der Tür","why":"Das fertige Gerät an der Haustür einbauen und dauerhaft einschalten.","done_when":"Ein Klingeln an der echten Tür kommt auf dem Handy an.","tasks":{"t_elec":"Elektriker: Überspannungsschutz erden, alten Klingeltrafo ausbauen","t_route":"Kabelweg durch die Wand","t_fix":"Kasten montieren und die Fuge zur Fassade abdichten","t_live":"In Betrieb nehmen, mit Wächtern (klemmender Taster, Kabelbruch, offline)"}}}}},"state":"2026-10-20"}</script>

/* ---------- view: pan & zoom ---------- */
const canvas=$('#canvas');
const VB0=LY.viewBox;
let vb={x:VB0[0],y:VB0[1],w:VB0[2],h:VB0[3]}, anim=null;
function aspect(){ const r=canvas.getBoundingClientRect(); return (r.width||1)/(r.height||1); }
function norm(v){
  const ar=aspect(), cx=v.x+v.w/2, cy=v.y+v.h/2;
  let w=v.w, h=v.h;
  if(w/h>ar) h=w/ar; else w=h*ar;
  const maxW=Math.max(VB0[2]*1.15, VB0[3]*1.15*ar);
  if(w>maxW){ w=maxW; h=w/ar; }
  if(w<200){ w=200; h=w/ar; }
  const ncx=Math.max(VB0[0], Math.min(VB0[0]+VB0[2], cx)), ncy=Math.max(VB0[1], Math.min(VB0[1]+VB0[3], cy));
  return {x:ncx-w/2, y:ncy-h/2, w, h};
}
function applyView(){ svg.setAttribute('viewBox', f(vb.x)+' '+f(vb.y)+' '+f(vb.w)+' '+f(vb.h)); }
function setVB(v){ if(anim){ cancelAnimationFrame(anim); anim=null; } vb=norm(v); applyView(); }
function animateTo(v){
  const to=norm(v);
  if(reduced){ vb=to; applyView(); return; }
  if(anim) cancelAnimationFrame(anim);
  const from=Object.assign({},vb), t0=performance.now(), D=480;
  const ease=u=>1-Math.pow(1-u,3);
  const tick=now=>{
    const u=Math.min(1,(now-t0)/D), k=ease(u);
    vb={x:from.x+(to.x-from.x)*k, y:from.y+(to.y-from.y)*k, w:from.w+(to.w-from.w)*k, h:from.h+(to.h-from.h)*k};
    applyView();
    anim = u<1 ? requestAnimationFrame(tick) : null;
  };
  anim=requestAnimationFrame(tick);
}
function homeView(){
  const ar=aspect();
  if(ar<1.05) return {x:360, y:VB0[1], w:VB0[3]*ar, h:VB0[3]};
  return {x:VB0[0], y:VB0[1], w:VB0[2], h:VB0[3]};
}
function fitIds(ids,pad){
  pad=pad||70;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ids.forEach(id => { const n=N[id]; if(!n) return; x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x+n.w); y1=Math.max(y1,n.y+n.h); });
  if(x0>x1) return;
  // the part of the canvas not covered by the detail panel or the walkthrough bar
  const R=canvas.getBoundingClientRect();
  const right = R.width - (overlayPanel() && $('.grid').classList.contains('has-sel') ? 372 : 0);
  const bottom = R.height - (state.tour && !tourbar.hidden ? tourbar.offsetHeight + 24 : 0);
  const rw=Math.max(120,right), rh=Math.max(120,bottom);
  const maxS = R.width / Math.min(VB0[2], R.width/R.height<1.05 ? 420 : 640);
  const s = Math.min(rw/(x1-x0+2*pad), rh/(y1-y0+2*pad), maxS);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  animateTo({x:cx-(rw/2)/s, y:cy-(rh/2)/s, w:R.width/s, h:R.height/s});
}
function zoomAt(k,cx,cy){
  const r=canvas.getBoundingClientRect();
  const wx = vb.x + ((cx==null ? r.width/2 : cx-r.left)/r.width)*vb.w;
  const wy = vb.y + ((cy==null ? r.height/2 : cy-r.top)/r.height)*vb.h;
  const w=vb.w*k, h=vb.h*k;
  setVB({x:wx-(wx-vb.x)*k, y:wy-(wy-vb.y)*k, w, h});
}
$('#zIn').onclick=()=>zoomAt(1/1.35);
$('#zOut').onclick=()=>zoomAt(1.35);
$('#zFit').onclick=()=>animateTo(homeView());
svg.addEventListener('wheel',ev=>{
  if(!(ev.ctrlKey||ev.metaKey)) return;
  ev.preventDefault();
  zoomAt(Math.exp(ev.deltaY*0.0022), ev.clientX, ev.clientY);
},{passive:false});
const ptrs=new Map(); let drag=null, pinch=null;
function pinchState(){
  const [a,b]=[...ptrs.values()];
  return {d:Math.hypot(a.x-b.x,a.y-b.y)||1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, vb:Object.assign({},vb)};
}
svg.addEventListener('pointerdown',ev=>{
  if(ev.pointerType==='mouse' && ev.button!==0) return;
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
  if(ptrs.size===1){ drag={x:ev.clientX,y:ev.clientY,vb:Object.assign({},vb),moved:0,target:ev.target.closest('[data-id],[data-edge],[data-badge]')}; pinch=null; }
  else if(ptrs.size===2){ drag=null; pinch=pinchState(); }
});
svg.addEventListener('pointermove',ev=>{
  if(!ptrs.has(ev.pointerId)){ hover(ev); return; }
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  const r=canvas.getBoundingClientRect();
  if(ptrs.size===1 && drag){
    const dx=ev.clientX-drag.x, dy=ev.clientY-drag.y;
    drag.moved=Math.max(drag.moved,Math.hypot(dx,dy));
    if(drag.moved>5){ svg.classList.add('grabbing'); hideTip(); const k=drag.vb.w/r.width; setVB({x:drag.vb.x-dx*k, y:drag.vb.y-dy*k, w:drag.vb.w, h:drag.vb.h}); }
  } else if(ptrs.size===2 && pinch){
    const now=pinchState(), s=pinch.d/now.d, v=pinch.vb;
    const wx=v.x+((pinch.mx-r.left)/r.width)*v.w, wy=v.y+((pinch.my-r.top)/r.height)*v.h;
    const w=v.w*s, h=v.h*s;
    setVB({x:wx-((now.mx-r.left)/r.width)*w, y:wy-((now.my-r.top)/r.height)*h, w, h});
  }
});
function endPtr(ev,cancel){
  const d=drag;
  ptrs.delete(ev.pointerId);
  svg.classList.remove('grabbing');
  if(!cancel && d && d.moved<=5 && ptrs.size===0) activate(d.target);
  if(ptrs.size<2) pinch=null;
  if(ptrs.size===0) drag=null;
}
svg.addEventListener('pointerup',ev=>endPtr(ev,false));
svg.addEventListener('pointercancel',ev=>endPtr(ev,true));
svg.addEventListener('pointerleave',()=>hideTip());
svg.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter' && ev.key!==' ') return;
  const n=ev.target.closest && ev.target.closest('[data-id]');
  if(n){ ev.preventDefault(); selectNode(n.getAttribute('data-id')); }
});
let lastW=0;
const onResize=()=>{
  const W=canvas.clientWidth; if(!W) return;
  if(!lastW){ vb=norm(homeView()); applyView(); }
  else if(W!==lastW){ const k=W/lastW, cx=vb.x+vb.w/2, cy=vb.y+vb.h/2; setVB({x:cx-vb.w*k/2, y:cy-vb.h*k/2, w:vb.w*k, h:vb.h*k}); }
  else setVB(vb);
  lastW=W;
};
if(window.ResizeObserver) new ResizeObserver(onResize).observe(canvas); else window.addEventListener('resize',onResize);

/* ---------- tooltip ---------- */
const tip=$('#tip');
function hover(ev){
  if(ev.pointerType!=='mouse'){ return; }
  const g=ev.target.closest && ev.target.closest('[data-edge]');
  if(!g){ hideTip(); return; }
  const e=E[g.getAttribute('data-edge')];
  const r=canvas.getBoundingClientRect();
  tip.innerHTML='<b><span class="sw" style="--c:var(--w-'+e.layer+')"></span>'+esc(edgeLabel(e))+'</b>'+esc(nodeLabel(e.from))+' → '+esc(nodeLabel(e.to))+'<small>'+esc(t('layers')[e.layer])+' · '+esc(t('methods')[e.method]||e.method)+(e.decided?'':' · '+esc(t('undecided')))+'</small>';
  tip.hidden=false;
  let x=ev.clientX-r.left+14, y=ev.clientY-r.top+14;
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  if(x+tw>r.width-8) x=ev.clientX-r.left-tw-14;
  if(y+th>r.height-8) y=ev.clientY-r.top-th-14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){ tip.hidden=true; }

/* ---------- state & focus ---------- */
function activate(target){
  if(!target){ if(state.tour) return; clearSel(); return; }
  if(target.hasAttribute('data-id')) selectNode(target.getAttribute('data-id'));
  else if(target.hasAttribute('data-badge')) selectNode(target.getAttribute('data-badge'));
  else if(target.hasAttribute('data-edge')) selectEdge(target.getAttribute('data-edge'));
}
function selectNode(id,opts){
  if(state.tour) endTour(true);
  state.sel=id; state.selEdge=null;
  applyFocus(); renderPanel();
  if(opts && opts.fit){
    const ids=[id]; EDGES.forEach(e => { if(e.from===id) ids.push(e.to); if(e.to===id) ids.push(e.from); });
    fitIds(ids);
  } else keepClear(N[id]);
}
const overlayPanel = () => window.matchMedia && matchMedia('(min-width:1061px)').matches;
function keepClear(n){
  if(!overlayPanel() || !n) return;
  const R=canvas.getBoundingClientRect(), free=R.width-372;
  const sx=(n.x+n.w/2-vb.x)/vb.w*R.width;
  if(sx>free-20) animateTo({x:vb.x+(sx-free/2)/R.width*vb.w, y:vb.y, w:vb.w, h:vb.h});
}
function selectEdge(id){
  if(state.tour) endTour(true);
  state.selEdge=id; state.sel=null;
  applyFocus(); renderPanel();
  const e=E[id]; if(e){ const a=N[e.from], b=N[e.to]; keepClear(a.x>b.x?a:b); }
}
function clearSel(){ state.sel=null; state.selEdge=null; applyFocus(); renderPanel(); }
function applyVisibility(){
  svg.querySelectorAll('.edge').forEach(g => {
    const e=E[g.getAttribute('data-edge')];
    g.classList.toggle('off', !state.layers.has(e.layer));
  });
  svg.classList.toggle('nojoints', !state.joints);
  svg.classList.toggle('hideplanned', !state.planned);
}
function focusSets(){
  const nodes=new Set(), edges=new Set(); let flow=false;
  if(state.tour){
    const tr=SK.tours.find(x=>x.id===state.tour), st=tr.steps[state.step];
    st.nodes.forEach(n=>nodes.add(n)); st.edges.forEach(e=>edges.add(e)); flow=true;
  } else if(state.sel){
    nodes.add(state.sel);
    EDGES.forEach(e => { if(e.from===state.sel||e.to===state.sel){ edges.add(e.id); nodes.add(e.from); nodes.add(e.to); } });
  } else if(state.selEdge){
    const e=E[state.selEdge]; edges.add(e.id); nodes.add(e.from); nodes.add(e.to);
  } else return null;
  return {nodes,edges,flow};
}
function applyFocus(){
  const fs=focusSets();
  svg.classList.toggle('focus', !!fs);
  gNodes.querySelectorAll('.node').forEach(g => {
    const id=g.getAttribute('data-id');
    g.classList.toggle('hl', !!fs && fs.nodes.has(id));
    g.classList.toggle('sel', state.sel===id);
  });
  gBadges.querySelectorAll('.sbadge').forEach(g => g.classList.toggle('hl', !!fs && fs.nodes.has(g.getAttribute('data-badge'))));
  svg.querySelectorAll('.edge').forEach(g => {
    const id=g.getAttribute('data-edge');
    const on=!!fs && fs.edges.has(id);
    g.classList.toggle('hl', on);
    g.classList.toggle('flowing', on && fs.flow);
  });
}

/* ---------- panel ---------- */
const ep=$('#ep');

    });

  } else if(state.selEdge){
    const e=E[state.selEdge];
    h+='<div class="ep-meta"><span class="stb"><svg viewBox="0 0 16 6" style="width:18px"><rect width="16" height="4" y="1" rx="2" style="fill:var(--w-'+e.layer+')"/></svg>'+esc(t('layers')[e.layer])+'</span><span>'+esc(e.decided?t('decided'):t('undecided'))+'</span></div>';
    h+='<h3>'+esc(edgeLabel(e))+'</h3>';
    h+='<div class="ep-ends"><button type="button" class="ep-link" data-node="'+e.from+'"><span>'+esc(t('from'))+'</span><span class="c-l">'+esc(nodeLabel(e.from))+'</span></button><button type="button" class="ep-link" data-node="'+e.to+'"><span>'+esc(t('to'))+'</span><span class="c-l">'+esc(nodeLabel(e.to))+'</span></button></div>';
    h+='<div class="ep-h">'+esc(t('carries'))+'</div><p>'+esc(edgeCarries(e))+'</p>';
    h+='<div class="ep-h">'+esc(t('joinedBy'))+'</div><p>'+esc(t('methods')[e.method]||e.method)+'</p>';
    h+='<div class="ep-h">'+esc(t('layer'))+'</div><p>'+esc(layerHint(e.layer))+'</p>';
  } else {
    h+='<div class="ep-kicker">KLINGELBOX</div><h3>'+esc(t('emptyTitle'))+'</h3><p>'+esc(t('emptyBody'))+'</p>';

    h+='<div class="ep-h">'+esc(t('statusLegend'))+'</div><ul class="st-list">'+STATUS_ORDER.map(s=>'<li>'+stIcon(s)+esc(t('st')[s])+'</li>').join('')+'</ul>';
  }

ep.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.getAttribute('data-act')==='close') clearSel();
  else if(b.hasAttribute('data-edge')) selectEdge(b.getAttribute('data-edge'));
  else if(b.hasAttribute('data-node')) selectNode(b.getAttribute('data-node'));
  else if(b.hasAttribute('data-tour')) startTour(b.getAttribute('data-tour'));
});

/* ---------- tours ---------- */
const tourbar=$('#tourbar');
function startTour(id){
  state.tour=id; state.step=0; state.sel=null; state.selEdge=null;
  renderPanel(); showStep();
  const r=canvas.getBoundingClientRect();
  if(r.top<0 || r.bottom>innerHeight) $('#map').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
}
function endTour(silent){
  state.tour=null; tourbar.hidden=true;
  if(!silent){ applyFocus(); }
}
function showStep(){
  const tr=SK.tours.find(x=>x.id===state.tour); if(!tr) return;
  const n=tr.steps.length, i=state.step;
  let dots=''; for(let k=0;k<n;k++) dots+='<button type="button" data-step="'+k+'" class="'+(k===i?'on':(k<i?'done':''))+'" aria-label="'+esc(t('step'))+' '+(k+1)+'"></button>';
  tourbar.innerHTML='<div class="tb-h"><span class="tb-k">'+esc(t('walkthrough'))+(tr.status==='planned'?' · '+esc(t('plannedTag')):'')+'</span><button type="button" class="tb-x" data-act="close" aria-label="Close">×</button></div>'+
    '<div class="tb-t">'+esc(tourTitle(tr))+'</div><p class="tb-s">'+esc(stepText(tr,i))+'</p>'+
    '<div class="tb-f"><div class="tb-dots">'+dots+'</div><div class="tb-nav"><span>'+(i+1)+' / '+n+'</span><button type="button" data-act="prev" '+(i===0?'disabled':'')+'>'+esc(t('prev'))+'</button><button type="button" class="pri" data-act="next">'+esc(i===n-1?t('done'):t('next'))+'</button></div></div>';
  tourbar.hidden=false;
  applyFocus();
  const ids=tr.steps[i].nodes.slice();
  fitIds(ids, 90);
}
tourbar.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  const tr=SK.tours.find(x=>x.id===state.tour); if(!tr) return;
  if(b.hasAttribute('data-step')){ state.step=+b.getAttribute('data-step'); showStep(); return; }
  const a=b.getAttribute('data-act');
  if(a==='close') endTour(false);
  else if(a==='prev' && state.step>0){ state.step--; showStep(); }
  else if(a==='next'){ if(state.step<tr.steps.length-1){ state.step++; showStep(); } else { endTour(false); animateTo(homeView()); } }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){ if(state.tour) endTour(false); else if(state.sel||state.selEdge) clearSel(); }
  if(!state.tour) return;
  const tr=SK.tours.find(x=>x.id===state.tour);
  if(ev.key==='ArrowRight' && state.step<tr.steps.length-1){ state.step++; showStep(); }
  if(ev.key==='ArrowLeft' && state.step>0){ state.step--; showStep(); }
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-tour]');
  if(b && !ep.contains(b)){ ev.preventDefault(); startTour(b.getAttribute('data-tour')); }
});

/* ---------- toolbar ---------- */
function renderTools(){
  const pr=$('#presets'); pr.innerHTML='';
  Object.keys(PRESETS).forEach(k => {
    const b=document.createElement('button'); b.type='button'; b.textContent=t(k);
    const set=PRESETS[k];
    b.setAttribute('aria-pressed', String(set.length===state.layers.size && set.every(l=>state.layers.has(l))));
    b.onclick=()=>{ state.layers=new Set(set); state.capLayer=null; renderTools(); applyVisibility(); if(state.sel) renderPanel(); };
    pr.appendChild(b);
  });
  const ch=$('#chips'); ch.innerHTML='';
  const count={}; EDGES.forEach(e=>count[e.layer]=(count[e.layer]||0)+1);
  LAYERS.forEach(l => {
    const b=document.createElement('button'); b.type='button'; b.className='chip';
    b.setAttribute('aria-pressed', String(state.layers.has(l)));
    b.style.setProperty('--c','var(--w-'+l+')');
    b.innerHTML='<i></i><span>'+esc(t('layers')[l])+'</span><small>'+(count[l]||0)+'</small>';
    b.title=layerHint(l);
    b.onclick=()=>{ if(state.layers.has(l)) state.layers.delete(l); else state.layers.add(l); state.capLayer=l; renderTools(); applyVisibility(); if(state.sel) renderPanel(); };
    b.onmouseenter=()=>{ state.capLayer=l; renderCaption(); };
    b.onfocus=()=>{ state.capLayer=l; renderCaption(); };
    ch.appendChild(b);
  });
  $('#tgJoints').checked=state.joints; $('#tgPlanned').checked=state.planned;
  renderCaption();
}
function renderCaption(){
  const c=$('#caption'), l=state.capLayer;
  c.innerHTML = l ? '<b>'+esc(t('layers')[l])+'</b> · '+esc(layerHint(l)) : esc(t('captionIdle'));
}
$('#chips').addEventListener('mouseleave',()=>{ state.capLayer=null; renderCaption(); });
$('#tgJoints').onchange=ev=>{ state.joints=ev.target.checked; applyVisibility(); };
$('#tgPlanned').onchange=ev=>{ state.planned=ev.target.checked; applyVisibility(); };

/* ---------- legend & lower sections ---------- */
function renderLegend(){
  const w=(cls,style)=>'<svg class="w" viewBox="0 0 26 10" aria-hidden="true"><path d="M2 5h22" fill="none" stroke-width="2.4" stroke-linecap="round" style="'+style+'"/></svg>';
  const m=h=>'<svg viewBox="-6 -6 12 12" aria-hidden="true">'+h+'</svg>';
  $('#legend').innerHTML=STATUS_ORDER.map(st=>'<span class="lg">'+stIcon(st)+esc(t('st')[st])+'</span>').join('')+'<span class="lg-sep"></span>'+
    '<span class="lg">'+w('','stroke:var(--ink-2)')+esc(t('lgDecided'))+'</span>'+
    '<span class="lg">'+w('','stroke:var(--ink-2);stroke-dasharray:6 4')+esc(t('lgUndecided'))+'</span>'+
    '<span class="lg">'+w('','stroke:var(--w-software);stroke-dasharray:1.5 4')+esc(t('lgNet'))+'</span>'+
    '<span class="lg">'+w('','stroke:var(--w-wifi);stroke-dasharray:7 5')+esc(t('lgRadio'))+'</span>'+
    '<span class="lg">'+m('<circle r="3.6" class="jm-solder"/>')+esc(t('lgSolder'))+'</span>'+
    '<span class="lg">'+m('<circle r="4.2" class="jm-screw"/><path d="M-2.6 2.6 2.6-2.6" class="jm-screw-s"/>')+esc(t('lgScrew'))+'</span>'+
    '<span class="lg">'+m('<rect x="-3.4" y="-3.4" width="6.8" height="6.8" rx="1" style="fill:var(--ink-2)"/>')+esc(t('lgPlug'))+'</span>'+
    '<span class="lg">'+m('<rect x="-4.5" y="-3" width="9" height="6" rx="1.2" class="jm-wago"/>')+esc(t('lgWago'))+'</span>'+
    '<span class="lg">'+m('<circle r="3.6" style="fill:var(--w-v5)"/>')+esc(t('lgBar'))+'</span>'+
    '<span class="hint">'+esc(coarse?t('hintTouch'):t('hintMouse'))+'</span>';
}
function renderLower(){
  $('#tours').innerHTML=SK.tours.map((tr,i)=>'<li class="'+(tr.status==='planned'?'planned':'')+'"><button type="button" data-tour="'+tr.id+'"><span class="tn">'+String(i+1).padStart(2,'0')+'</span><span class="tt">'+esc(tourTitle(tr))+'</span><span class="ts">'+tr.steps.length+' '+esc(t('steps'))+'</span></button></li>').join('');
  $('#solder').innerHTML=SK.solder.map((s,i)=>{ const x=solderTx(s.node)||{}; return '<li><span class="badge">'+(i+1)+'</span><h4><button type="button" data-show="'+s.node+'">'+esc(nodeLabel(s.node))+'</button></h4><p>'+esc(x.what||s.hint)+'</p>'+(x.caution?'<p class="cau"><b>'+esc(t('careful'))+'</b>'+esc(x.caution)+'</p>':'')+'</li>'; }).join('');
  $('#solderCount').textContent=SK.solder.length;
  const nodes=Object.values(N).filter(n=>n.kind!=='rail' || true);
  const counts={}; nodes.forEach(n=>counts[n.status]=(counts[n.status]||0)+1);
  $('#counts').innerHTML=STATUS_ORDER.filter(s=>counts[s]).map(s=>'<span class="stb">'+stIcon(s)+'<b>'+counts[s]+'</b> '+esc(t('st')[s])+'</span>').join('');
  $('#partsCount').textContent=nodes.length;
  const sorted=nodes.slice().sort((a,b)=>(ZONE_ORDER.indexOf(a.zone)-ZONE_ORDER.indexOf(b.zone))||(STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status)));
  $('#parts').innerHTML=sorted.map(n=>'<tr data-node="'+n.id+'"><td><b>'+esc(nodeLabel(n.id))+'</b></td><td class="mono">'+esc(n.tag)+'</td><td>'+stBadge(n.status)+'</td><td>'+esc(zoneName(n.zone))+'</td></tr>').join('');
  const pend = (TX.pending && TX.pending.length) ? TX.pending.map(p => p[lang] || p.en) : (lang==='de' && UI.de.pending ? UI.de.pending : SK.pending);
  $('#open').innerHTML=pend.map(p=>'<li>'+esc(p)+'</li>').join('');
  $('#openCount').textContent=pend.length;
  const pl=$('#plate'); pl.innerHTML=t('plate').map(r=>'<dt>'+esc(r[0])+'</dt><dd class="'+(r[0]==='Camera'||r[0]==='Kamera'?'none':'')+'">'+esc(r[1])+'</dd>').join('');
  const d=new Date((DATA.state||'2026-09-24')+'T12:00:00');
  $('#state').textContent=t('stateOf')+' '+(lang==='de'?d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}));
}
function showOnMap(id){ selectNode(id,{fit:true}); $('#map').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'}); }
$('#parts').addEventListener('click',ev=>{ const tr=ev.target.closest('tr[data-node]'); if(tr) showOnMap(tr.getAttribute('data-node')); });
$('#solder').addEventListener('click',ev=>{ const b=ev.target.closest('[data-show]'); if(b) showOnMap(b.getAttribute('data-show')); });


/* ---------- roadmap ---------- */
const MS = SK.milestones || [];
const TRACK_COLOR = {plan:'var(--ink-2)',hw:'var(--w-ethernet)',sw:'var(--w-poe)',wx:'var(--w-wifi)',box:'var(--brass-2)'};
function msTx(id){ const x=(TX.milestones||{})[id]; return (x && (x[lang]||x.en)) || {title:id,why:'',done_when:'',tasks:{}}; }
function msNo(id){ return 'M'+MS.findIndex(m=>m.id===id); }
function msProg(m){ return [m.tasks.filter(k=>k.status==='done').length, m.tasks.length]; }
function taskIcon(st){
  if(st==='done') return '<svg viewBox="0 0 16 16" class="ti ti-done" aria-hidden="true"><circle cx="8" cy="8" r="7"/><path d="M4.6 8.3 7 10.6l4.4-5"/></svg>';
  if(st==='doing') return '<svg viewBox="0 0 16 16" class="ti ti-doing" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z"/></svg>';
  if(st==='waiting') return '<svg viewBox="0 0 16 16" class="ti ti-waiting" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/></svg>';
  if(st==='decide') return '<svg viewBox="0 0 16 16" class="ti ti-decide" aria-hidden="true"><rect x="3.4" y="3.4" width="9.2" height="9.2" rx="1" transform="rotate(45 8 8)"/></svg>';
  return '<svg viewBox="0 0 16 16" class="ti ti-open" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/></svg>';
}
function roundPath(P,R){
  R=R||8; let d='M'+P[0][0]+' '+P[0][1], cur=P[0];
  for(let i=1;i<P.length;i++){
    const b=P[i], c=P[i+1];
    if(c){
      const l1=Math.hypot(b[0]-cur[0],b[1]-cur[1]), l2=Math.hypot(c[0]-b[0],c[1]-b[1]), r=Math.min(R,l1/2,l2/2);
      const e=[b[0]-(b[0]-cur[0])/l1*r, b[1]-(b[1]-cur[1])/l1*r], o=[b[0]+(c[0]-b[0])/l2*r, b[1]+(c[1]-b[1])/l2*r];
      d+=' L'+f(e[0])+' '+f(e[1])+' Q'+b[0]+' '+b[1]+' '+f(o[0])+' '+f(o[1]); cur=o;
    } else { d+=' L'+b[0]+' '+b[1]; cur=b; }
  }
  return d;
}
function shortLock(text){
  let s=text, pre=t('lockPrefix');
  if(s.indexOf(pre)===0) s=s.slice(pre.length);
  s=s.replace(/ *\([^)]*\)/g,'').replace(/, after .*$/,'').trim();
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function renderRoadmap(){
  const rs=$('#rmsvg'); if(!rs || !MS.length || !LY.roadmap) return;
  const R=LY.roadmap; rs.setAttribute('viewBox', R.viewBox.join(' '));
  rs.setAttribute('aria-label', t('roadmapTitle'));
  rs.innerHTML='';
  el('defs',null,rs,'<marker id="rmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--muted)"/></marker>');
  const gL=el('g',{class:'rm-links'},rs);
  R.links.forEach(l=>{
    const g=el('g',{class:'rm-link'+(l.soft?' soft':''),'data-from':l.from,'data-to':l.to},gL);
    el('path',{d:roundPath(l.pts),class:'rm-wire','marker-end':'url(#rmArrow)'},g);
    if(l.soft){ const a=l.pts[0], b=l.pts[1]; txt(g,{x:f((a[0]+b[0])/2),y:a[1]-7,'text-anchor':'middle',class:'rm-soft-l'},t('rmProvides')); }
  });
  const gC=el('g',{class:'rm-cards'},rs);
  MS.forEach((m,i)=>{
    const c=R.cards[m.id]; if(!c) return;
    const [x,y,w,h]=c, tx=msTx(m.id), pr=msProg(m), dec=m.tasks.filter(k=>k.status==='decide').length;
    const g=el('g',{class:'rm-card st-'+m.status+(m.track==='wx'?' explore':''),'data-ms':m.id,tabindex:0,role:'button','aria-label':'M'+i+' '+tx.title+', '+t('msSt')[m.status]},gC);
    el('rect',{x,y,width:w,height:h,rx:10,class:'rm-bg'},g);
    el('rect',{x:x+.6,y:y+12,width:4,height:h-24,rx:2,style:'fill:'+TRACK_COLOR[m.track]},g);
    const pl=t('msSt')[m.status].toUpperCase(); mctx.font='600 9.5px "JetBrains Mono", Consolas, monospace';
    const pw=mctx.measureText(pl).width+14;
    // header "M1 · TRACK": drop the track name when it would run under the status pill
    mctx.font='500 10px "JetBrains Mono", Consolas, monospace';
    const kw=s=>mctx.measureText(s.toUpperCase()).width+s.length*0.6, kroom=w-16-pw-22;
    let kline='M'+i+' · '+t('tracks')[m.track]; if(m.track==='wx') kline+=' · '+t('exploratory');
    if(kw(kline)>kroom) kline='M'+i+(m.track==='wx' && kw('M'+i+' · '+t('exploratory'))<=kroom ? ' · '+t('exploratory') : '');
    txt(g,{x:x+16,y:y+23,class:'rm-k'},kline);
    const pg=el('g',{class:'rm-pill p-'+m.status},g);
    el('rect',{x:f(x+w-12-pw),y:y+10,width:f(pw),height:18,rx:9},pg);
    txt(pg,{x:f(x+w-12-pw/2),y:y+22.5,'text-anchor':'middle'},pl);
    const lines=wrap(tx.title,'600 16px Barlow, "Segoe UI", system-ui, sans-serif',w-34,2);
    lines.forEach((ln,k)=>txt(g,{x:x+16,y:y+48+k*19,class:'rm-t'},ln));
    const bw=w-16-16-(dec?78:48), by=y+h-21;
    el('rect',{x:x+16,y:by,width:bw,height:6,rx:3,class:'rm-barbg'},g);
    if(pr[0]) el('rect',{x:x+16,y:by,width:f(bw*pr[0]/pr[1]),height:6,rx:3,class:'rm-bar'},g);
    txt(g,{x:x+w-16,y:by+6.5,'text-anchor':'end',class:'rm-n'},pr[0]+'/'+pr[1]);
    if(dec){ const dx=x+w-62, dy=by+3; el('rect',{x:dx-4,y:dy-4,width:8,height:8,rx:1,class:'rm-dia',transform:'rotate(45 '+dx+' '+dy+')'},g); txt(g,{x:dx+8,y:by+6.5,class:'rm-n'},String(dec)); }
  });
  const lgPill=(s)=>'<span class="pill p-'+s+'">'+esc(t('msSt')[s])+'</span>';
  const line=(style)=>'<svg viewBox="0 0 26 12" aria-hidden="true"><path d="M1 6h20" fill="none" stroke-width="1.8" style="stroke:var(--muted);'+style+'"/><path d="M19 2.5 25 6l-6 3.5z" style="fill:var(--muted)"/></svg>';
  $('#rmLegend').innerHTML=['now','next','later','done'].map(lgPill).join(' ')+
    '<span class="lg">'+line('')+esc(t('lgNeeds'))+'</span>'+
    '<span class="lg">'+line('stroke-dasharray:4 4')+esc(t('lgProvides'))+'</span>'+
    '<span class="lg"><svg viewBox="0 0 26 12" aria-hidden="true"><rect x="1" y="1" width="24" height="10" rx="3" fill="none" stroke-width="1.4" style="stroke:var(--ink-2);stroke-dasharray:4 3"/></svg>'+esc(t('lgExplore'))+'</span>'+
    '<span class="lg"><span class="dia"></span>'+esc(t('lgDecision'))+'</span>'+
    Object.keys(TRACK_COLOR).map(k=>'<span class="lg"><i class="trk" style="background:'+TRACK_COLOR[k]+'"></i>'+esc(t('tracks')[k])+'</span>').join('');
  const locks=[]; MS.forEach(m=>m.tasks.forEach(k=>{ if(k.status==='decide') locks.push([m,k]); }));
  $('#lockins').innerHTML='<div class="lk-h">'+esc(t('lockins'))+'<small>'+locks.length+'</small></div><ul class="lk">'+
    locks.map(([m,k])=>'<li><button type="button" data-ms-open="'+m.id+'"><span class="dia"></span><span>'+esc(shortLock(msTx(m.id).tasks[k.id]||k.id))+'</span><span class="lk-m">'+msNo(m.id)+'</span></button></li>').join('')+'</ul>';
  $('#rmList').innerHTML=MS.map((m,i)=>{
    const tx=msTx(m.id), pr=msProg(m);
    let h='<details class="ms" id="ms-'+m.id+'"><summary><span class="ms-n">M'+i+'</span><span class="ms-t">'+esc(tx.title)+'<small>'+esc(t('tracks')[m.track])+(m.track==='wx'?' · '+esc(t('exploratory')):'')+'</small></span>'+
      '<span class="pill p-'+m.status+'">'+esc(t('msSt')[m.status])+'</span><span class="ms-p"><i style="--p:'+Math.round(100*pr[0]/pr[1])+'%"></i>'+pr[0]+'/'+pr[1]+'</span></summary><div class="ms-b">';
    h+='<p class="ms-why">'+esc(tx.why)+'</p>';
    const needs=m.needs.concat(m.soft||[]);
    if(needs.length) h+='<div class="ms-needs"><span>'+esc(t('needs'))+':</span>'+needs.map(n=>'<button type="button" data-ms-open="'+n+'">'+msNo(n)+' · '+esc(msTx(n).title)+'</button>').join('')+'</div>';
    h+='<ol class="tasks">'+m.tasks.map(k=>'<li class="tk st-'+k.status+'">'+taskIcon(k.status)+'<span class="tk-t">'+esc(tx.tasks[k.id]||k.id)+(k.node&&N[k.node]?'<button type="button" data-show="'+k.node+'">'+esc(t('onMap'))+' ↗</button>':'')+'</span><span class="tk-s">'+esc(t('tkSt')[k.status])+'</span></li>').join('')+'</ol>';
    h+='<div class="ms-exit"><b>'+esc(t('doneWhen'))+'</b>'+esc(tx.done_when)+'</div></div></details>';
    return h;
  }).join('');
}
function openMs(id){
  const d=document.getElementById('ms-'+id); if(!d) return;
  d.open=true;
  document.querySelectorAll('#rmsvg .rm-card').forEach(g=>g.classList.toggle('sel', g.getAttribute('data-ms')===id));
  d.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
  d.classList.add('flash'); setTimeout(()=>d.classList.remove('flash'),1200);
}
function rmFocus(id){
  const rs=$('#rmsvg'); rs.classList.toggle('rm-focus', !!id);
  rs.querySelectorAll('.rm-link').forEach(l=>l.classList.toggle('hl', !!id && (l.getAttribute('data-from')===id || l.getAttribute('data-to')===id)));
  rs.querySelectorAll('.rm-card').forEach(c=>{ const m=c.getAttribute('data-ms'); c.classList.toggle('hl', !!id && (m===id || [...rs.querySelectorAll('.rm-link.hl')].some(l=>l.getAttribute('data-from')===m || l.getAttribute('data-to')===m))); });
}
$('#rmsvg').addEventListener('click',ev=>{ const c=ev.target.closest('[data-ms]'); if(c) openMs(c.getAttribute('data-ms')); });
$('#rmsvg').addEventListener('keydown',ev=>{ if(ev.key!=='Enter' && ev.key!==' ') return; const c=ev.target.closest && ev.target.closest('[data-ms]'); if(c){ ev.preventDefault(); openMs(c.getAttribute('data-ms')); } });
$('#rmsvg').addEventListener('pointerover',ev=>{ const c=ev.target.closest('[data-ms]'); rmFocus(c?c.getAttribute('data-ms'):null); });
$('#rmsvg').addEventListener('pointerleave',()=>rmFocus(null));
$('#roadmap').addEventListener('click',ev=>{
  const o=ev.target.closest('[data-ms-open]'); if(o){ ev.preventDefault(); openMs(o.getAttribute('data-ms-open')); return; }
  const sh=ev.target.closest('[data-show]'); if(sh){ ev.preventDefault(); showOnMap(sh.getAttribute('data-show')); }
});

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(n=>{ const v=t(n.getAttribute('data-t')); if(typeof v==='string') n.textContent=v; });
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed', String(b.getAttribute('data-lang')===lang)));
  svg.setAttribute('aria-label', lang==='de'?'Schaltplan der Klingelbox':'Wiring map of the Klingelbox');
  renderTools(); renderLegend(); renderLower(); renderRoadmap(); renderSVG(); renderPanel();
  if(state.tour) showStep();
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.getAttribute('data-lang'); store.set('kb-lang',lang); applyLang(); });

vb=norm(homeView());
applyLang();
requestAnimationFrame(()=>{ if(canvas.clientWidth){ lastW=canvas.clientWidth; vb=norm(homeView()); applyView(); } });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ renderSVG(); renderRoadmap(); });
})();
</script>
