omputer's access point the signal is −29 dBm.","solder":"Wires soldered straight to the header pins. Keep 0, 3, 45 and 46 free (strapping pins)."},"de":{"label":"Sprechrechner","what":"Der Rechner fürs Gegensprechen: Er bedient Mikrofon und Verstärker und spricht per WLAN mit den Raumschlüsseln. Eine Kopie des Türtons geht an den Transkriptions-Server.","specs":"ESP32-S3-N16R8-Entwicklerplatine, Aufdruck HW678. Mikrofon (I2S): SCK IO1, WS IO2, SD IO6. Verstärker (I2S): BCLK IO15, LRC IO16, DIN IO17. Herzschlag- und Reset-Leitungen zum Klingelrechner an IO8, IO18, IO9 und RST. Sprechverbindung aikos_voice v2.1.0; Sprache auf −6 dB begrenzt.","why":"Der ESP32-S3 hat genug Leistung für Audio. Im WLAN braucht er keinen Switch im Kasten; Zentimeter vom Zugangspunkt des Klingelrechners entfernt liegt das Signal bei −29 dBm.","solder":"Drähte direkt an die Stifte gelötet. 0, 3, 45 und 46 frei lassen (Strapping-Pins)."}},"lilygo":{"en":{"label":"Screen computer","what":"Shows the door pages, the call and its transcript, and reads touches. It is a 4.7 inch e-paper screen (keeps its image without power) with its own ESP32-S3 computer on the back. It also carries the radar.","specs":"LilyGO T5-4.7-S3 Touch (H716), board V2.4. Touch glass 120.1 × 66.77 mm, visible picture 56.95 × 101.9 mm. The screen comes loose on two ribbons and folds onto the board: 11.9 mm thick together. Seven mounting holes Ø3.94. Touch chip GT911 at I2C address 0x5D.","why":"The parallel e-paper panel (fed over many data lines at once) needs a dedicated driver chip, so it gets its own computer. WiFi is a fixed decision.","solder":"Two thick wires into the unpopulated edge row: VBUS (hole 1) and GND (hole 3), soldered from the component side and cut flush on the glass side. Never USB-C to a PC while PoE is on."},"de":{"label":"Bildschirmrechner","what":"Zeigt die Türseiten, das Gespräch und seine Mitschrift und liest Berührungen. Ein 4,7-Zoll-E-Paper-Bildschirm (behält sein Bild ohne Strom) mit eigenem ESP32-S3-Rechner auf der Rückseite. Er versorgt auch das Radar.","specs":"LilyGO T5-4.7-S3 Touch (H716), Platine V2.4. Touchglas 120,1 × 66,77 mm, sichtbares Bild 56,95 × 101,9 mm. Der Bildschirm kommt lose an zwei Flachbandkabeln und wird auf die Platine geklappt: zusammen 11,9 mm dick. Sieben Befestigungslöcher Ø3,94. Touch-Chip GT911 an I2C-Adresse 0x5D.","why":"Das parallele E-Paper-Panel (viele Datenleitungen gleichzeitig) braucht einen eigenen Treiberchip und damit einen eigenen Rechner. WLAN ist fest entschieden.","solder":"Zwei dicke Adern in die unbestückte Randreihe: VBUS (Loch 1) und GND (Loch 3), von der Bauteilseite gelötet und auf der Glasseite bündig abgeschnitten. Nie USB-C an einen PC, solange PoE an ist."}},"amp":{"en":{"label":"Amplifier","what":"Turns the digital audio from the talk computer into power for the loudspeaker. The audio arrives over I2S, a three-wire digital sound bus, so noise does not degrade the sound.","specs":"Adafruit MAX98357A. Up to about 1.8 W into 8 Ω; the speaker takes 0.5 W rated, 1 W max. 10 µF + 0.1 µF capacitors at its 5 V pins.","why":"The amp can deliver more than the speaker can take, so its gain (amplification) must be the lowest, 3 dB. Grounding the GAIN pin gives 12 dB, which is louder.","solder":"7-pin header (pin row), speaker screw terminal. 100 kΩ from GAIN to Vin (5 V) for the lowest gain, not to ground. 10 µF + 0.1 µF across Vin and GND, 10 µF stripe (minus) to GND."},"de":{"label":"Verstärker","what":"Macht aus dem digitalen Ton des Sprechrechners Leistung für den Lautsprecher. Der Ton kommt über I2S, einen digitalen Audiobus mit drei Leitungen, daher stört Rauschen den Klang nicht.","specs":"Adafruit MAX98357A. Bis etwa 1,8 W an 8 Ω; der Lautsprecher verträgt 0,5 W Dauer, 1 W max. 10 µF + 0,1 µF Kondensatoren an den 5-V-Pins.","why":"Der Verstärker leistet mehr, als der Lautsprecher verträgt. Deshalb die kleinste Verstärkung, 3 dB. GAIN an Masse gibt 12 dB, das ist lauter.","solder":"7-polige Stiftleiste, Lautsprecherklemme. 100 kΩ von GAIN nach Vin (5 V): kleinste Verstärkung, nicht an Masse. 10 µF + 0,1 µF an Vin/GND, beim 10 µF Minus-Markierung an GND."}},"mic":{"en":{"label":"Microphone","what":"Picks up the visitor's voice through the two mic holes and the membrane and sends it as digital I2S audio (sound as numbers over three wires) to the talk computer. Planned: recording only after a visitor action.","specs":"INMP441 MEMS microphone module (microphone built as a tiny chip), 3 owned. About 14 mm round, 6 pins, runs on 3.3 V.","why":"Digital output: noise on the wires does not degrade the sound. Recording must be announced on the screen (legal requirement).","solder":"6-pin header (a row of pins) or wires directly. Labelled side (with the sound hole) towards the membrane, or it hears almost nothing. Power from the 3.3 V, never 5 V."},"de":{"label":"Mikrofon","what":"Nimmt die Stimme durch die zwei Mikrofonlöcher und die Membran auf und schickt sie digital per I2S (Ton als Zahlen über drei Leitungen) an den Sprechrechner. Geplant: Aufnahme nur nach einer Aktion des Besuchers.","specs":"INMP441-MEMS-Mikrofonmodul (Mikrofon als winziger Chip), 3 vorhanden. Etwa Ø 14 mm, 6 Pins, läuft mit 3,3 V.","why":"Digitaler Ausgang: Störungen auf den Leitungen verschlechtern den Klang nicht. Die Aufnahme muss auf dem Bildschirm angekündigt werden (gesetzliche Pflicht).","solder":"6-polige Stiftleiste (Reihe von Steckstiften) oder Drähte direkt. Beschriftete Seite mit dem Schallloch zur Membran, sonst hört es fast nichts. Versorgung mit 3,3 V, nie 5 V."}},"shifter":{"en":{"label":"Level shifter","what":"Raises the LED data signal from the doorbell computer's 3.3 V to the 5 V the LED strip expects. It sits between one computer pin and the strip's data input.","specs":"SN74AHCT125N chip (DIP-14: 14 legs in two rows) plus a 330 Ω series resistor in the data line. On perfboard (board with a grid of holes).","why":"Without it the strip may work on the bench and then fail in the cold for no visible reason.","solder":"Chip in a DIP-14 socket (plug-in holder) on perfboard, supplied with 5 V. 330 Ω in the output line. Unused inputs and the enable (OE) pins to ground."},"de":{"label":"Pegelwandler","what":"Hebt das LED-Datensignal vom Klingelrechner von 3,3 V auf die 5 V, die der LED-Streifen erwartet. Er sitzt zwischen einem Pin des Rechners und dem Dateneingang des Streifens.","specs":"Chip SN74AHCT125N (DIP-14: 14 Beinchen in zwei Reihen) plus 330-Ω-Widerstand in der Datenleitung. Auf einer Lochrasterplatine.","why":"Ohne ihn läuft der Streifen am Tisch vielleicht und fällt dann in der Kälte ohne erkennbaren Grund aus.","solder":"Chip in DIP-14-Fassung (Steckhalter) auf Lochraster, mit 5 V versorgt. 330 Ω in die Ausgangsleitung. Unbenutzte Eingänge und die Freigabe-Pins (OE) an Masse."}},"ledcap":{"en":{"label":"1000 µF capacitor","what":"A capacitor (small charge store) across +5 V and ground directly at the LED strip. It absorbs the inrush (the short current surge) when the LEDs switch on.","specs":"1000 µF electrolytic (has a plus and a minus side; the stripe marks minus). To buy.","why":"It sits directly at the strip so the surge is absorbed there. The owned kit only has 100 nF capacitors, so this one must be bought.","solder":"Solder across +5 V and ground at the strip's input end, where its arrows start. Stripe (minus) to ground."},"de":{"label":"Kondensator 1000 µF","what":"Ein Kondensator (kleiner Ladungsspeicher) zwischen +5 V und Masse direkt am LED-Streifen. Er fängt den kurzen Stromstoß ab, wenn die LEDs einschalten.","specs":"Elektrolytkondensator 1000 µF (gepolt, also mit Plus und Minus; der Markierungsstreifen am Gehäuse zeigt Minus). Zu kaufen.","why":"Er sitzt direkt am LED-Streifen, damit der Stromstoß dort abgefangen wird. Im vorhandenen Sortiment gibt es nur 100 nF, deshalb muss er gekauft werden.","solder":"Zwischen +5 V und Masse am Eingangsende des LED-Streifens löten, wo die Pfeile beginnen. Markierungsstreifen (Minus) an Masse."}},"bme":{"en":{"label":"Climate sensor (box)","what":"Measures temperature, humidity and air pressure inside the box. It will be the heater's thermostat and warn before moisture condenses on the electronics.","specs":"BME280 module (GY-BME280, 6 pins), checked genuine (the similar BMP280 has no humidity). Soldered onto the distribution board; I2C address 0x76 (CSB and SDO left open), 3.3 V. Read by the doorbell computer every 60 s from firmware 0.3.23 (written, not yet on the device).","why":"It measures humidity too, which the condensation warning needs. If the sensor fails, the heater stays off.","solder":"Header in the distribution board (D20–I20), the module hangs over rows 21–24; two short bridges to 3.3 V and ground."},"de":{"label":"Klimasensor (Kasten)","what":"Misst Temperatur, Luftfeuchte und Luftdruck im Kasten. Er wird der Thermostat der Heizung und warnt, bevor Feuchte auf der Elektronik kondensiert.","specs":"BME280-Modul (GY-BME280, 6 Pins), als echt geprüft (der ähnliche BMP280 misst keine Feuchte). Auf die Verteilerplatine gelötet; I2C-Adresse 0x76 (CSB und SDO offen), 3,3 V. Der Klingelrechner liest ihn ab Firmware 0.3.23 alle 60 s (geschrieben, noch nicht auf dem Gerät).","why":"Er misst auch die Feuchte, die die Kondenswarnung braucht. Fällt der Sensor aus, bleibt die Heizung aus.","solder":"Stiftleiste in der Verteilerplatine (D20–I20), das Modul hängt über den Reihen 21–24; zwei kurze Brücken an 3,3 V und Masse."}},"mosfet":{"en":{"label":"Heater switch","what":"Turns the heater on and off. A MOSFET (an electronic power switch) connects the heater's minus lead to ground when the doorbell computer sets its pin.","specs":"A logic-level N-MOSFET that switches fully on at 3.3 V, on the distribution board (room left at C1–J7), with a pull-down so the heater stays off during boot. Type not chosen yet.","why":"The opto-coupled FR120N modules bought first drive their gate from the supply voltage, which is only 5 V in this box: not enough for that MOSFET. A logic-level part switches straight from the pin.","solder":""},"de":{"label":"Heizungsschalter","what":"Schaltet die Heizung ein und aus. Ein MOSFET (elektronischer Leistungsschalter) verbindet das Minus der Heizung mit Masse, wenn der Klingelrechner seinen Pin setzt.","specs":"Ein Logic-Level-N-MOSFET, der bei 3,3 V voll durchschaltet, auf der Verteilerplatine (Platz frei bei C1–J7), mit Pull-down, damit die Heizung beim Start aus bleibt. Typ noch nicht gewählt.","why":"Die zuerst gekauften FR120N-Module mit Optokoppler treiben das Gate aus der Versorgungsspannung, und die ist in diesem Kasten nur 5 V: zu wenig für diesen MOSFET. Ein Logic-Level-Teil schaltet direkt vom Pin.","solder":""}},"fuse":{"en":{"label":"Thermal fuse 73 °C","what":"A one-shot safety link in series with the heater (in the same wire, so all heater current passes through it). If it gets hotter than 73 °C it cuts the heater off for good, whatever the firmware does.","specs":"73 °C, 250 V, 10 A; two in hand, one is a spare. Goes into the heater's 5 V lead together with the heater switch.","why":"It works without any software. The firmware switches the heater off around 40 °C; the fuse is the last backstop if that fails.","solder":"Crimp (squeeze on a metal sleeve) preferred. If soldered: keep the legs long and clamp pliers between joint and fuse body to draw off the heat, since soldering heat can blow it."},"de":{"label":"73-°C-Sicherung","what":"Eine Einmal-Sicherung in Reihe mit der Heizung (in derselben Leitung, der ganze Heizstrom fließt hindurch). Wird sie heißer als 73 °C, trennt sie die Heizung dauerhaft, egal, was die Firmware tut.","specs":"73 °C, 250 V, 10 A; zwei vorhanden, eine als Reserve. Kommt zusammen mit dem Heizungsschalter in die 5-V-Zuleitung der Heizung.","why":"Sie wirkt ohne jede Software. Die Firmware schaltet die Heizung schon bei etwa 40 °C ab; die Sicherung greift erst, wenn das versagt.","solder":"Am besten crimpen (Metallhülse aufpressen). Beim Löten: Beinchen lang lassen, Zange als Wärmeableiter zwischen Lötstelle und Sicherungskörper klemmen. Lötwärme kann sie auslösen."}},"heater":{"en":{"label":"Heater pad","what":"A thin heating pad of about 5 W between the e-paper panel and its board. It keeps the panel (a screen that holds its image without power) warm enough to work in frost.","specs":"Adafruit 1481, 5 V, about 5 W (about 1 A). Load-tested on the PoE module: 9.37 W at the switch port, no restart. Not connected in the box yet: its leads are extended and parked at the distribution board.","why":"The panel is rated 0 to +50 °C, the box sees frost. Planned: off at boot and on sensor failure, off during calls, cut-out near 40 °C, and a one-shot 73 °C fuse as the last backstop.","solder":"Its thin leads make no contact in a lever clamp: crimp them onto thicker wire."},"de":{"label":"Heizpad","what":"Ein dünnes Heizpad mit etwa 5 W zwischen dem E-Paper-Panel und seiner Platine. Es hält das Panel (ein Bildschirm, der sein Bild ohne Strom behält) im Frost warm genug.","specs":"Adafruit 1481, 5 V, etwa 5 W (etwa 1 A). Lasttest am PoE-Modul: 9,37 W am Switch-Port, kein Neustart. Im Kasten noch nicht angeschlossen: die Zuleitungen sind verlängert und an der Verteilerplatine geparkt.","why":"Das Panel ist für 0 bis +50 °C freigegeben, der Kasten sieht Frost. Geplant: aus beim Start und bei Sensorausfall, aus während Gesprächen, Abschaltung bei etwa 40 °C und eine 73-°C-Einmalsicherung als letzte Sicherung.","solder":"Seine dünnen Zuleitungen haben in einer Hebelklemme keinen Kontakt: auf dickeren Draht crimpen."}},"linecircuit":{"en":{"label":"Button-line circuit","what":"Three parts on perfboard (a board with a grid of solder holes): a pull-up (a resistor that holds the line at a known voltage), a resistor in series with the line and a small capacitor that smooths spikes.","specs":"10 kΩ pull-up to 3.3 V, 1 kΩ in series, 100 nF to ground (0 V), on the distribution board. Measured idle 2.02 V on the bench, 1.99 V in the box; pressed 0.34–0.47 V; wire cut 3.18 V.","why":"A floating pin (one tied to no fixed voltage) once caused 134 phantom rings in 15 minutes. With the button's resistor, a cut wire shows up as its own voltage.","solder":"On the distribution board: R1 10 kΩ E11–J11, C1 100 nF E12–A12, R2 1 kΩ E13–I13. The pull-up goes to the doorbell computer's 3.3 V, never to 5 V."},"de":{"label":"Tasterschaltung","what":"Drei Bauteile auf Lochraster (Platine mit Lötpunkt-Raster): ein Pull-up (Widerstand, der die Leitung auf einer festen Spannung hält), ein Widerstand in Reihe und ein kleiner Kondensator gegen Störspitzen.","specs":"10 kΩ Pull-up an 3,3 V, 1 kΩ in Reihe, 100 nF an Masse (0 V), auf der Verteilerplatine. Gemessen in Ruhe 2,02 V auf dem Labortisch, 1,99 V im Kasten; gedrückt 0,34–0,47 V; Leitung durchtrennt 3,18 V.","why":"Ein offener Pin ohne feste Spannung löste einmal 134 Phantomklingeln in 15 Minuten aus. Mit dem Widerstand am Taster hat ein Drahtbruch eine eigene Spannung.","solder":"Auf der Verteilerplatine: R1 10 kΩ E11–J11, C1 100 nF E12–A12, R2 1 kΩ E13–I13. Der Pull-up geht an die 3,3 V des Klingelrechners, nie an 5 V."}},"led":{"en":{"label":"LED strip","what":"A short addressable LED strip (each LED gets its own colour over one data wire) in the diffuser under the brass roof: a warm downlight onto the brass and the step, plus status colours.","specs":"Planned: a COB strip (LEDs so dense they look like one line), 5 V, WS2812B type, 10 mm wide; room under the roof for 10 × 57 mm or 5 × 66 mm. 3 wires through one hole: 5 V, data, ground. Not chosen yet.","why":"A COB strip gives an even band behind a diffuser without visible dots. The earlier front had two LED windows in the bend; v3 has a diffuser along the whole roof instead.","solder":"Three wires onto +5V, DIN (data in) and GND. A 1000 µF capacitor (charge buffer) across +5 V and GND at the strip."},"de":{"label":"LED-Streifen","what":"Ein kurzer adressierbarer LED-Streifen (jede LED bekommt über eine Datenleitung ihre eigene Farbe) im Diffusor unter dem Messingdach: warmes Licht auf Messing und Stufe, dazu Statusfarben.","specs":"Geplant: ein COB-Streifen (so dicht bestückt, dass er wie eine Linie leuchtet), 5 V, Typ WS2812B, 10 mm breit; unter dem Dach ist Platz für 10 × 57 mm oder 5 × 66 mm. 3 Adern durch ein Loch: 5 V, Daten, Masse. Noch nicht ausgewählt.","why":"Ein COB-Streifen gibt hinter dem Diffusor ein gleichmäßiges Band ohne sichtbare Punkte. Die frühere Front hatte zwei LED-Fenster im Knick; v3 hat stattdessen einen Diffusor unter dem ganzen Dach.","solder":"Drei Adern an +5V, DIN (Dateneingang) und GND. Ein 1000-µF-Kondensator (Ladungspuffer) zwischen +5 V und GND am Streifen."}},"diffusor":{"en":{"label":"Diffuser","what":"A white, hollow quarter-round cover in the corner under the brass roof. The LED strip lies inside it, and it spreads the few LEDs into one even band of warm light.","specs":"3D-printed, radius 18 mm, 74 mm long, 2 mm wall. Two wedge tabs clamp in slits in the brass; silicone all round.","why":"It covers the LED windows in the brass bend, and its silicone joint seals them. So far printed prototypes; a resin print of the final part is an option.","solder":""},"de":{"label":"Diffusor","what":"Weiße, hohle Viertelrund-Abdeckung in der Ecke unter dem Messingdach. Darin liegt der LED-Streifen, und sie macht aus den wenigen LEDs ein gleichmäßiges warmes Lichtband.","specs":"3D-gedruckt, Radius 18 mm, 74 mm lang, Wand 2 mm. Zwei Keillaschen klemmen in Schlitzen im Blech, rundum Silikon.","why":"Er deckt die LED-Fenster in der Kantung ab, seine Silikonfuge dichtet sie. Bisher gedruckte Prototypen; ein Harzdruck für das finale Teil ist eine Option.","solder":""}},"speaker":{"en":{"label":"Loudspeaker","what":"A small weatherproof speaker, screwed and sealed to the front wall of the box behind the brass grille. Planned use: announcements and voice replies from your phone.","specs":"VISATON K 40 SQ, 40 × 40 mm, 8 Ω, 0.5 W rated, 1 W max, 82 dB at 1 W and 1 m. Front side IP65/67 (dust- and waterproof).","why":"Sensitivity (loudness per watt) beats wattage: at 1 m it is louder than a 3 W candidate. Rated 0.5 W, it needs the amplifier at its lowest gain setting.","solder":"Two wires from the amplifier's screw terminal onto the solder lugs; keep the iron on briefly. Both wires carry signal, neither is ground (0 V)."},"de":{"label":"Lautsprecher","what":"Kleiner wetterfester Lautsprecher, hinter dem Messinggitter an die Vorderwand des Kastens geschraubt und abgedichtet. Geplant für Ansagen und Sprachantworten von deinem Handy.","specs":"VISATON K 40 SQ, 40 × 40 mm, 8 Ω, 0,5 W Nenn- und 1 W Maximalleistung, 82 dB bei 1 W in 1 m. Front IP65/67 (staub- und wasserdicht).","why":"Es zählt die Empfindlichkeit (Schalldruck pro Watt): In 1 m Abstand ist er lauter als ein 3-W-Kandidat. Bei nur 0,5 W braucht er die kleinste Verstärkerstufe.","solder":"Zwei Adern vom Schraubterminal des Verstärkers an die Lötfahnen, Lötkolben nur kurz ansetzen. Beide Adern führen Signal, keine ist Masse (0 V)."}},"grille":{"en":{"label":"Speaker grille","what":"Rows of slanted slots in the brass that let the sound out. The cavity behind them counts as outside air: rain may get in and must drain out through the lowest slots.","specs":"3 rows × 18 slots in the current CAD, each 1.5 × 5 mm at 70°. Open area 431 mm², 45% of the speaker opening.","why":"Under the roof it is the best-sheltered spot on the front. A CAD fix is pending: the cavity floor slopes toward the speaker, so water would pool there.","solder":""},"de":{"label":"Lautsprechergitter","what":"Reihen schräger Schlitze im Messing, durch die der Schall austritt. Der Hohlraum dahinter gilt als Außenluft: Regen darf hinein und muss durch die untersten Schlitze wieder ablaufen.","specs":"Im aktuellen CAD 3 Reihen × 18 Schlitze, je 1,5 × 5 mm unter 70°. Offene Fläche 431 mm², 45 % der Lautsprecheröffnung.","why":"Unter dem Dach ist die Front am besten geschützt. Eine CAD-Korrektur steht noch aus: Der Hohlraumboden fällt zum Lautsprecher hin, dort bliebe Wasser stehen.","solder":""}},"window":{"en":{"label":"Display window","what":"A portrait opening in the brass for the e-paper screen (a display that keeps its image without power). Visitors read greetings and notices through it and use its touch surface.","specs":"About 58 × 104 mm visible. Cut slightly smaller than the panel's active area (the part with pixels) of 58.32 × 103.68 mm.","why":"Slightly undersized so no panel edge shows. The panel is fragile 0.872 mm glass, so it sits behind a soft gasket and no hard O-ring (rubber sealing ring).","solder":""},"de":{"label":"Bildschirmfenster","what":"Hochformatige Öffnung im Messing für den E-Paper-Bildschirm (er behält sein Bild ohne Strom). Besucher lesen hier Begrüßung und Hinweise und bedienen die Touch-Fläche.","specs":"Sichtbar etwa 58 × 104 mm. Knapp kleiner als die aktive Fläche des Panels (der Teil mit Pixeln) von 58,32 × 103,68 mm.","why":"Knapp kleiner, damit kein Panelrand sichtbar ist. Das Panel ist empfindliches Glas von 0,872 mm, daher weiche Dichtung und kein harter O-Ring (Gummidichtring).","solder":""}},"membrane":{"en":{"label":"Mic membrane","what":"A thin self-adhesive PTFE patch (the plastic known as Teflon) stuck on the back of the brass over the mic holes. Sound passes through it and water does not, so the microphone stays dry.","specs":"B+B Thermo-Technik DAM-AD10: 10.2 mm outside, 5.5 mm open, 0.13 mm thick, IP67 (survives brief immersion).","why":"Sold as a pressure vent (breather for sealed boxes); no acoustic data is published. Voice quality through it is still to be tested on the bench.","solder":""},"de":{"label":"Mikrofonmembran","what":"Dünnes selbstklebendes PTFE-Plättchen (der als Teflon bekannte Kunststoff), hinten auf das Messing über die Mikrofonlöcher geklebt. Schall kommt durch, Wasser nicht, das Mikrofon bleibt trocken.","specs":"B+B Thermo-Technik DAM-AD10: außen Ø 10,2 mm, offen Ø 5,5 mm, 0,13 mm dick, IP67 (übersteht kurzes Untertauchen).","why":"Verkauft als Druckausgleich für dichte Gehäuse, Akustikdaten gibt es keine. Die Sprachqualität durch die Membran ist im Testaufbau noch zu prüfen.","solder":""}},"micholes":{"en":{"label":"Mic holes","what":"Two pin-size holes in the brass next to the button. The microphone behind them listens through the holes, with a waterproof membrane in between.","specs":"2 × 1.2 mm, 8 mm apart, beside the button.","why":"Next to the button they sit far from the speaker. This low spot gets the least rain shelter, so the membrane behind them matters most.","solder":""},"de":{"label":"Mikrofonlöcher","what":"Zwei nadelfeine Löcher im Messing neben dem Taster. Das Mikrofon dahinter hört durch sie, mit einer wasserdichten Membran dazwischen.","specs":"2 × Ø 1,2 mm, 8 mm Abstand, neben dem Taster.","why":"Neben dem Taster liegen sie weit vom Lautsprecher entfernt. Die Stelle ist am wenigsten vor Regen geschützt, deshalb kommt es hier auf die Membran an.","solder":""}},"button":{"en":{"label":"Push button","what":"The existing brass doorbell button, a plain contact with no electronics inside. A 10 kΩ end-of-line resistor (fitted at the button end of the wire) lets the computer tell idle from a cut wire.","specs":"Ring 48.5 mm across, recessed in a 49.5 mm hole in the brass. On the bench the contact closed for 50 to 200 ms per press.","why":"The old button had electronics inside and died from rain. Without the resistor a cut wire would read like idle, and the doorbell would fail unnoticed.","solder":"10 kΩ resistor across the button's two contacts, then shrink tubing (a sleeve that tightens when heated) over it."},"de":{"label":"Klingeltaster","what":"Der vorhandene Messing-Klingeltaster, ein einfacher Kontakt ohne Elektronik. Ein 10-kΩ-Abschlusswiderstand (sitzt am Leitungsende, hier am Taster) lässt den Rechner Ruhe und Drahtbruch unterscheiden.","specs":"Ring Ø 48,5 mm, versenkt in einem Loch von Ø 49,5 mm im Messing. Im Test schloss der Kontakt pro Druck 50 bis 200 ms.","why":"Der alte Taster mit eingebauter Elektronik ging durch Regen kaputt. Ohne den Widerstand sähe ein Drahtbruch aus wie Ruhe, die Klingel fiele unbemerkt aus.","solder":"10-kΩ-Widerstand direkt über die zwei Kontakte des Tasters löten, danach Schrumpfschlauch darüberziehen."}},"gasket":{"en":{"label":"Seals","what":"Everything that keeps rain out: a silicone bead between the steel sheet and the box, an O-ring under every screw, an O-ring behind the button, gaskets at the microphone and the speaker.","specs":"Neutral-cure silicone bead; 18 O-rings 3 × 1 mm NBR; button O-ring 26 × 2 mm; 2 gaskets 10/13 × 1 mm and an ePTFE membrane at the microphone; 2 mm closed-cell foam rubber at the speaker.","why":"The steel sheet is the water plane; the brass on top is decoration and roof. A water test of the whole box is still to come.","solder":""},"de":{"label":"Dichtungen","what":"Alles, was den Regen draußen hält: eine Silikonraupe zwischen Stahlblech und Kasten, ein O-Ring unter jeder Schraube, ein O-Ring hinter dem Taster, Dichtungen an Mikrofon und Lautsprecher.","specs":"Neutral vernetzendes Silikon; 18 O-Ringe 3 × 1 mm NBR; Taster-O-Ring 26 × 2 mm; 2 Dichtringe 10/13 × 1 mm und eine ePTFE-Membran am Mikrofon; 2 mm geschlossenzelliges Moosgummi am Lautsprecher.","why":"Das Stahlblech ist die Wasserebene; das Messing darauf ist Gestaltung und Dach. Ein Wassertest des ganzen Kastens steht noch aus.","solder":""}},"brass":{"en":{"label":"Brass front","what":"The visible face: one 2 mm brass sheet, folded forward at the top into a small rain roof. It carries the grille, screen window, mic holes and button, and hides the box behind it.","specs":"100 × 260 mm, 2 mm brass. Roof 60 mm deep, falling 5° to the front, 6 mm drip edge (lip that sheds water). Four slotted brass screws.","why":"One sheet leaves no seam at the top for rain. Only 3D-printed prototypes exist so far; the brass is ordered once the bench tests pass.","solder":""},"de":{"label":"Messingfront","what":"Die sichtbare Front: ein 2 mm starkes Messingblech, oben nach vorn zu einem kleinen Regendach gekantet. Es trägt Gitter, Bildschirmfenster, Mikrofonlöcher und Taster und verdeckt den Kasten dahinter.","specs":"100 × 260 mm, Messing 2 mm. Dach 60 mm tief, 5° Gefälle nach vorn, 6 mm Tropfkante. Vier geschlitzte Messingschrauben.","why":"Ein einziges Blech hat oben keine Naht, durch die Regen eindringt. Bisher nur 3D-gedruckte Prototypen; Messing wird erst nach bestandenen Tischtests bestellt.","solder":""}},"wt32":{"en":{"label":"Doorbell computer","what":"The wired computer that rings: it reads the doorbell button and the two climate sensors, feeds 5 V to the box, and runs its own Wi-Fi for the talk computer and the screen. Later it switches the heater and the light.","specs":"Waveshare ESP32-S3-ETH: ESP32-S3 with W5500 network chip, USB-C and the plug-on PoE Module (B). Button line on IO1 (header pin 25), I2C on IO17/IO18 (pins 34/31). Wi-Fi 'aikos' bridged into the LAN. A safe firmware in the factory partition takes over after 5 failed boots.","why":"It replaced the WT32-ETH01 planned first, which always started in download mode and so could not restart on its own after a power cut. With the bell on its own board, neither an audio crash nor a talk update can silence it.","solder":"Solder both pin header rows. Wires are soldered straight to the pins, with heat shrink over each joint."},"de":{"label":"Klingelrechner","what":"Der Rechner am Kabel, der klingelt: Er liest den Taster und die beiden Klimasensoren, versorgt den Kasten mit 5 V und spannt ein eigenes WLAN für Sprechrechner und Bildschirm auf. Später schaltet er Heizung und Licht.","specs":"Waveshare ESP32-S3-ETH: ESP32-S3 mit Netzwerkchip W5500, USB-C und aufgestecktem PoE Module (B). Klingelleitung an IO1 (Pin 25), I2C an IO17/IO18 (Pins 34/31). WLAN „aikos“, ins LAN überbrückt. Eine Notfall-Firmware in der Factory-Partition übernimmt nach 5 gescheiterten Starts.","why":"Er ersetzt den zuerst geplanten WT32-ETH01, der immer im Download-Modus startete und nach einem Stromausfall nicht von selbst wieder hochkam. Mit der Klingel auf einer eigenen Platine kann weder ein Audio-Absturz noch ein Update des Sprechteils sie stumm schalten.","solder":"Beide Stiftleisten einlöten. Die Drähte werden direkt an die Stifte gelötet, über jede Lötstelle Schrumpfschlauch."}},"sht31":{"en":{"label":"Outdoor sensor","what":"Measures the temperature and humidity of the outdoor air, in a small chamber of its own at the bottom of the box. With the box sensor it tells when moisture could condense.","specs":"SHT31-D module, measured 13.22 × 10.5 mm. Sits on a pin in the chamber lid; the chamber has two openings at the bottom and one in the side. I2C address 0x44, 3.3 V, read every 60 s from firmware 0.3.23 (written, not yet on the device).","why":"Outdoor air and box air differ; the chamber keeps the sensor out of the box's warmth while the box itself stays sealed.","solder":"Four wires through the lid's cable hole onto VIN, GND, SCL, SDA; the hole sealed with silicone."},"de":{"label":"Außensensor","what":"Misst Temperatur und Feuchte der Außenluft, in einer eigenen kleinen Kammer unten im Kasten. Zusammen mit dem Kastensensor zeigt er, wann Feuchte kondensieren könnte.","specs":"SHT31-D-Modul, gemessen 13,22 × 10,5 mm. Sitzt auf einem Stift im Kammerdeckel; die Kammer hat zwei Öffnungen unten und eine seitlich. I2C-Adresse 0x44, 3,3 V, ab Firmware 0.3.23 alle 60 s gelesen (geschrieben, noch nicht auf dem Gerät).","why":"Außenluft und Kastenluft unterscheiden sich; die Kammer hält den Sensor aus der Wärme des Kastens, während der Kasten selbst dicht bleibt.","solder":"Vier Adern durch das Kabelloch des Deckels an VIN, GND, SCL, SDA; das Loch mit Silikon abgedichtet."}},"radar":{"en":{"label":"Radar","what":"Senses whether someone stands in front of the door, through the grille. Planned: wake the screen and the light when someone comes.","specs":"HLK-LD2410C, 24 GHz, 5 V supply, UART at 3.3 V. In a spacer frame glued behind the grille block. Wired to the screen computer's edge row (VBUS, GND, RX, TX); firmware not written yet.","why":"A radar sees through plastic and a grille, needs no lens in the front, and detects a person standing still. No camera, ever.","solder":""},"de":{"label":"Radar","what":"Erkennt durch das Gitter, ob jemand vor der Tür steht. Geplant: Bildschirm und Licht wecken, wenn jemand kommt.","specs":"HLK-LD2410C, 24 GHz, 5 V Versorgung, UART mit 3,3 V. In einem Abstandsrahmen hinter dem Gitterblock eingeklebt. An der Randreihe des Bildschirmrechners verdrahtet (VBUS, GND, RX, TX); Firmware noch nicht geschrieben.","why":"Ein Radar sieht durch Kunststoff und Gitter, braucht keine Linse in der Front und erkennt auch eine stehende Person. Keine Kamera, niemals.","solder":""}},"roomkeys":{"en":{"label":"Room keys","what":"Touch keys in the rooms (the RoomKey project). They ring as soon as the doorbell computer sends a press, and holding one talks to the door.","specs":"Direct ring path: encrypted UDP from the doorbell computer, one ring per press, also while Home Assistant restarts. Talk: the shared voice link aikos_voice with the door as the arbiter.","why":"The ring and the voice do not depend on Home Assistant, and nobody needs a phone in hand to answer the door.","solder":""},"de":{"label":"Raumschlüssel","what":"Touch-Tasten in den Zimmern (das RoomKey-Projekt). Sie klingeln, sobald der Klingelrechner einen Druck schickt, und wer eine hält, spricht mit der Tür.","specs":"Direkter Klingelweg: verschlüsseltes UDP vom Klingelrechner, ein Klingeln pro Druck, auch während Home Assistant neu startet. Sprechen: die gemeinsame Sprechverbindung aikos_voice, die Tür entscheidet.","why":"Klingeln und Sprechen hängen nicht an Home Assistant, und niemand braucht ein Handy in der Hand, um an die Tür zu gehen.","solder":""}}},"edges":{"e_ups_switch":{"en":{"label":"Mains 230 V","carries":"Household mains 230 V from the UPS (a battery-backed mains supply) into the power supply of the network switch. A normal plug, indoors only. During short power cuts the doorbell keeps running."},"de":{"label":"Netz 230 V","carries":"Haushaltsnetz 230 V von der USV (Netzversorgung mit Akku) zum Netzteil des Switches. Normaler Stecker, nur im Haus. Bei kurzen Stromausfällen läuft die Klingel weiter."}},"e_switch_ha":{"en":{"label":"House network","carries":"Network data only, no power, over plugged network cables. The switch that feeds the door is part of the house network, and through it the door reaches the Home Assistant server."},"de":{"label":"Hausnetz","carries":"Nur Netzwerkdaten, kein Strom, über gesteckte Netzwerkkabel. Der Switch, der die Tür versorgt, hängt im Hausnetz. Darüber erreicht die Tür den Home-Assistant-Server."}},"e_ap_ha":{"en":{"label":"Access point cable","carries":"Network data only, no power. The WiFi access point is plugged into the house network by cable. The screen computer's WiFi traffic reaches Home Assistant this way."},"de":{"label":"Access-Point-Kabel","carries":"Nur Netzwerkdaten, kein Strom. Der WLAN-Access-Point steckt per Kabel im Hausnetz. So erreicht der WLAN-Verkehr des Bildschirmrechners Home Assistant."}},"e_switch_surge":{"en":{"label":"PoE: data + power","carries":"Short patch cable from the switch's PoE port into the surge protector (it diverts lightning surges to earth). PoE (Power over Ethernet) puts data and about 48 V on one cable. PoE is switched on for this port."},"de":{"label":"PoE: Daten + Strom","carries":"Kurzes Patchkabel vom PoE-Port des Switches in den Überspannungsschutz (leitet Überspannung durch Blitz zur Erde ab). PoE (Power over Ethernet) bringt Daten und etwa 48 V über ein Kabel. PoE ist hier eingeschaltet."}},"e_surge_earth":{"en":{"label":"Earth wire","carries":"Earth wire from the surge protector's earth screw to the house's protective earth (the bonding bar). Current flows here only during a lightning surge. Without it the protector does nothing. Electrician's job."},"de":{"label":"Erdungsleitung","carries":"Erdungsleitung von der Erdungsschraube des Überspannungsschutzes zur Potentialausgleichsschiene (Schutzerde des Hauses). Strom fließt nur bei Blitzüberspannungen. Ohne sie wirkt der Schutz nicht. Sache des Elektrikers."}},"e_surge_cable":{"en":{"label":"To outdoor cable","carries":"The outdoor cable's moulded plug goes into the protector's outdoor-side port. From here PoE (data plus about 48 V power on one cable) runs about 10 m through the wall to the box."},"de":{"label":"Zum Außenkabel","carries":"Der angespritzte Stecker des Außenkabels steckt im außenseitigen Port des Überspannungsschutzes. Ab hier läuft PoE (Daten und etwa 48 V auf einem Kabel) rund 10 m durch die Wand zum Kasten."}},"e_cable_gland":{"en":{"label":"Through the gland","carries":"PoE (data plus about 48 V) enters the box through a split cable gland, a sealed cable entry that opens. The plug passes the opened gland, then the slit insert closes watertight around the cable."},"de":{"label":"Kabelverschraubung","carries":"PoE (Daten und etwa 48 V) kommt durch eine teilbare Kabelverschraubung (dichte Kabeleinführung) in den Kasten. Der Stecker passt durch die geöffnete Verschraubung, dann schließt der geschlitzte Einsatz dicht ums Kabel."}},"e_gland_splitter":{"en":{"label":"Into the box","carries":"The cable comes up through the gland in the bottom, runs in an S-curve along five eyelets (strain relief) and plugs into the doorbell computer."},"de":{"label":"In den Kasten","carries":"Das Kabel kommt durch die Verschraubung im Boden, läuft in einer S-Kurve an fünf Ösen entlang (Zugentlastung) und steckt im Klingelrechner."}},"e_fuse_heater":{"en":{"label":"Fuse to heater (planned)","carries":"Heater current flows through the 73 °C thermal fuse, then the pad, in series. Crimp it: soldering heat can blow the fuse."},"de":{"label":"Sicherung zur Heizung (geplant)","carries":"Der Heizstrom fließt durch die 73-°C-Thermosicherung und dann durch das Pad, in Reihe. Crimpen: Lötwärme kann die Sicherung auslösen."}},"e_heater_mosfet":{"en":{"label":"Heater minus side (planned)","carries":"The heater's second lead to the MOSFET's drain on the distribution board. When the computer says 'heat', the MOSFET closes the path to ground."},"de":{"label":"Minus der Heizung (geplant)","carries":"Die zweite Zuleitung der Heizung an den Drain des MOSFET auf der Verteilerplatine. Sagt der Rechner „heizen“, schließt der MOSFET den Weg zur Masse."}},"e_rail_ws":{"en":{"label":"5 V to talk computer","carries":"5 V straight from the doorbell computer's pin 40 into the talk computer's 5Vin pin, and ground from pin 13: both sit on the same carrier, so the wires never move."},"de":{"label":"5 V zum Sprechrechner","carries":"5 V direkt von Pin 40 des Klingelrechners an den 5Vin-Pin des Sprechrechners, Masse von Pin 13: Beide sitzen auf demselben Träger, die Drähte bewegen sich nie."}},"e_rail_lilygo":{"en":{"label":"5 V to screen","carries":"5 V and ground from the distribution board into the screen computer's edge row: VBUS (hole 1) and GND (hole 3), thick wires with 15 cm reserve because the display comes off with the front sheet."},"de":{"label":"5 V zum Bildschirm","carries":"5 V und Masse von der Verteilerplatine in die Randreihe des Bildschirmrechners: VBUS (Loch 1) und GND (Loch 3), dicke Adern mit 15 cm Reserve, weil das Display mit dem Frontblech abgenommen wird."}},"e_rail_amp":{"en":{"label":"5 V to amplifier","carries":"5 V soldered to the amplifier's Vin (supply input). Two capacitors (charge stores that smooth the supply), 10 µF and 0.1 µF, sit at its pins against crackling. The 10 µF is polarised, stripe to ground; still to buy."},"de":{"label":"5 V zum Verstärker","carries":"5 V an Vin (Versorgungseingang) des Verstärkers, gelötet. An den Pins sitzen gegen Knistern zwei Kondensatoren (glätten die Versorgung), 10 µF und 0,1 µF. Der 10-µF-Elko ist gepolt, Markierung an Masse; noch zu kaufen."}},"e_rail_shifter":{"en":{"label":"5 V to level shifter","carries":"5 V supply, soldered, for the level shifter chip (it raises the 3.3 V LED data signal to the 5 V the strip expects). The chip sits on a small perfboard."},"de":{"label":"5 V zum Pegelwandler","carries":"5-V-Versorgung, gelötet, für den Pegelwandler-Chip (hebt das 3,3-V-Datensignal der LEDs auf die 5 V, die der Streifen erwartet). Der Chip sitzt auf einer kleinen Lochrasterplatine."}},"e_rail_ledcap":{"en":{"label":"5 V to LED strip","carries":"5 V and ground (0 V), soldered, towards the LED strip. A 1000 µF electrolytic capacitor (a charge store) sits across +5 V and ground at the strip and absorbs the switch-on surge. Its stripe marks minus."},"de":{"label":"5 V zum LED-Streifen","carries":"5 V und Masse (0 V), gelötet, zum LED-Streifen. Am Streifen liegt ein 1000-µF-Elko (Elektrolytkondensator, Ladungsspeicher) zwischen +5 V und Masse und fängt den Einschaltstrom ab. Die Markierung am Elko zeigt Minus."}},"e_ledcap_led":{"en":{"label":"Strip power pads","carries":"5 V and ground (0 V) soldered to the strip's +5V and GND pads (solder spots) at the end where the arrow starts. The 1000 µF capacitor sits here."},"de":{"label":"LED-Versorgung","carries":"5 V und Masse (0 V) sind an die Lötpads +5V und GND des Streifens gelötet, an dem Ende, an dem der Pfeil beginnt. Der 1000-µF-Kondensator sitzt hier."}},"e_gnd_ws":{"en":{"label":"Talk computer ground","carries":"A ground pin (0 V) on the talk computer's pin header (its row of connection pins) goes to the common ground point. The board's current returns this way, and its signals are measured against it."},"de":{"label":"Masse Sprechrechner","carries":"Ein Massepin (0 V) an der Stiftleiste (Anschlusspinreihe) des Sprechrechners führt zum gemeinsamen Massepunkt. Darüber fließt der Strom der Platine zurück, und ihre Signale beziehen sich darauf."}},"e_gnd_lilygo":{"en":{"label":"Screen ground","carries":"Ground (0 V, the return path for current) of the screen computer. It runs in its USB-C power lead next to the 5 V and ends at the common ground point."},"de":{"label":"Masse Bildschirm","carries":"Masse (0 V, Rückweg des Stroms) des Bildschirmrechners. Sie läuft im USB-C-Stromkabel neben den 5 V und endet am gemeinsamen Massepunkt."}},"e_gnd_mosfet":{"en":{"label":"Heater return","carries":"The heater switch (a MOSFET module) sends the heater current back to ground (0 V) through a screw terminal. Its signal side also needs the computer's ground."},"de":{"label":"Rückweg Heizung","carries":"Der Heizungsschalter (MOSFET-Modul) führt den Heizstrom über eine Schraubklemme zurück zur Masse (0 V). Auch seine Signalseite braucht die Masse des Rechners."}},"e_gnd_splitter":{"en":{"label":"Box ground","carries":"The doorbell computer's GND (header pin 33) to the GND rail of the distribution board, a thick soldered wire: the ground reference (0 V) for everything in the box."},"de":{"label":"Masse des Kastens","carries":"GND des Klingelrechners (Pin 33) an die Masseschiene der Verteilerplatine, ein dicker gelöteter Draht: der Massebezug (0 V) für alles im Kasten."}},"e_ws_mic_3v3":{"en":{"label":"3.3 V to microphone","carries":"3.3 V and ground (0 V) for the digital microphone, taken from the talk computer's pin header (its row of connection pins). This 3.3 V is made on the board from its 5 V."},"de":{"label":"3,3 V zum Mikrofon","carries":"3,3 V und Masse (0 V) für das digitale Mikrofon, abgegriffen an der Stiftleiste (Anschlusspinreihe) des Sprechrechners. Diese 3,3 V erzeugt die Platine aus ihren 5 V."}},"e_ws_amp_i2s":{"en":{"label":"I2S audio to amp","carries":"Digital audio on I2S (a three-wire audio bus): BCLK (bit clock), LRC (word clock) and DIN (data), from the talk computer to the amplifier over header pins (plug-in pin rows). Pins not chosen yet."},"de":{"label":"I2S zum Verstärker","carries":"Digitaler Ton über I2S (ein dreiadriger Audiobus): BCLK (Bittakt), LRC (Worttakt) und DIN (Daten), vom Sprechrechner zum Verstärker über Stiftleisten. Die Pins sind noch nicht festgelegt."}},"e_mic_ws_i2s":{"en":{"label":"I2S audio from mic","carries":"Digital audio on I2S (a three-wire audio bus). The talk computer drives SCK (clock) and WS (word select); the microphone answers with audio on SD (data). Attached by header pins (plug-in pin rows); pins not chosen yet."},"de":{"label":"I2S vom Mikrofon","carries":"Digitaler Ton über I2S (ein dreiadriger Audiobus). Der Sprechrechner gibt SCK (Takt) und WS (Wortauswahl) vor, das Mikrofon liefert den Ton auf SD (Daten). Über Stiftleisten, die Pins sind noch nicht festgelegt."}},"e_amp_speaker":{"en":{"label":"Speaker wires","carries":"Amplified audio on two wires, screwed into the amplifier's screw terminal and soldered to the speaker's lugs (solder tabs). Both wires carry signal and neither is ground (0 V), so never connect either to ground."},"de":{"label":"Lautsprecherkabel","carries":"Verstärkter Ton auf zwei Adern: am Verstärker in die Schraubklemme, am Lautsprecher an die Lötfahnen gelötet. Beide Adern führen Signal, keine ist Masse (0 V). Deshalb keine davon mit Masse verbinden."}},"e_shifter_led":{"en":{"label":"LED data, 5 V","carries":"The same LED data, now at 5 V, runs through the 330 Ω resistor into the strip's DIN pad (the data-in solder pad). DIN is at the end the printed arrows point away from."},"de":{"label":"LED-Daten, 5 V","carries":"Dieselben LED-Daten, jetzt mit 5 V, laufen über den 330-Ω-Widerstand zum DIN-Pad des Streifens (Lötfläche für den Dateneingang). DIN liegt an dem Ende, von dem die aufgedruckten Pfeile wegzeigen."}},"e_button_line":{"en":{"label":"Button line","carries":"Two soldered wires from the button to the line circuit. The 10 kΩ end-of-line resistor across the button's contacts lets the computer tell a cut wire (about 3.1 to 3.3 V) from idle (about 1.73 V). Pressed: about 0.30 V."},"de":{"label":"Klingelleitung","carries":"Zwei gelötete Adern vom Taster zur Tasterschaltung. Mit dem 10-kΩ-Abschlusswiderstand über den Tasterkontakten unterscheidet der Rechner einen Drahtbruch (etwa 3,1–3,3 V) von Ruhe (etwa 1,73 V). Gedrückt: etwa 0,30 V."}},"e_lilygo_ap":{"en":{"label":"Screen Wi-Fi","carries":"The screen computer joins the doorbell computer's own Wi-Fi 'aikos', centimetres away, which is bridged into the house network. The house Wi-Fi is the fallback."},"de":{"label":"WLAN des Bildschirms","carries":"Der Bildschirmrechner hängt im eigenen WLAN „aikos“ des Klingelrechners, Zentimeter entfernt, das ins Hausnetz überbrückt ist. Das Haus-WLAN ist die Rückfallebene."}},"e_ws_ha":{"en":{"label":"Talk link","carries":"The talk computer's connection to Home Assistant over WiFi: the ESPHome API plus the call itself (speech both ways, passed on by Home Assistant to your phone). A call only ever starts after a visitor presses the button; auto-answer stays off."},"de":{"label":"Sprechverbindung","carries":"Die Verbindung des Sprechrechners zu Home Assistant per WLAN: die ESPHome-API und das Gespräch selbst (Sprache in beide Richtungen, von Home Assistant an dein Handy weitergegeben). Ein Gespräch beginnt nur, nachdem jemand den Taster gedrückt hat; automatisches Annehmen bleibt aus."}},"e_ha_lilygo":{"en":{"label":"Screen content","carries":"Home Assistant sends the screen what to show and the call transcripts, and touch events travel back the same way. Runs as an ESPHome connection over Wi-Fi."},"de":{"label":"Bildschirminhalt","carries":"Home Assistant schickt dem Bildschirm, was er zeigen soll, und die Mitschriften der Gespräche; Berührungen gehen denselben Weg zurück. Läuft als ESPHome-Verbindung über WLAN."}},"e_ha_phone":{"en":{"label":"Ring notification","carries":"A push notification through the Home Assistant companion app on the loud 'Klingel' (doorbell) channel. High priority and ttl 0 ask for immediate delivery, target under 1 s. A silence toggle switches to a quiet channel."},"de":{"label":"Klingel-Push","carries":"Push-Benachrichtigung über die Companion-App von Home Assistant im lauten Kanal „Klingel“. Hohe Priorität und ttl 0 fordern sofortige Zustellung (Ziel unter 1 s). Ein Stummschalter wechselt auf einen leisen Kanal."}},"e_ha_speakers":{"en":{"label":"Chime (planned)","carries":"Planned: on a ring, Home Assistant plays the doorbell chime on the house WiFi speakers. The speakers themselves are also still planned."},"de":{"label":"Gong (geplant)","carries":"Geplant: Bei einem Klingeln spielt Home Assistant den Gong auf den WLAN-Lautsprechern im Haus. Die Lautsprecher selbst sind ebenfalls erst geplant."}},"e_ws_transcribe":{"en":{"label":"Call audio","carries":"During a call a copy of the door audio goes to the transcription server. It is never muted, so the transcript covers both sides; it is not recorded."},"de":{"label":"Gesprächston","carries":"Während eines Gesprächs geht eine Kopie des Türtons an den Transkriptions-Server. Sie wird nie stummgeschaltet, damit die Mitschrift beide Seiten enthält; nichts wird aufgezeichnet."}},"e_transcribe_telegram":{"en":{"label":"Telegram (planned)","carries":"Planned: after the transcription at home, a Telegram bot sends the audio together with its transcript. From here on the audio passes through Telegram's servers."},"de":{"label":"Telegram (geplant)","carries":"Geplant: Nach der Umwandlung in Text, die zu Hause läuft, schickt ein Telegram-Bot die Aufnahme samt Abschrift. Ab hier läuft der Ton über die Server von Telegram."}},"e_telegram_phone":{"en":{"label":"Messages (planned)","carries":"Planned: the voice message and its transcript arrive in Telegram on your phone. A voice note you send back travels the other way and is played through the door speaker."},"de":{"label":"Nachricht (geplant)","carries":"Geplant: Sprachnachricht und Abschrift kommen in Telegram auf deinem Handy an. Eine Sprachnachricht als Antwort nimmt den umgekehrten Weg und wird am Türlautsprecher abgespielt."}},"e_ha_ws_play":{"en":{"label":"Playback (planned)","carries":"Planned: Home Assistant sends a reply or an announcement to the talk computer, which plays it through the door speaker. On the door side this uses the ESPHome media player."},"de":{"label":"Wiedergabe (geplant)","carries":"Geplant: Home Assistant schickt eine Antwort oder Durchsage an den Sprechrechner, der sie über den Türlautsprecher abspielt. Auf der Türseite übernimmt das der Media Player von ESPHome."}},"e_ws_app":{"en":{"label":"Live talk (planned)","carries":"Planned for later: a live push-to-talk stream (you talk while you hold a control) from the door microphone to a relay (a server that forwards it), possibly in the family app. One direction at a time."},"de":{"label":"Live-Ton (geplant)","carries":"Für später geplant: ein Live-Tonstrom per Push-to-Talk (sprechen, solange man drückt) vom Türmikrofon zu einem Relay (ein Server, der ihn weiterleitet), eventuell in der Familien-App. Immer nur in eine Richtung."}},"e_app_speakers":{"en":{"label":"Live voice (planned)","carries":"Planned for later: the relay plays the visitor's voice live on the house speakers. The relay and the speakers are both still planned."},"de":{"label":"Stimme (geplant)","carries":"Für später geplant: Das Relay spielt die Stimme des Besuchers live auf den Lautsprechern im Haus ab. Relay und Lautsprecher sind beide erst geplant."}},"e_app_ha":{"en":{"label":"App API (planned)","carries":"Planned for later: the self-hosted family app offers Home Assistant an API for status and control. Home Assistant stays the automation hub."},"de":{"label":"App-API (geplant)","carries":"Für später geplant: Die selbst gehostete Familien-App bietet Home Assistant eine API für Status und Steuerung. Die Automationen bleiben in Home Assistant."}},"e_speaker_grille":{"en":{"label":"Behind the grille","carries":"The speaker is fixed with 4 screws to the box's front wall behind the grille and sealed against it. Sound leaves through the slanted slots. The space in front of the speaker counts as outside air."},"de":{"label":"Hinter dem Gitter","carries":"Der Lautsprecher ist mit 4 Schrauben hinter dem Gitter an die Vorderwand des Kastens geschraubt und dagegen abgedichtet. Der Schall tritt durch die Schrägschlitze aus. Der Raum davor zählt als Außenluft."}},"e_lilygo_window":{"en":{"label":"Behind the window","carries":"The screen sits behind the display window with a soft gasket (a compressible seal) around it. The panel is thin glass (0.872 mm), so a hard O-ring (rubber sealing ring) is ruled out."},"de":{"label":"Hinter dem Fenster","carries":"Der Bildschirm sitzt hinter dem Fenster, rundum mit einer weichen Dichtung. Das Panel ist dünnes Glas (0,872 mm), ein harter O-Ring (Gummidichtring) kommt deshalb nicht in Frage."}},"e_heater_lilygo":{"en":{"label":"Heater at the screen","carries":"The heater pad lies between the e-paper panel and its board; printed spacers fill the rest of the gap so the panel does not give way when pressed."},"de":{"label":"Heizung am Bildschirm","carries":"Das Heizpad liegt zwischen dem E-Paper-Panel und seiner Platine; gedruckte Abstandsstücke füllen den Rest des Spalts, damit das Panel beim Drücken nicht nachgibt."}},"e_mic_membrane":{"en":{"label":"Mic behind membrane","carries":"The microphone sits behind the membrane with the smallest possible air gap. Its labelled side carries the sound hole and faces forward."},"de":{"label":"Mikrofon an Membran","carries":"Das Mikrofon sitzt hinter der Membran, mit möglichst kleinem Luftspalt. Die beschriftete Seite trägt das Schallloch und zeigt nach vorn."}},"e_membrane_holes":{"en":{"label":"Over the mic holes","carries":"The self-adhesive PTFE membrane is stuck behind the brass over the two 1.2 mm mic holes; sound passes, water does not. How it covers both holes, 8 mm apart, is not solved yet. Voice quality: bench test pending."},"de":{"label":"Über Mikrofonlöchern","carries":"Die selbstklebende PTFE-Membran klebt hinten auf dem Messing über den zwei Mikrofonlöchern (1,2 mm). Schall kommt durch, Wasser nicht. Wie sie beide Löcher (8 mm Abstand) abdeckt, ist noch offen; Tischtest steht aus."}},"e_led_diffusor":{"en":{"label":"Strip in diffuser","carries":"The LED strip lies inside the printed diffuser (a cover that spreads the light evenly). Its cable enters through a window in the brass bend."},"de":{"label":"Streifen im Diffusor","carries":"Der LED-Streifen liegt im gedruckten Diffusor (eine Abdeckung, die das Licht gleichmäßig verteilt). Sein Kabel kommt durch ein Fenster in der Kantung des Messingblechs."}},"e_gasket_brass":{"en":{"label":"Rim seal","carries":"The brass front presses on the 2.0 mm gasket cord (a sealing cord) in a groove of the box rim. This seals the box against rain."},"de":{"label":"Randdichtung","carries":"Die Messingfront drückt auf die Dichtschnur (2,0 mm) in der Nut am Kastenrand. So ist der Kasten gegen Regen dicht."}},"e_button_brass":{"en":{"label":"Button in the front","carries":"The button's 48.5 mm ring sits recessed in the brass front, with an O-ring (a rubber sealing ring) behind it that seals it. Size 26 × 2 mm."},"de":{"label":"Taster in der Front","carries":"Der Ring des Tasters (48,5 mm) sitzt vertieft in der Messingfront, dahinter dichtet ein O-Ring (Gummidichtring) ab. Größe 26 × 2 mm."}},"e_splitter_wt32":{"en":{"label":"Plugged on","carries":"The PoE module sits on the doorbell computer's pin header. The network data goes straight into the board's RJ45 socket; the module only takes the power off the same cable."},"de":{"label":"Aufgesteckt","carries":"Das PoE-Modul steckt auf der Stiftleiste des Klingelrechners. Die Netzwerkdaten gehen direkt in die RJ45-Buchse der Platine; das Modul nimmt nur den Strom vom selben Kabel ab."}},"e_wt32_bme_3v3":{"en":{"label":"3.3 V to sensor","carries":"3.3 V and ground (0 V) for the climate sensor, from the doorbell computer's pin header (its row of connection pins). The board makes this 3.3 V from its own 5 V."},"de":{"label":"3,3 V zum Sensor","carries":"3,3 V und Masse (0 V) für den Klimasensor, von der Stiftleiste (Anschlusspinreihe) des Klingelrechners. Die Platine erzeugt diese 3,3 V selbst aus ihren 5 V."}},"e_wt32_bme_i2c":{"en":{"label":"I2C sensor bus","carries":"Two wires of the I2C bus (a slow two-wire chip bus) on header pins: SDA carries data, SCL the clock. The sensor reports box temperature and humidity this way. Pins not chosen yet."},"de":{"label":"I2C-Sensorbus","carries":"Zwei Adern des I2C-Busses (langsamer Zweidraht-Bus zwischen Chips) an der Stiftleiste: SDA für Daten, SCL für den Takt. So meldet der Sensor Temperatur und Feuchte im Kasten. Pins noch nicht festgelegt."}},"e_wt32_line_3v3":{"en":{"label":"3.3 V for pull-up","carries":"3.3 V, soldered, for the 10 kΩ pull-up (a resistor that holds the line at a known voltage) of the button line. Without it the input floats (drifts freely) and reports phantom rings."},"de":{"label":"3,3 V für Pull-up","carries":"3,3 V, gelötet, für den 10-kΩ-Pull-up (ein Widerstand, der die Leitung auf einer bekannten Spannung hält) der Klingelleitung. Ohne ihn hängt der Eingang in der Luft und meldet Phantom-Klingeln."}},"e_line_wt32":{"en":{"label":"Line voltage","carries":"The measured line voltage goes to IO1, an analog pin on ADC1 (one of the chip's two voltage-measuring units), tested on the bench. The chip's own pull-up is on too, so a loose signal wire reads as a cut line, not as a press."},"de":{"label":"Leitungsspannung","carries":"Die gemessene Leitungsspannung geht an IO1, einen Analogpin von ADC1 (einer der zwei Spannungsmesser im Chip), auf dem Tisch getestet. Der chipeigene Pull-up ist zusätzlich an: Ein loses Signalkabel sieht deshalb wie eine unterbrochene Leitung aus, nicht wie ein Druck."}},"e_wt32_shifter":{"en":{"label":"LED data, 3.3 V","carries":"The colour data for the LED strip as a 3.3 V signal from one main-computer pin to the level shifter (a chip that raises the signal to 5 V). Attached by a header pin; which pin is not chosen yet."},"de":{"label":"LED-Daten, 3,3 V","carries":"Die Farbdaten für den LED-Streifen als 3,3-V-Signal von einem Pin des Klingelrechners zum Pegelwandler (ein Chip, der das Signal auf 5 V anhebt). Über Stiftleiste, der Pin ist noch nicht festgelegt."}},"e_wt32_mosfet":{"en":{"label":"Heater on/off (planned)","carries":"One pin of the doorbell computer to the MOSFET's gate, with a pull-down that keeps the heater off during boot."},"de":{"label":"Heizung an/aus (geplant)","carries":"Ein Pin des Klingelrechners an das Gate des MOSFET, mit einem Pull-down, der die Heizung beim Start aus hält."}},"e_wt32_ha":{"en":{"label":"ESPHome API","carries":"The encrypted ESPHome API connection from the doorbell computer to Home Assistant, over the one cable and the house network. The ring event goes out first, before any local feedback at the door."},"de":{"label":"ESPHome-API","carries":"Die verschlüsselte ESPHome-API-Verbindung vom Klingelrechner zu Home Assistant, über das eine Kabel und das Hausnetz. Das Klingelereignis wird zuerst gesendet, noch vor jeder Rückmeldung an der Tür."}},"e_rail_wt32":{"en":{"label":"5 V to doorbell computer","carries":"5 V into the doorbell computer's VSYS pin (its supply input on the pin row), or from its own PoE module if that powers the box. Check with a meter before the first power-up."},"de":{"label":"5 V zum Klingelrechner","carries":"5 V an den VSYS-Pin (Versorgungseingang an der Stiftleiste) des Klingelrechners, oder aus seinem eigenen PoE-Modul, falls das den Kasten versorgt. Vor dem ersten Einschalten nachmessen."}},"e_gnd_wt32":{"en":{"label":"Doorbell computer ground","carries":"A ground pin (0 V) of the doorbell computer to the common ground point. The button line gets its own return wire to this board's GND pin, away from the heater and LED currents."},"de":{"label":"Masse Klingelrechner","carries":"Ein Massepin (0 V) des Klingelrechners zum gemeinsamen Massepunkt. Die Klingelleitung bekommt einen eigenen Rückleiter an den GND-Pin dieser Platine, getrennt von den Strömen der Heizung und der LEDs."}},"e_ws_ap":{"en":{"label":"Talk computer Wi-Fi","carries":"The talk computer joins the Wi-Fi 'aikos' of the doorbell computer: −29 dBm in the box. The house Wi-Fi is the fallback."},"de":{"label":"WLAN des Sprechrechners","carries":"Der Sprechrechner hängt im WLAN „aikos“ des Klingelrechners: −29 dBm im Kasten. Das Haus-WLAN ist die Rückfallebene."}},"e_splitter_rail":{"en":{"label":"5 V into the box","carries":"The PoE module's 5 V, taken from the doorbell computer's header pin 40 (VBUS) with a thick soldered wire to the 5 V rail of the distribution board."},"de":{"label":"5 V in den Kasten","carries":"Die 5 V des PoE-Moduls, abgenommen an Pin 40 (VBUS) des Klingelrechners, über einen dicken gelöteten Draht zur 5-V-Schiene der Verteilerplatine."}},"e_rail_fuse":{"en":{"label":"Heater supply (planned)","carries":"Planned: the heater's 5 V lead from the distribution board through the 73 °C one-shot fuse."},"de":{"label":"Heizungsversorgung (geplant)","carries":"Geplant: die 5-V-Zuleitung der Heizung von der Verteilerplatine durch die 73-°C-Einmalsicherung."}},"e_wt32_sht_i2c":{"en":{"label":"Outdoor sensor bus","carries":"The same I2C bus as the box sensor, from the distribution board's SDA/SCL strips through the chamber lid to the SHT31-D, address 0x44."},"de":{"label":"Bus zum Außensensor","carries":"Derselbe I2C-Bus wie beim Kastensensor, von den SDA/SCL-Leisten der Verteilerplatine durch den Kammerdeckel zum SHT31-D, Adresse 0x44."}},"e_wt32_sht_3v3":{"en":{"label":"3.3 V outdoor sensor","carries":"3.3 V from the doorbell computer's pin 36 over the 3V3 rail of the distribution board. Never 5 V: the module's pull-ups would put 5 V on the computer's pins."},"de":{"label":"3,3 V Außensensor","carries":"3,3 V von Pin 36 des Klingelrechners über die 3V3-Schiene der Verteilerplatine. Nie 5 V: die Pull-ups des Moduls legten sonst 5 V an die Pins des Rechners."}},"e_lilygo_radar_5v":{"en":{"label":"5 V radar","carries":"The radar takes 5 V from the second VBUS hole of the screen computer's edge row, and ground from a GND hole of the same row."},"de":{"label":"5 V Radar","carries":"Das Radar nimmt 5 V vom zweiten VBUS-Loch der Randreihe des Bildschirmrechners und Masse von einem GND-Loch derselben Reihe."}},"e_radar_lilygo":{"en":{"label":"Radar data","carries":"The radar's serial line (TX to the screen's RX, RX to its TX). Firmware still to come: these holes are the chip's UART0, which still carries the screen's log."},"de":{"label":"Radardaten","carries":"Die serielle Leitung des Radars (TX an RX des Bildschirms, RX an TX). Firmware kommt noch: diese Löcher sind UART0 des Chips, über den noch das Log des Bildschirms läuft."}},"e_wt32_ws_watch":{"en":{"label":"Supervision wires","carries":"Four wires on the shared carrier: each computer toggles a heartbeat pin once per second, and if the other one's heartbeat stops for 30 s it pulls the other's reset line (at most 3 times an hour)."},"de":{"label":"Wächter-Leitungen","carries":"Vier Leitungen auf dem gemeinsamen Träger: Jeder Rechner schaltet einmal pro Sekunde einen Herzschlag-Pin um, und bleibt der des anderen 30 s aus, zieht er dessen Reset-Leitung (höchstens 3-mal pro Stunde)."}},"e_wt32_roomkeys":{"en":{"label":"Direct ring","carries":"Every press goes, at the same moment as to Home Assistant, as encrypted UDP straight to the room keys. Each key rings once per press, whichever path arrives first."},"de":{"label":"Direktes Klingeln","carries":"Jeder Druck geht, im selben Moment wie an Home Assistant, als verschlüsseltes UDP direkt an die Raumschlüssel. Jeder Schlüssel klingelt einmal pro Druck, egal welcher Weg zuerst ankommt."}},"e_wt32_lilygo":{"en":{"label":"Direct ring to the screen","carries":"The same direct packet reaches the door screen, which shows the ring page with 'Sprechen' even if Home Assistant is away. 20 of 20 in a storm test."},"de":{"label":"Direkt zum Bildschirm","carries":"Dasselbe direkte Paket erreicht den Türbildschirm, der die Klingelseite mit „Sprechen“ zeigt, auch wenn Home Assistant weg ist. 20 von 20 im Sturmtest."}},"e_ws_roomkeys":{"en":{"label":"Voice link","carries":"The shared voice link aikos_voice: the door decides when a call starts and ends; room keys and door talk directly, Home Assistant is not in the audio path."},"de":{"label":"Sprechverbindung","carries":"Die gemeinsame Sprechverbindung aikos_voice: Die Tür entscheidet, wann ein Gespräch beginnt und endet; Raumschlüssel und Tür sprechen direkt, Home Assistant ist nicht im Tonweg."}},"e_transcribe_ha":{"en":{"label":"Transcript","carries":"The text of what was said goes to Home Assistant, which passes it to the door screen as chat bubbles."},"de":{"label":"Mitschrift","carries":"Der Text des Gesagten geht an Home Assistant, das ihn als Sprechblasen an den Türbildschirm weitergibt."}}},"tours":{"ring":{"en":{"title":"Someone rings the doorbell","steps":["A visitor presses the brass button. Its contacts close and bypass the 10 kΩ resistor soldered across them, so the voltage on the button line falls from about 2.0 V to about 0.4 V.","The doorbell computer reads the line voltage every millisecond on an analog input (a pin that measures voltage). Below 1.30 V counts as pressed, and only above 1.60 V and after 60 ms as released again, so a wobbly contact still counts once.","The press goes out twice at the same moment: to Home Assistant over the one network cable, and directly to the room keys and the door screen as encrypted packets. Each receiver rings once per press, whichever path arrives first, even while Home Assistant restarts.","Home Assistant pushes a notification to your phone on a loud channel. A silence toggle switches to a quiet channel.","The door screen shows the ring page with a 'Sprechen' (talk) button, 1.4 s after the press. Nothing on the ring path waits for the screen."]},"de":{"title":"Jemand klingelt","steps":["Jemand drückt den Messingtaster. Seine Kontakte schließen und überbrücken den 10-kΩ-Widerstand, der direkt über ihnen sitzt; die Spannung auf der Klingelleitung fällt von etwa 2,0 V auf etwa 0,4 V.","Der Klingelrechner liest die Spannung jede Millisekunde an einem Analogeingang (einem Pin, der Spannung misst). Unter 1,30 V gilt als gedrückt, erst über 1,60 V und nach 60 ms wieder als losgelassen; ein wackliger Kontakt zählt so nur einmal.","Der Druck geht im selben Moment zweimal hinaus: über das eine Netzwerkkabel an Home Assistant und direkt als verschlüsselte Pakete an die Raumschlüssel und den Türbildschirm. Jeder Empfänger klingelt einmal pro Druck, egal welcher Weg zuerst ankommt, auch während Home Assistant neu startet.","Home Assistant schickt eine Benachrichtigung über einen lauten Kanal aufs Handy. Ein Stumm-Schalter wechselt auf einen leisen Kanal.","Der Türbildschirm zeigt 1,4 s nach dem Druck die Klingelseite mit der Taste „Sprechen“. Nichts auf dem Klingelweg wartet auf den Bildschirm."]}},"power":{"en":{"title":"Where the power comes from","steps":["In the technical room, mains power (230 V) feeds the UPS (a battery-backed power supply), and the UPS feeds the network switch. A short power cut does not stop the doorbell.","The switch puts about 48 V onto the network cable next to the data (PoE, Power over Ethernet). The high voltage keeps the current small, so little is lost on the way through the surge protector and the wall.","In the box, the PoE module plugged onto the doorbell computer takes the power off the cable and makes 5 V. There is no separate splitter and no 12 V. Measured at the switch port: 4.82 W with everything running in the box.","The distribution board, a small soldered perfboard, splits the 5 V to the screen and the amplifier; the talk computer takes its 5 V straight from the doorbell computer on their shared carrier. The screen passes 5 V on to the radar.","The doorbell and talk computers each make their own 3.3 V: the doorbell computer feeds the two climate sensors and the pull-up of the button line, the talk computer feeds the microphone.","Planned: the heater pad (5 V, about 5 W) on the 5 V rail, through a 73 °C thermal fuse and a MOSFET switch on its minus side. On the bench it ran on the PoE module at 9.37 W; the rail then sags to 4.8 V, so heater and light will share a limit.","Every ground (0 V, the shared return path for all currents) meets on the distribution board's ground rail. Signals are measured against ground, so without this common point the parts could not read each other."]},"de":{"title":"Woher der Strom kommt","steps":["Im Technikraum speist der Netzstrom (230 V) die USV (eine Stromversorgung mit Akku), und die USV den Netzwerk-Switch. Ein kurzer Stromausfall hält die Klingel nicht an.","Der Switch legt etwa 48 V neben die Daten auf das Netzwerkkabel (PoE, Power over Ethernet). Die hohe Spannung hält den Strom klein, so geht auf dem Weg durch Überspannungsschutz und Wand wenig verloren.","Im Kasten nimmt das PoE-Modul, das auf dem Klingelrechner steckt, den Strom vom Kabel und macht daraus 5 V. Es gibt keinen eigenen Splitter und keine 12 V. Gemessen am Switch-Port: 4,82 W mit allem, was im Kasten läuft.","Die Verteilerplatine, eine kleine gelötete Lochrasterplatine, verteilt die 5 V an Bildschirm und Verstärker; der Sprechrechner nimmt seine 5 V direkt vom Klingelrechner auf dem gemeinsamen Träger. Der Bildschirm gibt 5 V an das Radar weiter.","Klingel- und Sprechrechner machen jeweils ihre eigenen 3,3 V: Der Klingelrechner versorgt die beiden Klimasensoren und den Pull-up der Klingelleitung, der Sprechrechner das Mikrofon.","Geplant: das Heizpad (5 V, etwa 5 W) an der 5-V-Schiene, über eine 73-°C-Thermosicherung und einen MOSFET-Schalter auf der Minusseite. Auf dem Labortisch lief es am PoE-Modul mit 9,37 W; die Schiene sinkt dann auf 4,8 V, deshalb teilen sich Heizung und Licht später eine Grenze.","Alle Massen (0 V, der gemeinsame Rückweg aller Ströme) treffen sich auf der Masseschiene der Verteilerplatine. Signale werden gegen Masse gemessen; ohne diesen gemeinsamen Punkt könnten sich die Teile nicht verstehen."]}},"screen":{"en":{"title":"How the screen gets its content","steps":["Home Assistant decides what the screen shows: a greeting, a notice or a QR code. Later the content is planned to come from the family app.","The content travels over the house network and the one cable to the doorbell computer, and from its own Wi-Fi 'aikos' by radio to the screen computer, centimetres away.","The screen computer draws the image on the e-paper panel (a display that needs power only to change the picture). The image then stays visible behind the window in the brass, even without power.","The panel senses touch. Each touch goes back the same way, from the screen computer over WiFi to Home Assistant."]},"de":{"title":"Wie der Bildschirm seinen Inhalt bekommt","steps":["Home Assistant legt fest, was auf dem Bildschirm erscheint: ein Gruß, ein Hinweis oder ein QR-Code. Später soll der Inhalt aus der geplanten Familien-App kommen.","Der Inhalt geht über das Hausnetz und das eine Kabel zum Klingelrechner und von dessen eigenem WLAN „aikos“ per Funk zum Bildschirmrechner, Zentimeter daneben.","Der Bildschirmrechner zeichnet das Bild auf das E-Paper (ein Bildschirm, der nur zum Umschalten Strom braucht). Das Bild bleibt danach auch ohne Strom hinter dem Fenster im Messing sichtbar.","Das Panel erkennt Berührungen. Jede Berührung geht denselben Weg zurück, vom Bildschirmrechner über WLAN zu Home Assistant."]}},"winter":{"en":{"title":"Keeping the screen warm in winter (planned)","steps":["Two sensors report to the doorbell computer over I2C (a slow two-wire bus between chips): the BME280 measures the air in the box, the SHT31-D the outdoor air in its own chamber. Their firmware is written; the heater control is not.","Below the set point, or close to the dew point, the doorbell computer will switch the heater on through a MOSFET on the distribution board, and off during calls.","The pad between the panel and its board warms the e-paper, which is rated only from 0 to +50 °C. The firmware will cut off at about 40 °C. If anything still overheats, the 73 °C fuse cuts the heater for good.","Below about +2 °C the screen computer waits before it refreshes the image. Until then the e-paper (which holds an image without power) keeps showing the last one."]},"de":{"title":"Im Winter den Bildschirm warm halten (geplant)","steps":["Zwei Sensoren melden sich über I2C (ein langsamer Zweidraht-Bus zwischen Chips) beim Klingelrechner: Der BME280 misst die Luft im Kasten, der SHT31-D die Außenluft in seiner eigenen Kammer. Ihre Firmware ist geschrieben, die Heizungsregelung noch nicht.","Unter dem Sollwert oder nahe am Taupunkt schaltet der Klingelrechner die Heizung über einen MOSFET auf der Verteilerplatine ein, und während Gesprächen aus.","Das Pad zwischen Panel und Platine wärmt das E-Paper, das nur für 0 bis +50 °C freigegeben ist. Die Firmware schaltet bei etwa 40 °C ab. Wird trotzdem etwas zu heiß, trennt die 73-°C-Sicherung die Heizung endgültig.","Unter etwa +2 °C wartet der Bildschirmrechner mit dem Neuzeichnen. Bis dahin zeigt das E-Paper (das sein Bild ohne Strom hält) weiter das letzte Bild."]}},"light":{"en":{"title":"Light at dusk or when someone comes","steps":["Home Assistant decides when the light goes on: at dusk, or when the existing motion sensor at the door detects someone.","Home Assistant sends the command to the doorbell computer over the ESPHome connection (an encrypted link over the network cable).","The level shifter (a chip) raises the computer's 3.3 V data signal to the 5 V the strip expects. The diffuser (a cover that spreads light) under the brass roof blends the roughly 4 LEDs into one warm band."]},"de":{"title":"Licht bei Dämmerung oder Bewegung","steps":["Home Assistant entscheidet, wann das Licht angeht: bei Dämmerung oder wenn der vorhandene Bewegungsmelder an der Tür jemanden erkennt.","Home Assistant schickt den Befehl über die ESPHome-Verbindung (verschlüsselt, über das Netzwerkkabel) an den Klingelrechner.","Der Pegelwandler (ein Chip) hebt das Datensignal von 3,3 V auf die 5 V, die der Streifen braucht. Der Diffusor (lichtstreuende Abdeckung) unter dem Messingdach fasst die etwa 4 LEDs zu einem warmen Lichtband zusammen."]}},"voicemsg":{"en":{"title":"Leaving a voice message (planned)","steps":["Planned: the visitor taps 'leave a message' on the screen, and the screen announces that it is recording. Recording starts only after such a visitor action; the law requires this.","The microphone listens through two 1.2 mm holes in the brass and a membrane that lets sound through and keeps water out. It sends digital audio over I2S (a three-wire audio bus) to the talk computer.","The talk computer sends the recording to the transcription server in the house. There Whisper, a speech-to-text program, turns it into text, so the transcription stays at home.","A Telegram bot sends the audio and the transcript to your phone. From this point the audio passes through Telegram's servers on the internet."]},"de":{"title":"Sprachnachricht hinterlassen (geplant)","steps":["Geplant: Wer vor der Tür steht, tippt auf dem Bildschirm auf „Nachricht hinterlassen“, und der Bildschirm kündigt die Aufnahme an. Aufgenommen wird nur nach so einer Aktion, das schreibt das Gesetz vor.","Das Mikrofon hört durch zwei Löcher von 1,2 mm im Messing und eine Membran, die Schall durchlässt und Wasser abhält. Es schickt digitales Audio über I2S (ein Audio-Bus mit drei Leitungen) an den Sprechrechner.","Der Sprechrechner schickt die Aufnahme an den Transkriptionsserver im Haus. Dort macht Whisper, ein Spracherkennungsprogramm, Text daraus. Die Umwandlung in Text bleibt also im Haus.","Ein Telegram-Bot schickt Audio und Text an dein Handy. Ab hier läuft die Aufnahme über die Server von Telegram im Internet."]}},"reply":{"en":{"title":"Answering from your phone (planned)","steps":["Planned: you record a voice note on your phone and send it to the Telegram bot.","The automation (n8n, a workflow tool) on the home transcription server picks up the voice note and passes it to Home Assistant.","Home Assistant sends it to the talk computer, which plays it over I2S (a digital audio bus) into the amplifier. The amplifier, set to its lowest gain (amplification), drives the speaker behind the grille."]},"de":{"title":"Vom Handy antworten (geplant)","steps":["Geplant: Du nimmst auf dem Handy eine Sprachnachricht auf und schickst sie an den Telegram-Bot.","Die Automatisierung (n8n, ein Workflow-Werkzeug) auf dem Transkriptionsserver im Haus holt die Sprachnachricht ab und gibt sie an Home Assistant weiter.","Home Assistant schickt sie an den Sprechrechner, der sie über I2S (ein digitaler Audio-Bus) an den Verstärker gibt. Der Verstärker steht auf der kleinsten Verstärkungsstufe und treibt den Lautsprecher hinter dem Gitter."]}},"ptt":{"en":{"title":"Push-to-talk into the house (planned)","steps":["Planned: the screen shows 'hold here and speak'. The visitor keeps a finger on that field while talking.","While the field is held, the microphone streams digital audio to the talk computer. Letting go ends the stream.","A relay (a service that forwards the stream), possibly in the planned family app, plays the voice live on the house speakers. One direction at a time avoids the echo problem of a full phone call."]},"de":{"title":"Live ins Haus sprechen (geplant)","steps":["Geplant: Auf dem Bildschirm steht „Hier halten und sprechen“. Wer vor der Tür steht, hält den Finger auf dieses Feld, solange er spricht.","Solange das Feld gehalten wird, streamt das Mikrofon digitales Audio zum Sprechrechner. Loslassen beendet den Stream.","Ein Relay (ein Dienst, der den Stream weiterleitet), eventuell Teil der geplanten Familien-App, spielt die Stimme live auf den Hauslautsprechern ab. Immer nur eine Richtung vermeidet das Echo beim Gegensprechen."]}},"talk":{"en":{"title":"A conversation at the door","steps":["A visitor rings. The press reaches the room keys and the door screen directly; the screen shows a 'Sprechen' (talk) button.","The visitor taps 'Sprechen', or someone indoors holds the button of a room key. The talk computer at the door decides that a call is on; the screen says that the microphone is open.","The microphone behind the brass picks up the visitor, and the talk computer sends the voice to the room keys. While the door speaker plays, the door microphone is muted toward the keys, so nobody hears an echo.","The resident's voice comes from the room key to the talk computer and plays through the amplifier and the speaker behind the grille, capped at −6 dB.","A copy of the door audio goes to the transcription server in the house; what both sides say appears as chat bubbles on the door screen. The call ends after 10 s of silence, or after 5 minutes at the most. Nothing is recorded."]},"de":{"title":"Ein Gespräch an der Tür","steps":["Jemand klingelt. Der Druck erreicht Raumschlüssel und Türbildschirm direkt; der Bildschirm zeigt die Taste „Sprechen“.","Der Besuch tippt auf „Sprechen“, oder drinnen hält jemand die Taste eines Raumschlüssels. Der Sprechrechner an der Tür entscheidet, dass ein Gespräch läuft; der Bildschirm zeigt, dass das Mikrofon offen ist.","Das Mikrofon hinter dem Messing hört den Besuch, und der Sprechrechner schickt die Stimme an die Raumschlüssel. Solange der Türlautsprecher spielt, ist das Türmikrofon zu den Schlüsseln hin stumm, damit niemand ein Echo hört.","Die Stimme drinnen kommt vom Raumschlüssel zum Sprechrechner und spielt über Verstärker und Lautsprecher hinter dem Gitter, auf −6 dB begrenzt.","Eine Kopie des Türtons geht an den Transkriptions-Server im Haus; was beide Seiten sagen, erscheint als Sprechblasen auf dem Türbildschirm. Das Gespräch endet nach 10 s Stille oder spätestens nach 5 Minuten. Nichts wird aufgezeichnet."]}}},"solder":{"button":{"en":{"what":"Solder a 10 kΩ end-of-line resistor (a resistor at the far end of the line) straight across the button's two contacts. Then pull shrink tubing (a sleeve that tightens when heated) over it.","caution":"It must sit at the button, or a cut wire still reads as idle. The joint behind the button is the weak point for water: use shrink tubing with glue inside."},"de":{"what":"Einen 10-kΩ-Abschlusswiderstand (Widerstand am fernen Ende der Leitung) direkt über die beiden Kontakte des Tasters löten. Danach Schrumpfschlauch (zieht sich bei Wärme zusammen) darüberziehen.","caution":"Er gehört an den Taster, sonst meldet ein Drahtbruch „Ruhe“. Hinter dem Taster liegt die Schwachstelle für Wasser: Schrumpfschlauch mit Kleber nehmen."}},"linecircuit":{"en":{"what":"On perfboard (a board with a hole grid), copying the v1 breadboard (plug-in test board): 10 kΩ pull-up (holds the line at a known voltage) to 3.3 V, 1 kΩ in series with the line, 100 nF capacitor to ground.","caution":"Pull-up to 3.3 V, never 5 V: a cut wire would put 5 V on the input. Idle must read about 1.73 V. On v1 a resistor once sat in an unconnected row."},"de":{"what":"Auf Lochraster (Platine mit Lochgitter), wie auf dem v1-Steckbrett (Testaufbau ohne Löten): 10-kΩ-Pull-up (hält die Leitung auf bekannter Spannung) nach 3,3 V, 1 kΩ in Reihe zur Leitung, 100-nF-Kondensator nach Masse.","caution":"Pull-up an 3,3 V, nie an 5 V: Ein Drahtbruch legte sonst 5 V an den Eingang. In Ruhe ca. 1,73 V messen. Auf v1 saß ein Widerstand in einer unverbundenen Reihe."}},"shifter":{"en":{"what":"Put the level shifter chip (lifts 3.3 V LED data to 5 V) in a DIP-14 socket (plug-in holder) on perfboard (hole-grid board), 5 V supply. 330 Ω in the output line. Unused inputs and OE (output enable) pins to ground.","caution":"Mind the pin-1 mark (notch or dot) on chip and socket. Shifter, computer and strip need the same ground: the data signal is measured against it."},"de":{"what":"Den Pegelwandler (hebt die 3,3-V-LED-Daten auf 5 V) in einen DIP-14-Sockel (Steckfassung) auf Lochraster setzen, Versorgung 5 V. 330 Ω in die Ausgangsleitung. Unbenutzte Eingänge und OE-Pins (Output Enable) a
