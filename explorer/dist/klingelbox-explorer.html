<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klingelbox Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --sans:Barlow,"Segoe UI",system-ui,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ground:#E4E3DD; --paper:#F3F2EE; --paper-2:#ECEBE5; --ink:#1B1C1A; --ink-2:#3B3C38; --muted:#65665F; --faint:#8E8F87;
  --rule:#CAC8BF; --rule-2:#DAD8D0;
  --brass:#8C6420; --brass-2:#B48A3A; --brass-3:#D9BF83; --brass-wash:#EEE4CB;
  --front-a:#EDE3C6; --front-b:#E0D0A6; --brushed:rgba(140,100,32,.08);
  --z-internet:#DCE1E3; --z-house:#E9E5DA; --z-tech:#DEE2DA; --z-box:#D4D3CC; --z-boxwall:#2A2B28; --layerline:rgba(27,28,26,.06);
  --hatch:rgba(27,28,26,.2); --wall:#ECEBE5;
  --pcb:#1D2923; --pcb-2:#2A3831; --pcb-ink:#E8E6DD; --pin:#C9A55A; --shield:#B9BBB5; --metal:#9FA19B;
  --epaper:#E9E8E1; --epaper-ink:#232420; --ep-muted:#5F605A; --ep-rule:#CFCDC4; --bezel:#262724;
  --card-stroke:#A6A49B; --flow:#FFFFFF; --tip:#1B1C1A; --tip-ink:#F3F2EE;
  --shadow:0 1px 2px rgba(27,28,26,.08),0 10px 28px rgba(27,28,26,.10);
  --w-mains:#6B4226; --w-poe:#6741D9; --w-ethernet:#0B7285; --w-wifi:#1C7ED6; --w-v12:#E8590C; --w-v5:#E03131; --w-v3:#E67700;
  --w-gnd:#2C2E2A; --w-earth:#2B8A3E; --w-earth2:#EDBE00; --w-i2c:#2F9E44; --w-i2s:#D6336C; --w-gpio:#5C940D; --w-button:#A87B2E;
  --w-speaker:#9C5B30; --w-software:#5C6977; --w-mech:#8A8478; --wago:#F08C00; --solder:#A3A59F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#121311; --paper:#1C1D1A; --paper-2:#171815; --ink:#ECEAE2; --ink-2:#D0CEC5; --muted:#9E9C93; --faint:#76756D;
  --rule:#34352F; --rule-2:#2A2B27;
  --brass:#D6B267; --brass-2:#B8913F; --brass-3:#7A5E27; --brass-wash:#241F14;
  --front-a:#2A2416; --front-b:#1F1A10; --brushed:rgba(214,178,103,.05);
  --z-internet:#171B1D; --z-house:#1B1A16; --z-tech:#161A16; --z-box:#0C0D0B; --z-boxwall:#4A4B44; --layerline:rgba(236,234,226,.04);
  --hatch:rgba(236,234,226,.16); --wall:#1A1B18;
  --pcb:#0E1813; --pcb-2:#1A2A21; --pcb-ink:#E8E6DD; --pin:#B8944A; --shield:#8D8F89; --metal:#70726C;
  --epaper:#CFCDC4; --epaper-ink:#1B1C19; --ep-muted:#56574F; --ep-rule:#B5B3AA; --bezel:#050605;
  --card-stroke:#4B4C46; --flow:#FFFFFF; --tip:#ECEAE2; --tip-ink:#121311;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
  --w-mains:#C08A5E; --w-poe:#9775FA; --w-ethernet:#3BC9DB; --w-wifi:#4DABF7; --w-v12:#FF922B; --w-v5:#FF6B6B; --w-v3:#FFC078;
  --w-gnd:#A6A69E; --w-earth:#51CF66; --w-earth2:#FFD43B; --w-i2c:#69DB7C; --w-i2s:#F783AC; --w-gpio:#A9E34B; --w-button:#D6B267;
  --w-speaker:#E0A075; --w-software:#A5B1BE; --w-mech:#8F897D; --wago:#FFA94D; --solder:#C4C6C0;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#121311; --paper:#1C1D1A; --paper-2:#171815; --ink:#ECEAE2; --ink-2:#D0CEC5; --muted:#9E9C93; --faint:#76756D;
  --rule:#34352F; --rule-2:#2A2B27;
  --brass:#D6B267; --brass-2:#B8913F; --brass-3:#7A5E27; --brass-wash:#241F14;
  --front-a:#2A2416; --front-b:#1F1A10; --brushed:rgba(214,178,103,.05);
  --z-internet:#171B1D; --z-house:#1B1A16; --z-tech:#161A16; --z-box:#0C0D0B; --z-boxwall:#4A4B44; --layerline:rgba(236,234,226,.04);
  --hatch:rgba(236,234,226,.16); --wall:#1A1B18;
  --pcb:#0E1813; --pcb-2:#1A2A21; --pcb-ink:#E8E6DD; --pin:#B8944A; --shield:#8D8F89; --metal:#70726C;
  --epaper:#CFCDC4; --epaper-ink:#1B1C19; --ep-muted:#56574F; --ep-rule:#B5B3AA; --bezel:#050605;
  --card-stroke:#4B4C46; --flow:#FFFFFF; --tip:#ECEAE2; --tip-ink:#121311;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
  --w-mains:#C08A5E; --w-poe:#9775FA; --w-ethernet:#3BC9DB; --w-wifi:#4DABF7; --w-v12:#FF922B; --w-v5:#FF6B6B; --w-v3:#FFC078;
  --w-gnd:#A6A69E; --w-earth:#51CF66; --w-earth2:#FFD43B; --w-i2c:#69DB7C; --w-i2s:#F783AC; --w-gpio:#A9E34B; --w-button:#D6B267;
  --w-speaker:#E0A075; --w-software:#A5B1BE; --w-mech:#8F897D; --wago:#FFA94D; --solder:#C4C6C0;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding-inline:clamp(16px,3vw,36px);padding-block:0 64px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--rule)}
.mark{display:flex;align-items:center;gap:10px;font:600 15px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase}
.mark svg{width:22px;height:22px;color:var(--brass)}
.bar-r{display:flex;align-items:center;gap:14px}
.bar-r a{font:500 13px var(--sans);color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule)}
.bar-r a:hover{color:var(--ink);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:999px;font:600 12px/1.2 var(--mono);letter-spacing:.06em;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:end;padding-block:clamp(28px,5vw,60px) clamp(18px,3vw,30px)}
.kicker{font:600 12.5px/1 var(--cond);letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
h1{font:700 clamp(46px,8vw,96px)/.88 var(--cond);letter-spacing:.005em;margin:.22em 0 .22em;text-transform:uppercase;text-wrap:balance}
.lede{max-width:62ch;font-size:clamp(15px,1.25vw,17px);color:var(--ink-2);margin:0}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--ground);font:600 14px var(--sans);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn:hover{filter:brightness(1.12)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.plate{position:relative;border:1.5px solid var(--brass-2);border-radius:6px;background:var(--brass-wash);padding:24px 30px 22px;font:500 12.5px/1.45 var(--mono);color:var(--ink)}
.plate-h{display:flex;justify-content:space-between;gap:12px;font:600 12px/1 var(--cond);letter-spacing:.24em;text-transform:uppercase;color:var(--brass);padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--brass-3)}
.plate dl{display:grid;grid-template-columns:auto 1fr;gap:5px 18px;margin:0}
.plate dt{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;padding-top:1px}
.plate dd{margin:0;font-variant-numeric:tabular-nums}
.plate .none{color:var(--brass);font-weight:600}
.plate .screw{position:absolute;width:11px;height:11px}
.plate .screw.a{left:8px;top:8px}.plate .screw.b{right:8px;top:8px}.plate .screw.c{left:8px;bottom:8px}.plate .screw.d{right:8px;bottom:8px}

/* stage */
.stage{scroll-margin-top:12px}
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding-block:10px 8px}
.presets{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:3px}
.presets button{border:0;background:transparent;border-radius:6px;padding:5px 12px;font:600 13px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.toggles{display:flex;flex-wrap:wrap;gap:6px 16px}
.tg{display:inline-flex;align-items:center;gap:7px;font:500 13.5px var(--sans);color:var(--ink-2);cursor:pointer;user-select:none}
.tg input{appearance:none;width:30px;height:18px;border-radius:999px;background:var(--rule);position:relative;margin:0;cursor:pointer;transition:background .2s}
.tg input::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--paper);transition:transform .2s}
.tg input:checked{background:var(--brass-2)}
.tg input:checked::after{transform:translateX(12px)}
.tg input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-block:2px 6px}
.chip{display:inline-flex;align-items:stretch;height:28px;padding:0;border:1px solid var(--rule);border-radius:4px;background:var(--paper);cursor:pointer;overflow:hidden;font:500 13px/26px var(--sans);color:var(--ink)}
.chip i{width:9px;background:var(--c);flex:none}
.chip span{padding:0 9px 0 8px;white-space:nowrap}
.chip small{font:500 10.5px/26px var(--mono);color:var(--faint);padding-right:8px}
.chip[aria-pressed="false"]{background:transparent;color:var(--faint);border-style:dashed}
.chip[aria-pressed="false"] i{background:transparent;border-right:1px dashed var(--rule)}
.chip:focus-visible,.presets button:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.caption{min-height:1.55em;color:var(--muted);font-size:13.5px;padding-block:0 8px}
.caption b{color:var(--ink);font-weight:600}

.grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.canvas{position:relative;width:100%;aspect-ratio:1600/1000;max-height:82vh;background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.canvas svg{width:100%;height:100%;display:block;cursor:grab}
.canvas svg.grabbing{cursor:grabbing}
.zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:7px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:500 18px/1 var(--mono);cursor:pointer;box-shadow:var(--shadow)}
.zoom button:hover{border-color:var(--ink)}
.tip{position:absolute;pointer-events:none;max-width:300px;background:var(--tip);color:var(--tip-ink);font:400 12.5px/1.45 var(--sans);padding:8px 10px;border-radius:6px;box-shadow:var(--shadow);z-index:3}
.tip b{display:block;font-weight:600;font-size:13px}
.tip .sw{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--c);vertical-align:middle;margin-right:6px}
.tip small{display:block;opacity:.7;font:500 11px var(--mono);margin-top:3px}
.tourbar{position:absolute;left:12px;bottom:12px;right:12px;max-width:580px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px 12px;z-index:4}
.tb-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tb-k{font:600 11.5px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.tb-t{font:600 17px/1.2 var(--cond);letter-spacing:.02em;margin:2px 0 6px}
.tb-x{border:0;background:transparent;font:500 18px/1 var(--mono);color:var(--muted);cursor:pointer;padding:2px 4px}
.tb-s{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.tb-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.tb-dots{display:flex;gap:4px;flex-wrap:wrap}
.tb-dots button{width:22px;height:5px;border-radius:3px;border:0;background:var(--rule);cursor:pointer;padding:0}
.tb-dots button.on{background:var(--brass-2)}
.tb-dots button.done{background:var(--ink-2)}
.tb-nav{display:flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--muted)}
.tb-nav button{height:30px;min-width:34px;padding:0 10px;border-radius:6px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font:600 13px var(--sans)}
.tb-nav button.pri{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tb-nav button:disabled{opacity:.35;cursor:default}

/* e-paper panel */
.panel{position:relative;background:var(--bezel);border-radius:12px;padding:10px;min-height:440px;box-shadow:var(--shadow)}
@media (min-width:1061px){.panel{position:absolute;top:10px;right:10px;bottom:10px;width:350px;min-height:0;transform:translateX(calc(100% + 24px));opacity:0;visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility 0s .35s;z-index:5}.grid.has-sel .panel{transform:none;opacity:1;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}.grid.has-sel .zoom{right:372px}.zoom{transition:right .35s cubic-bezier(.2,.8,.2,1)}}
.ep-x{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--ep-muted);font:500 20px/1 var(--mono);cursor:pointer}
.ep-x:hover{background:rgba(0,0,0,.07);color:var(--epaper-ink)}
.ep{position:absolute;inset:10px;padding-right:40px!important;background:var(--epaper);color:var(--epaper-ink);border-radius:3px;padding:18px 18px 22px;overflow:auto;font-size:14px;line-height:1.52;scrollbar-width:thin}
.ep-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font:500 11px var(--mono);letter-spacing:.04em;color:var(--ep-muted);text-transform:uppercase}
.ep h3{font:700 24px/1.05 var(--cond);letter-spacing:.01em;margin:10px 0 2px;text-transform:uppercase;text-wrap:balance}
.ep-tag{font:500 12px var(--mono);color:var(--ep-muted)}
.ep p{margin:10px 0 0}
.ep-h{display:flex;align-items:center;gap:8px;font:600 12px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--ep-muted);margin:18px 0 0;padding-top:12px;border-top:1px solid var(--ep-rule)}
.ep-h .n{font:500 11px var(--mono);letter-spacing:0}
.ep-h + p{margin-top:6px}
.ep-solder{margin-top:4px}
.ep-caution{padding:8px 10px;border-left:3px solid var(--epaper-ink);background:rgba(0,0,0,.04)}
.ep-caution b{font:700 11px var(--cond);letter-spacing:.14em;text-transform:uppercase;margin-right:4px}
.ep-kicker{font:600 11px var(--cond);letter-spacing:.24em;color:var(--ep-muted)}
.ep-cta{margin-top:14px;display:flex;width:100%;align-items:center;gap:10px;border:1.5px solid var(--epaper-ink);background:transparent;color:var(--epaper-ink);border-radius:6px;padding:10px 12px;font:600 14px var(--sans);cursor:pointer;text-align:left}
.ep-cta:hover{background:var(--epaper-ink);color:var(--epaper)}
.conns{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.conns button,.ep-link{display:grid;grid-template-columns:18px 1fr;gap:0 8px;width:100%;text-align:left;border:0;background:transparent;border-radius:4px;padding:5px 6px;cursor:pointer;color:var(--epaper-ink)}
.conns button:hover,.ep-link:hover{background:rgba(0,0,0,.06)}
.conns i{grid-row:span 2;align-self:center;height:4px;border-radius:2px;background:var(--c)}
.conns i.und{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}
.c-l{font-weight:600;font-size:13.5px;line-height:1.3}
.c-o{font-size:12.5px;color:var(--ep-muted);line-height:1.3}
.conns .off .c-l{opacity:.6}
.ep-ends{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.ep-link{grid-template-columns:44px 1fr;align-items:baseline}
.ep-link span:first-child{font:500 11px var(--mono);color:var(--ep-muted);text-transform:uppercase}
.st-list{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.st-list li,.stb{display:inline-flex;align-items:center;gap:6px}
.stb svg,.st-list svg,.lg svg{width:12px;height:12px;flex:none;overflow:visible}
.badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--brass-2);color:#fff;font:600 11px var(--mono);flex:none}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding-block:10px 0;font-size:12.5px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg svg.w{width:26px;height:10px}
.lg-sep{flex-basis:100%;height:0}
.legend .hint{margin-left:auto;font:500 11.5px var(--mono);color:var(--faint)}

/* svg */
.zone-l{font:600 13px var(--cond);letter-spacing:.2em;text-transform:uppercase;fill:var(--muted)}
.zone-s{font:500 10.5px var(--mono);fill:var(--faint)}
.zone-v{font:500 10px var(--mono);letter-spacing:.08em;fill:var(--muted);text-transform:uppercase}
.node{cursor:pointer;transition:opacity .25s}
.node .card{fill:var(--paper);stroke:var(--card-stroke);stroke-width:1.2}
.node.k-hub .card{stroke:var(--ink);stroke-width:1.8}
.node.st-pending .card{stroke-dasharray:5 4;stroke:var(--ink-2)}
.node.st-planned .card{stroke-dasharray:.5 3.5;stroke-linecap:round;stroke-width:1.6}
.node.st-planned{opacity:.8}
.node:hover .card,.node:focus-visible .card{stroke:var(--ink);stroke-width:1.9}
.node.sel .card,.node.sel .pcb,.node.sel .bez{stroke:var(--brass);stroke-width:2.6}
.node:focus{outline:none}
.lbl{font:600 13px var(--sans);fill:var(--ink)}
.tag{font:500 10.5px var(--mono);fill:var(--muted)}
.gl{color:var(--ink-2)}
.gl *{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.gl [fill="currentColor"]{fill:currentColor}
.k-feature .stripe{fill:var(--brass-2)}
.pcb{fill:var(--pcb);stroke:var(--pcb-2);stroke-width:1.5}
.pin{fill:var(--pin)}
.shield{fill:var(--shield)}
.shield-t{font:600 11px var(--mono);fill:#2A2B28}
.chip-t{font:600 8px var(--mono);fill:#C9C8C0}
.metal{fill:var(--metal)}
.pcb-l{font:600 17px var(--sans);fill:var(--pcb-ink)}
.pcb-t{font:500 10.5px var(--mono);fill:var(--pcb-ink);opacity:.7}
.bez{fill:var(--bezel);stroke:var(--bezel);stroke-width:1}
.epd{fill:var(--epaper)}
.epd-b{fill:var(--epaper-ink);opacity:.55}
.scr-l{font:600 13px var(--sans);fill:var(--pcb-ink)}
.scr-t{font:500 10px var(--mono);fill:var(--pcb-ink);opacity:.7}
.rail-l{font:600 11px var(--mono)}
.sg-fill{fill:var(--ink)} .sg-ring{fill:none;stroke:var(--ink);stroke-width:1.4}
.sg-dash{stroke-dasharray:2.1 1.7} .sg-dot{stroke-dasharray:.1 2.4;stroke-linecap:round;stroke-width:1.9}
.sg-exist{fill:var(--faint)} .sg-brass{fill:var(--brass-2)}
.on-dark .sg-fill{fill:var(--pcb-ink)} .on-dark .sg-ring{stroke:var(--pcb-ink)}
.edge{transition:opacity .25s}

<script id="kb-data" type="application/json">{"skeleton":{"state":"2026-10-20","_about":"Structure of the Klingelbox explorer, state 2026-10-20: the as-built prototype in the printed v3 box (first power-on in the box on 20 Oct 2026). One PoE cable into the box; the doorbell computer (Waveshare ESP32-S3-ETH, node id 'wt32' for history) carries the plug-on PoE Module (B), which feeds the 5 V of the whole box, and runs the Wi-Fi 'aikos' for the talk computer (HW678, node id 'waveshare') and the screen. No splitter, no 12 V. Climate: SHT31-D outdoor chamber + BME280 on the distribution board. Talk: aikos_voice between the door and the RoomKeys, transcripts on the screen. Planned: heater switch, COB light, radar firmware, service USB.","zones":[{"id":"internet","hint":"Outside services on the internet. Only Telegram, used for voice messages (planned)."},{"id":"house","hint":"Inside the house: the Home Assistant server, the WiFi access point about a metre from the box, the local transcription server, the household's phones, planned house speakers and a planned self-hosted family app."},{"id":"technikraum","hint":"The technical room indoors: UPS, the PoE network switch, the surge protector, the house earth. Everything that feeds the door lives here; no power supply is needed here any more because PoE carries the power."},{"id":"wall","hint":"The outside wall: 14 cm facade insulation in front of masonry. One outdoor network cable crosses it and enters the box through a split cable gland. The exact cable route is still open."},{"id":"box","hint":"The 3D-printed box set flush into the facade insulation, behind the brass front. It holds the PoE splitter, the power distribution, the three door computers and all small electronics. Sealed; heated in winter; breathes through a pressure vent."},{"id":"front","hint":"The visible brass front outside, with everything mounted in or directly behind it: light and diffusor under the folded roof, speaker behind the grille, the screen behind its window, the mic holes and the push button. No camera, ever."}],"layers":[{"id":"mains","color":"mains","hint":"Household mains 230 V. Only indoors: it feeds the UPS, the UPS feeds the network switch."},{"id":"poe","color":"poe","hint":"PoE = Power over Ethernet: one network cable carries data AND power (about 48 V) from the switch to the box. Runs at high voltage so the current and the loss in the cable stay small."},{"id":"ethernet","color":"ethernet","hint":"Wired network data only (no power)."},{"id":"wifi","color":"wifi","hint":"Radio network. The screen computer and the talk computer use it; the doorbell computer stays on the cable."},{"id":"v5","color":"v5","hint":"5 V rail in the box, made from 12 V by one step-down converter. Feeds all three computers, the amplifier, the LED strip and the level shifter."},{"id":"v3","color":"v3","hint":"3.3 V made on the doorbell and talk computer boards from their 5 V. Feeds small parts: the BME280 and the button-line pull-up (doorbell computer) and the microphone (talk computer)."},{"id":"gnd","color":"gnd","hint":"Ground (0 V): the shared return path. Every part's current flows back through it and every signal is measured against it, so all grounds in the box join at one point."},{"id":"earth","color":"earth","hint":"Protective earth of the house. Only the surge protector is connected to it, by an electrician. It is a path for lightning surges, not for normal current."},{"id":"i2c","color":"i2c","hint":"I2C: a slow two-wire chip bus (SDA data, SCL clock). Connects the BME280 sensor to the doorbell computer."},{"id":"i2s","color":"i2s","hint":"I2S: a three-wire digital audio bus (bit clock, word clock, data) between the talk computer and both the microphone and the amplifier. Digital, so noise does not degrade the sound, but the wires must stay short."},{"id":"gpio","color":"gpio","hint":"Single control lines from one computer pin: the LED data line (via the level shifter) and the heater on/off signal."},{"id":"button","color":"button","hint":"The supervised doorbell line: resistors make three distinct voltages (idle about 1.73 V, pressed about 0.30 V, wire cut about 3.1-3.3 V) that the doorbell computer reads with an analog input. A cut wire is reported, not silent."},{"id":"speaker","color":"speaker","hint":"The two amplified speaker wires from the amplifier's screw terminal to the loudspeaker. Both carry signal; neither is ground."},{"id":"software","color":"software","hint":"Logical links over the network: the ESPHome connection to Home Assistant, phone notifications, screen content, and the planned voice-message and push-to-talk paths."},{"id":"mech","color":"mech","hint":"How parts are mounted, sealed and where air, water, light and sound are allowed through."}],"nodes":[{"id":"telegram","zone":"internet","status":"existing","name":"Telegram","hint":"Messenger service the household already uses with its own bots. PLANNED use: delivers visitor voice messages plus their transcript to your phone, and carries your voice replies back. Audio passes through Telegram's servers."},{"id":"ha","zone":"house","status":"existing","name":"Home Assistant","hint":"The home automation server (already running). Talks to all three door computers via ESPHome and runs the automations: phone notification on a ring (loud channel, can be silenced by a toggle), screen content, light at dusk, and (planned) starting a call to the talk computer. Will later be integrated with the planned family app via an API."},{"id":"phone","zone":"house","status":"existing","name":"Your phone","hint":"Gets the ring notification from Home Assistant's companion app on a loud notification channel (under 1 second target). Later also Telegram voice messages with transcript, and sends voice replies. Neutral wording: 'your phone', no person names."},{"id":"ap","zone":"house","status":"existing","name":"House Wi-Fi","hint":"The house Wi-Fi access point: only the fallback for the screen and the talk computer if the doorbell computer's own Wi-Fi 'aikos' is down."},{"id":"transcribe","zone":"house","status":"existing","name":"Transcription server","hint":"Transcription server in the house network (Whisper): live call transcripts from the door audio; voice messages planned."},{"id":"speakers","zone":"house","status":"planned","name":"House speakers","hint":"PLANNED WiFi speakers in the house (e.g. a Home Assistant Voice PE). Play the doorbell chime and, planned, the visitor's live push-to-talk voice."},{"id":"app","zone":"house","status":"planned","name":"Family app","hint":"FUTURE self-hosted web app for the household: manage doorbell, speakers and other home systems (screen notices, ringtones, volumes); exposes an API to Home Assistant. Could host the live push-to-talk relay."},{"id":"ups","zone":"technikraum","status":"existing","name":"UPS","hint":"Battery-backed mains supply already in the technical room. Keeps the network switch, and therefore the whole doorbell, running during short power cuts."},{"id":"poeswitch","zone":"technikraum","status":"to_buy","name":"PoE switch port","hint":"A UniFi switch port with PoE switched ON (a small UniFi PoE switch for the door is planned). Sends data and about 48 V power down one cable. Its own VLAN, port isolation and MAC lock are advised because the front plate hides a live network port."},{"id":"surge","zone":"technikraum","status":"in_hand","name":"Surge protector","hint":"UniFi ETH-SP-G2, already owned. Sits between switch and outdoor cable, diverts lightning-induced surges to earth. Only works when an electrician connects it to the house earth. Its datasheet lists 802.3af PoE."},{"id":"earthbar","zone":"technikraum","status":"existing","name":"House earth","hint":"The house's equipotential bonding bar. The electrician connects the surge protector to it (same visit as removing the old dead doorbell transformer)."},{"id":"cable","zone":"wall","status":"to_buy","name":"Outdoor network cable","hint":"ONE ready-made outdoor Cat6 cable, about 10 m, solid copper AWG24, rated -40 to +75 C (candidate goobay 55432; check it is not the copper-clad-aluminium 94389). No crimping. Carries PoE. A second dark spare cable in the same bundle is being considered."},{"id":"gland","zone":"wall","status":"to_buy","name":"Split cable gland","hint":"Conta-Clip KDS-KV M25 split gland (lock nut included) with a split sealing insert KDS-DE 6-7 for the 6.0-6.6 mm cable, in one hole in the box's back wall (Conta-Clip specifies 25.2 mm). The moulded RJ45 plug passes through the opened gland, then the slit insert closes watertight around the cable. IP66."},{"id":"splitter","zone":"box","status":"in_hand","name":"PoE module","hint":"Waveshare PoE Module (B), plugged onto the doorbell computer: takes the power out of the PoE cable and feeds 5 V to the doorbell computer's VBUS (header pin 40), from where the whole box is supplied. Carried 9.37 W with the heater on the bench. No published temperature range."},{"id":"rail5","zone":"box","status":"in_hand","name":"5 V distribution","hint":"Distribution board (30 x 70 perfboard): 5 V rail B1-B7, fed from the doorbell computer's pin 40; soldered wires to the screen and the amplifier. The talk computer takes its 5 V straight from pin 40 on the shared carrier."},{"id":"gndstar","zone":"box","status":"in_hand","name":"Common ground","hint":"GND rail A1-A24 on the distribution board, fed from the doorbell computer's GND (pin 33); the talk computer's GND comes straight from the doorbell computer (pin 13)."},{"id":"wt32","zone":"box","status":"in_hand","name":"Doorbell computer","hint":"Waveshare ESP32-S3-ETH + PoE Module (B): the only wired computer. Button line on IO1 (pin 25), climate sensors on I2C (pins 34/31), runs the Wi-Fi 'aikos' and bridges it into the LAN, supervises the talk computer over 4 wires."},{"id":"waveshare","zone":"box","status":"in_hand","name":"Talk computer","hint":"ESP32-S3-N16R8 dev board (HW678): microphone on IO1/IO2/IO6, amplifier on IO15/16/17, supervision wires to the doorbell computer; on the Wi-Fi 'aikos'. Voice link aikos_voice v2.1.0."},{"id":"lilygo","zone":"box","status":"in_hand","name":"Screen computer","hint":"LilyGO T5-4.7-S3 Touch: 5 V from the distribution board into the edge-row VBUS hole; joins the Wi-Fi 'aikos'. Also powers and reads the radar (UART on its RX/TX holes, firmware to come)."},{"id":"amp","zone":"box","status":"in_hand","name":"Amplifier","hint":"Adafruit MAX98357A: turns the digital I2S audio into speaker power (about 1.8 W into 8 ohm max). Must be set to its LOWEST gain because the speaker takes only 0.5 W rated / 1 W max: 3 dB = a 100 kOhm resistor from GAIN to Vin. Connecting GAIN to ground gives 12 dB, which is LOUDER."},{"id":"mic","zone":"box","status":"in_hand","name":"Microphone","hint":"INMP441 digital MEMS microphone module (I2S), 3 owned. Sits directly behind the two mic holes with the membrane in between. The labelled side carries the sound hole and faces the holes. Recording only after a visitor action, and announced on the screen (legal requirement)."},{"id":"shifter","zone":"box","status":"in_hand","name":"Level shifter","hint":"SN74AHCT125N chip plus a 330 ohm series resistor, on a small perfboard: raises the 3.3 V LED data signal from the computer to the 5 V the LED strip expects. Without it the strip may work on the bench and fail mysteriously in the cold."},{"id":"ledcap","zone":"box","status":"to_buy","name":"1000 µF capacitor","hint":"Electrolytic capacitor across +5 V and ground right at the LED strip: absorbs the inrush when the LEDs switch on. Polarity matters (the stripe marks minus). The owned kit only has 100 nF, so it must be bought."},{"id":"bme","zone":"box","status":"in_hand","name":"Climate sensor (box)","hint":"BME280 (GY-BME280) on the distribution board: box temperature, humidity, pressure. I2C 0x76 on the doorbell computer (IO17/IO18). Firmware 0.3.23 written, not yet on the device."},{"id":"mosfet","zone":"box","status":"pending","name":"Heater switch","hint":"Logic-level N-MOSFET on the distribution board (C1-J7), switched by a doorbell computer pin. Not chosen yet: the FR120N opto modules in hand do not switch properly from 5 V."},{"id":"fuse","zone":"box","status":"in_hand","name":"Thermal fuse 73 °C","hint":"73 C one-shot thermal fuse in series with the heater, on its 5 V lead. In hand, not fitted yet."},{"id":"heater","zone":"box","status":"in_hand","name":"Heater pad","hint":"Adafruit 1481 heating pad, 5 V, about 5 W, between the e-paper panel and its board. Load-tested on the PoE module (9.37 W at the port). Not connected yet: waits for the heater switch and its firmware."},{"id":"linecircuit","zone":"box","status":"in_hand","name":"Button-line circuit","hint":"Three small parts on perfboard, proven on the v1 breadboard: 10 kOhm pull-up to 3.3 V, 1 kOhm series resistor, 100 nF capacitor to ground. Together with the end-of-line resistor at the button they create the three voltage states. Prevents the floating pin that once caused 134 phantom rings in 15 minutes."},{"id":"led","zone":"front","status":"pending","name":"LED strip","hint":"COB strip, 5 V, addressable (WS2812B type), 10 mm wide, in the diffuser under the brass roof; type not chosen. One cable hole through the front."},{"id":"diffusor","zone":"front","status":"printed","name":"Diffusor","hint":"Printed quarter-round light diffusor (R18, x 13-87) in the corner under the folded brass roof, siliconed all round. The LED strip lies inside it."},{"id":"speaker","zone":"front","status":"in_hand","name":"Loudspeaker","hint":"VISATON K 40 SQ, 40 x 40 mm, 8 ohm, 0.5 W rated / 1 W max, 82 dB at 1 W / 1 m (louder than a 3 W alternative at 74 dB: sensitivity beats wattage). IP65/67 at the front. Mounted with 4 screws on the box's front wall behind the grille."},{"id":"grille","zone":"front","status":"printed","name":"Speaker grille","hint":"Slanted slots cut into the brass (3 rows in the current CAD). The cavity behind it counts as outside air: speaker seals against the box wall, vent breathes into it, floor must drain water out through the lowest slots (a CAD fix is pending: the modelled slope runs the wrong way)."},{"id":"window","zone":"front","status":"printed","name":"Display window","hint":"Portrait window in the brass for the e-paper screen (about 58 x 104 mm visible area). The screen sits behind it with a soft gasket."},{"id":"membrane","zone":"front","status":"to_buy","name":"Mic membrane","hint":"Self-adhesive PTFE vent membrane (B+B Thermo-Technik DAM-AD10, 10.2 mm outer, 5.5 mm open, IP67) stuck behind the two mic holes: sound passes, water does not. Sold as a pressure vent, no acoustic data published: test the voice quality through it on the bench."},{"id":"micholes","zone":"front","status":"printed","name":"Mic holes","hint":"Two 1.2 mm holes in the brass next to the button. The microphone listens through them."},{"id":"button","zone":"front","status":"in_hand","name":"Push button","hint":"The existing brass doorbell button, ring 48.5 mm, recessed in the brass. A 10 kOhm end-of-line resistor is soldered directly across its two contacts: that is what lets the computer tell 'idle' from 'wire cut'."},{"id":"gasket","zone":"front","status":"to_buy","name":"Seals","hint":"v3: silicone bead between steel sheet and box (the water plane), an O-ring under each of the 18 screws, the button O-ring, mic membrane gaskets, foam rubber at the speaker."},{"id":"brass","zone":"front","status":"printed","name":"Brass front","hint":"One bent 2 mm brass sheet: front 100 x 260 mm with a folded rain roof and drip edge. So far only 3D-printed prototypes; brass is ordered only after the bench tests pass. Held by four slotted brass screws."},{"id":"sht31","zone":"box","status":"in_hand","name":"Outdoor sensor","hint":"SHT31-D in its own chamber at the bottom of the box, open to the outdoor air: outdoor temperature and humidity, I2C 0x44 on the doorbell computer."},{"id":"radar","zone":"box","status":"in_hand","name":"Radar","hint":"HLK-LD2410C 24 GHz radar in a glued frame behind the grille; 5 V and UART to the screen computer. Firmware to come (the screen's UART0 still carries its log)."},{"id":"roomkeys","zone":"house","status":"existing","name":"Room keys","hint":"RoomKey touch keys in the rooms (aikos-home/roomkey): ring directly from the doorbell computer, talk to the door over aikos_voice."}],"edges":[{"id":"e_ups_switch","from":"ups","to":"poeswitch","layer":"mains","method":"plug","decided":true,"hint":"Mains power from the UPS to the switch's power supply."},{"id":"e_switch_ha","from":"poeswitch","to":"ha","layer":"ethernet","method":"plug","decided":true,"hint":"The switch is part of the house network, which also reaches Home Assistant."},{"id":"e_ap_ha","from":"ap","to":"ha","layer":"ethernet","method":"plug","decided":true,"hint":"The access point is wired into the house network."},{"id":"e_switch_surge","from":"poeswitch","to":"surge","layer":"poe","method":"plug","decided":true,"hint":"Short patch cable, PoE port of the switch into the surge protector."},{"id":"e_surge_earth","from":"surge","to":"earthbar","layer":"earth","method":"screw","decided":true,"hint":"Earth wire from the surge protector's earth screw to the house earth. Electrician's job."},{"id":"e_surge_cable","from":"surge","to":"cable","layer":"poe","method":"plug","decided":true,"hint":"The outdoor cable plugs into the protector's outdoor-side port."},{"id":"e_cable_gland","from":"cable","to":"gland","layer":"poe","method":"gland","decided":true,"hint":"The cable passes through the split gland into the box; the plug goes through the opened gland, then it is sealed."},{"id":"e_gland_splitter","from":"gland","to":"splitter","layer":"poe","method":"plug","decided":true,"hint":"Inside the box the cable's plug goes into the splitter's PoE IN."},{"id":"e_splitter_wt32","from":"splitter","to":"wt32","layer":"ethernet","method":"plug","decided":true,"hint":"The PoE module is plugged onto the doorbell computer's header; data stays on the board's own RJ45."},{"id":"e_fuse_heater","from":"fuse","to":"heater","layer":"v5","method":"crimp","decided":false,"hint":"Fuse in series with the heater pad. Crimp, or solder with the leg heat-sunk: soldering heat can blow a 73 C fuse."},{"id":"e_heater_mosfet","from":"heater","to":"mosfet","layer":"v5","method":"screw","decided":false,"hint":"The heater's second lead goes to the module's switched minus terminal: the module closes the path to ground when the computer says 'heat'."},{"id":"e_rail_ws","from":"rail5","to":"waveshare","layer":"v5","method":"header","decided":true,"hint":"5 V into the talk computer's supply input. Which pin depends on the board, which is being re-decided."},{"id":"e_rail_wt32","from":"rail5","to":"wt32","layer":"v5","method":"header","decided":true,"hint":"5 V into the doorbell computer's VSYS header pin (supply input), or from its own PoE module if that powers the box. Check with a meter before the first power-up."},{"id":"e_rail_lilygo","from":"rail5","to":"lilygo","layer":"v5","method":"usb","decided":true,"hint":"5 V to the screen computer, by a USB-C power lead or its VBUS pin."},{"id":"e_rail_amp","from":"rail5","to":"amp","layer":"v5","method":"solder","decided":true,"hint":"5 V to the amplifier's Vin, with 10 uF + 0.1 uF at its pins."},{"id":"e_rail_shifter","from":"rail5","to":"shifter","layer":"v5","method":"solder","decided":true,"hint":"5 V supply for the level shifter chip."},{"id":"e_rail_ledcap","from":"rail5","to":"ledcap","layer":"v5","method":"solder","decided":true,"hint":"5 V towards the LED strip; the 1000 uF capacitor sits across +5 V and ground right at the strip."},{"id":"e_ledcap_led","from":"ledcap","to":"led","layer":"v5","method":"solder","decided":true,"hint":"5 V and ground soldered to the strip's +5V and GND pads at the arrow's starting end."},{"id":"e_gnd_ws","from":"waveshare","to":"gndstar","layer":"gnd","method":"header","decided":true,"hint":"Talk computer ground to the common ground point."},{"id":"e_gnd_wt32","from":"wt32","to":"gndstar","layer":"gnd","method":"header","decided":true,"hint":"Doorbell computer ground to the common ground point. The button line gets its own return to this board's GND pin, away from the heater and LED currents."},{"id":"e_gnd_lilygo","from":"lilygo","to":"gndstar","layer":"gnd","method":"usb","decided":true,"hint":"Screen computer ground (part of its power lead)."},{"id":"e_gnd_mosfet","from":"mosfet","to":"gndstar","layer":"gnd","method":"screw","decided":false,"hint":"The heater switch sends the heater current back to ground; its signal side also needs the computer's ground."},{"id":"e_gnd_splitter","from":"splitter","to":"gndstar","layer":"gnd","method":"screw","decided":true,"hint":"Splitter DC minus = the box's ground reference."},{"id":"e_wt32_bme_3v3","from":"wt32","to":"bme","layer":"v3","method":"header","decided":true,"hint":"3.3 V and ground for the sensor from the doorbell computer's header."},{"id":"e_ws_mic_3v3","from":"waveshare","to":"mic","layer":"v3","method":"header","decided":true,"hint":"3.3 V and ground for the microphone."},{"id":"e_wt32_line_3v3","from":"wt32","to":"linecircuit","layer":"v3","method":"solder","decided":true,"hint":"3.3 V for the 10 kOhm pull-up of the button line."},{"id":"e_wt32_bme_i2c","from":"wt32","to":"bme","layer":"i2c","method":"header","decided":true,"hint":"SDA and SCL, two wires. Pins not chosen yet."},{"id":"e_ws_amp_i2s","from":"waveshare","to":"amp","layer":"i2s","method":"header","decided":true,"hint":"Bit clock, word clock and data out to the amplifier. Pins not chosen yet."},{"id":"e_mic_ws_i2s","from":"mic","to":"waveshare","layer":"i2s","method":"header","decided":true,"hint":"Clock, word select and data from the microphone. Pins not chosen yet."},{"id":"e_amp_speaker","from":"amp","to":"speaker","layer":"speaker","method":"screw","decided":true,"hint":"Two wires: screwed into the amplifier's terminal, soldered to the speaker's lugs."},{"id":"e_wt32_shifter","from":"wt32","to":"shifter","layer":"gpio","method":"header","decided":true,"hint":"LED data at 3.3 V from one computer pin. Pin not chosen yet."},{"id":"e_shifter_led","from":"shifter","to":"led","layer":"gpio","method":"solder","decided":true,"hint":"LED data at 5 V through the 330 ohm resistor into the strip's DIN pad (the arrow points away from it)."},{"id":"e_wt32_mosfet","from":"wt32","to":"mosfet","layer":"gpio","method":"header","decided":false,"hint":"Heater on/off signal into the module's signal input (the optocoupler LED). A pull-down keeps the heater off while the computer boots."},{"id":"e_button_line","from":"button","to":"linecircuit","layer":"button","method":"solder","decided":true,"hint":"Two wires from the button (with its end-of-line resistor) to the line circuit."},{"id":"e_line_wt32","from":"linecircuit","to":"wt32","layer":"button","method":"header","decided":true,"hint":"The measured line voltage into IO1 (ADC1), bench-tested. The ESP's internal pull-up is on too, so a loose signal wire reads as cut, not as a press."},{"id":"e_lilygo_ap","from":"lilygo","to":"wt32","layer":"wifi","method":"wireless","decided":true,"hint":"The screen computer's WiFi link to the access point (locked decision)."},{"id":"e_ws_ap","from":"waveshare","to":"wt32","layer":"wifi","method":"wireless","decided":true,"hint":"The talk computer's WiFi link to the access point. If calls over WiFi fail the in-box test, a small cold-rated switch in the box can give it a cable instead."},{"id":"e_wt32_ha","from":"wt32","to":"ha","layer":"software","method":"network","decided":true,"hint":"The encrypted ESPHome API from the doorbell computer to Home Assistant, over the one cable and the house network. Carries the ring event first, before any local feedback. The light, heater and sensor are controlled over it too."},{"id":"e_ws_ha","from":"waveshare","to":"ha","layer":"software","method":"network","decided":true,"hint":"The talk computer's link to Home Assistant over WiFi: the ESPHome API plus the VoIP Stack call (speech both ways, relayed by Home Assistant to your phone). Only ever started by a visitor's press; auto-answer locked off."},{"id":"e_ha_lilygo","from":"ha","to":"lilygo","layer":"software","method":"network","decided":true,"hint":"Home Assistant sends the screen what to show; touches come back the same way. Over WiFi."},{"id":"e_ha_phone","from":"ha","to":"phone","layer":"software","method":"network","decided":true,"hint":"Push notification on the loud 'Klingel' channel (ttl 0, high priority); a silence toggle switches to a quiet channel."},{"id":"e_ha_speakers","from":"ha","to":"speakers","layer":"software","method":"network","decided":false,"hint":"PLANNED: the chime on the house speakers."},{"id":"e_ws_transcribe","from":"waveshare","to":"transcribe","layer":"software","method":"network","decided":true,"hint":"PLANNED: a recorded voice message goes to the local n8n + Whisper pipeline."},{"id":"e_transcribe_telegram","from":"transcribe","to":"telegram","layer":"software","method":"network","decided":false,"hint":"PLANNED: the Telegram bot sends audio plus transcript."},{"id":"e_telegram_phone","from":"telegram","to":"phone","layer":"software","method":"network","decided":false,"hint":"PLANNED: the voice message arrives in Telegram; a voice note sent back travels the other way and is played at the door."},{"id":"e_ha_ws_play","from":"ha","to":"waveshare","layer":"software","method":"network","decided":false,"hint":"PLANNED: a reply or announcement is played through the door speaker (ESPHome media player)."},{"id":"e_ws_app","from":"waveshare","to":"app","layer":"software","method":"network","decided":false,"hint":"PLANNED/FUTURE: the live push-to-talk stream from the door microphone to a relay, one direction at a time."},{"id":"e_app_speakers","from":"app","to":"speakers","layer":"software","method":"network","decided":false,"hint":"PLANNED/FUTURE: the relay plays the visitor's voice live on the house speakers."},{"id":"e_app_ha","from":"app","to":"ha","layer":"software","method":"network","decided":false,"hint":"FUTURE: the family app exposes an API/integration to Home Assistant (status and control)."},{"id":"e_speaker_grille","from":"speaker","to":"grille","layer":"mech","method":"mech","decided":true,"hint":"Speaker screwed and sealed to the box's front wall behind the grille; sound leaves through the slots."},{"id":"e_lilygo_window","from":"lilygo","to":"window","layer":"mech","method":"mech","decided":true,"hint":"Screen behind the window with a soft gasket; the panel is thin glass, no hard O-ring."},{"id":"e_heater_lilygo","from":"heater","to":"lilygo","layer":"mech","method":"mech","decided":true,"hint":"Heater pad on the back of the screen, with thermally conductive tape."},{"id":"e_mic_membrane","from":"mic","to":"membrane","layer":"mech","method":"mech","decided":true,"hint":"Microphone behind the membrane, smallest possible air gap."},{"id":"e_membrane_holes","from":"membrane","to":"micholes","layer":"mech","method":"mech","decided":true,"hint":"Membrane stuck on the back of the brass over the two mic holes."},{"id":"e_led_diffusor","from":"led","to":"diffusor","layer":"mech","method":"mech","decided":true,"hint":"Strip inside the diffusor; its cable enters through a window in the brass bend."},{"id":"e_gasket_brass","from":"gasket","to":"brass","layer":"mech","method":"mech","decided":true,"hint":"The brass front presses on the gasket in the box rim."},{"id":"e_button_brass","from":"button","to":"brass","layer":"mech","method":"mech","decided":true,"hint":"Button ring recessed in the brass, O-ring behind it."},{"id":"e_splitter_rail","from":"splitter","to":"rail5","layer":"v5","method":"solder","decided":true,"hint":"5 V from the PoE module (doorbell computer pin 40, VBUS) to the distribution board, thick wire."},{"id":"e_rail_fuse","from":"rail5","to":"fuse","layer":"v5","method":"solder","decided":false,"hint":"Planned: 5 V from the distribution board through the 73 C fuse to the heater."},{"id":"e_wt32_sht_i2c","from":"wt32","to":"sht31","layer":"i2c","method":"solder","decided":true,"hint":"I2C from the doorbell computer (IO17 SDA, IO18 SCL) over the distribution board to the SHT31-D."},{"id":"e_wt32_sht_3v3","from":"wt32","to":"sht31","layer":"v3","method":"solder","decided":true,"hint":"3.3 V for the SHT31-D from the doorbell computer (pin 36) over the distribution board's 3V3 rail."},{"id":"e_lilygo_radar_5v","from":"lilygo","to":"radar","layer":"v5","method":"solder","decided":true,"hint":"5 V for the radar from the screen computer's second VBUS hole."},{"id":"e_radar_lilygo","from":"radar","to":"lilygo","layer":"gpio","method":"solder","decided":true,"hint":"Radar UART (TX/RX, 3.3 V) to the screen computer's RX/TX holes; firmware to come."},{"id":"e_wt32_ws_watch","from":"wt32","to":"waveshare","layer":"gpio","method":"solder","decided":true,"hint":"Four supervision wires: heartbeat each way, reset each way."},{"id":"e_wt32_roomkeys","from":"wt32","to":"roomkeys","layer":"software","method":"network","decided":true,"hint":"Direct ring path: every press as encrypted UDP straight to the room keys."},{"id":"e_wt32_lilygo","from":"wt32","to":"lilygo","layer":"software","method":"network","decided":true,"hint":"Direct ring path to the door screen."},{"id":"e_ws_roomkeys","from":"waveshare","to":"roomkeys","layer":"software","method":"network","decided":true,"hint":"Voice link aikos_voice between the door and the room keys."},{"id":"e_transcribe_ha","from":"transcribe","to":"ha","layer":"software","method":"network","decided":true,"hint":"Transcripts back to Home Assistant, which sends them to the screen."}],"tours":[{"id":"ring","status":"decided","hint":"Someone presses the button. Target: phone notification in under 1 second.","steps":[{"nodes":["button","linecircuit"],"edges":["e_button_line"],"hint":"Pressing closes the contacts: the line voltage drops from about 2.0 V to about 0.4 V."},{"nodes":["linecircuit","wt32"],"edges":["e_line_wt32"],"hint":"The doorbell computer samples the line every millisecond; below 1.30 V it is 'pressed', and only above 1.60 V released again, so a wobbly contact counts once."},{"nodes":["wt32","splitter","gland","cable","surge","poeswitch","ha","roomkeys","lilygo"],"edges":["e_wt32_ha","e_splitter_wt32","e_gland_splitter","e_cable_gland","e_surge_cable","e_switch_surge","e_switch_ha","e_wt32_roomkeys","e_wt32_lilygo"],"hint":"Ring goes out twice: to HA over the cable, and directly to the room keys and the screen."},{"nodes":["ha","phone","speakers"],"edges":["e_ha_phone","e_ha_speakers"],"hint":"Home Assistant pushes a loud notification to your phone and (planned) chimes the house speakers."},{"nodes":["wt32","lilygo"],"edges":["e_wt32_lilygo"],"hint":"The screen shows the ring page with Sprechen."}]},{"id":"power","status":"decided","hint":"Where the power comes from, from the wall socket to every part.","steps":[{"nodes":["ups","poeswitch"],"edges":["e_ups_switch"],"hint":"Mains feeds the UPS, the UPS feeds the switch. A power cut does not stop the doorbell."},{"nodes":["poeswitch","surge","cable","gland","splitter"],"edges":["e_switch_surge","e_surge_cable","e_cable_gland","e_gland_splitter"],"hint":"The switch puts about 48 V on the cable (PoE). High voltage means little current and little loss in the cable."},{"nodes":["splitter","wt32","rail5"],"edges":["e_splitter_wt32","e_splitter_rail"],"hint":"PoE module on the doorbell computer makes 5 V for the whole box."},{"nodes":["rail5","wt32","waveshare","lilygo","amp","radar"],"edges":["e_rail_wt32","e_rail_ws","e_rail_lilygo","e_rail_amp","e_lilygo_radar_5v"],"hint":"Distribution board splits the 5 V."},{"nodes":["wt32","waveshare","bme","sht31","mic","linecircuit"],"edges":["e_wt32_bme_3v3","e_wt32_sht_3v3","e_ws_mic_3v3","e_wt32_line_3v3"],"hint":"3.3 V."},{"nodes":["rail5","fuse","heater","mosfet"],"edges":["e_rail_fuse","e_fuse_heater","e_heater_mosfet"],"hint":"Planned heater path on 5 V."},{"nodes":["gndstar"],"edges":["e_gnd_wt32","e_gnd_ws","e_gnd_lilygo","e_gnd_mosfet","e_gnd_splitter"],"hint":"Common ground."}]},{"id":"screen","status":"decided","hint":"How the screen gets what it shows.","steps":[{"nodes":["ha"],"edges":[],"hint":"Home Assistant decides the content: greeting, a notice, a QR code (later from the family app)."},{"nodes":["ha","wt32","lilygo"],"edges":["e_wt32_ha","e_lilygo_ap","e_ha_lilygo"],"hint":"Over the cable to the doorbell computer, over its Wi-Fi aikos to the screen."},{"nodes":["lilygo","window"],"edges":["e_lilygo_window"],"hint":"The screen computer draws the e-paper. The image stays without power."},{"nodes":["lilygo","ha"],"edges":["e_ha_lilygo"],"hint":"Touches go back the same way."}]},{"id":"winter","status":"planned","hint":"Keeping the e-paper warm in winter.","steps":[{"nodes":["bme","sht31","wt32"],"edges":["e_wt32_bme_i2c","e_wt32_sht_i2c"],"hint":"Two sensors on I2C."},{"nodes":["wt32","mosfet"],"edges":["e_wt32_mosfet"],"hint":"Below the set point the doorbell computer switches the heater on (and off again during calls, to stay within the PoE power budget)."},{"nodes":["mosfet","heater","fuse","lilygo"],"edges":["e_heater_mosfet","e_fuse_heater","e_heater_lilygo"],"hint":"The pad warms the back of the screen. The fuse cuts it for good if anything overheats."},{"nodes":["lilygo"],"edges":[],"hint":"Below about +2 C the screen waits before refreshing."}]},{"id":"light","status":"decided","hint":"The light at dusk or when someone approaches.","steps":[{"nodes":["ha"],"edges":[],"hint":"Home Assistant decides: dusk, or the existing motion sensor at the door."},{"nodes":["ha","wt32"],"edges":["e_wt32_ha"],"hint":"It tells the doorbell computer over ESPHome."},{"nodes":["wt32","shifter","led","diffusor"],"edges":["e_wt32_shifter","e_shifter_led","e_led_diffusor"],"hint":"The data line, raised to 5 V, drives the LEDs; the diffusor softens them into one warm band."}]},{"id":"talk","status":"decided","hint":"A conversation between the door and a room key, started by the visitor after a ring or by holding a room key.","steps":[{"nodes":["button","linecircuit","wt32","lilygo","roomkeys"],"edges":["e_button_line","e_line_wt32","e_wt32_lilygo","e_wt32_roomkeys"],"hint":"Ring, then the screen offers Sprechen."},{"nodes":["lilygo","waveshare","roomkeys"],"edges":["e_ws_ap","e_lilygo_ap","e_ws_roomkeys"],"hint":"Visitor taps Sprechen, or a resident holds a room key: the door starts the call."},{"nodes":["micholes","membrane","mic","waveshare","roomkeys"],"edges":["e_membrane_holes","e_mic_membrane","e_mic_ws_i2s","e_ws_roomkeys"],"hint":"Door mic to the room keys."},{"nodes":["roomkeys","waveshare","amp","speaker","grille"],"edges":["e_ws_roomkeys","e_ws_amp_i2s","e_amp_speaker","e_speaker_grille"],"hint":"Room key voice to the door speaker."},{"nodes":["waveshare","transcribe","ha","lilygo"],"edges":["e_ws_transcribe","e_transcribe_ha","e_ha_lilygo"],"hint":"Transcript of both sides on the door screen."}]},{"id":"voicemsg","status":"planned","hint":"PLANNED: a visitor leaves a voice message.","steps":[{"nodes":["lilygo"],"edges":[],"hint":"The visitor taps 'leave a message' on the screen, which announces that it records."},{"nodes":["micholes","membrane","mic","waveshare"],"edges":["e_membrane_holes","e_mic_membrane","e_mic_ws_i2s"],"hint":"The microphone records through the holes and the membrane."},{"nodes":["waveshare","transcribe"],"edges":["e_ws_transcribe"],"hint":"The recording goes to the local transcription server; Whisper turns it into text at home."},{"nodes":["transcribe","telegram","phone"],"edges":["e_transcribe_telegram","e_telegram_phone"],"hint":"The bot sends audio and text to your phone via Telegram."}]},{"id":"reply","status":"planned","hint":"PLANNED: you answer from your phone.","steps":[{"nodes":["phone","telegram"],"edges":["e_telegram_phone"],"hint":"You send a voice note to the bot."},{"nodes":["telegram","transcribe","ha"],"edges":["e_transcribe_telegram"],"hint":"The automation passes it to Home Assistant."},{"nodes":["ha","waveshare","amp","speaker","grille"],"edges":["e_ha_ws_play","e_ws_amp_i2s","e_amp_speaker","e_speaker_grille"],"hint":"The door plays it through the amplifier and speaker."}]},{"id":"ptt","status":"planned","hint":"PLANNED: push-to-talk into the house, live, one direction at a time.","steps":[{"nodes":["lilygo"],"edges":[],"hint":"The screen shows 'hold here and speak'."},{"nodes":["mic","waveshare"],"edges":["e_mic_ws_i2s"],"hint":"While held, the microphone streams."},{"nodes":["waveshare","app","speakers"],"edges":["e_ws_app","e_app_speakers"],"hint":"A relay plays it live on the house speakers. One direction at a time avoids the echo problem of a full phone call."}]}],"solder":[{"node":"button","hint":"10 kOhm end-of-line resistor across the button's two contacts, then shrink tubing over it."},{"node":"linecircuit","hint":"10 kOhm, 1 kOhm and 100 nF on perfboard, as on the v1 breadboard."},{"node":"shifter","hint":"Chip in a DIP-14 socket on perfboard; 330 ohm in the output line; unused inputs and the enable (OE) pins to ground; 5 V supply."},{"node":"led","hint":"Three wires onto +5V, DIN and GND at the start of the arrow; 1000 uF across +5 V and GND at the strip, stripe to minus."},{"node":"amp","hint":"7-pin header and the speaker terminal; a 100 kOhm resistor from GAIN to Vin for the lowest gain (3 dB). Not to ground."},{"node":"speaker","hint":"Two wires on the solder lugs; keep the iron brief."},{"node":"mic","hint":"6-pin header or wires directly; labelled side (sound hole) towards the membrane."},{"node":"bme","hint":"BME280 header soldered into the distribution board, two bridges to 3.3 V and ground."},{"node":"mosfet","hint":"Planned: logic-level MOSFET with gate resistor and pull-down on the distribution board."},{"node":"fuse","hint":"Crimp preferred. If soldered: clamp pliers between joint and fuse body as a heat sink, long legs. Soldering heat can blow a 73 C fuse."},{"node":"waveshare","hint":"Wires soldered straight onto the talk computer's header pins, heat shrink over each."},{"node":"wt32","hint":"Pin header row IO43 ... VBUS soldered (3V3, IO1 and GND are used for the button line); the kit comes with loose headers."},{"node":"rail5","hint":"Distribution board: rails, button-line circuit, BME280, 16 wires."},{"node":"lilygo","hint":"Two thick wires into the screen's edge row; radar wires too."}],"pending":["Heater switch: a logic-level MOSFET on the distribution board, and the heater control in the doorbell computer's firmware.","Climate sensors: firmware 0.3.23 written, not yet on the device; first readings from the box pending.","Radar: wired to the screen computer; firmware pending (the log has to leave UART0 first).","Light: COB strip type, the level shifter on the distribution board, and the cable through the front.","Service USB: three data-only breakouts in the bottom, not wired yet; the firmware must keep USB alive and pause the supervision while flashing.","PoE module in frost: no published temperature range, a cold start was not tested; the industrial splitter is the fallback.","A full call with a room key and the transcript, in the box.","Water test of the box, then the v4 box without glued parts and the metal front from a metal shop."],"milestones":[{"id":"m_concept","track":"plan","status":"done","needs":[],"soft":[],"tasks":[{"id":"t_front","status":"done","node":"brass"},{"id":"t_arch","status":"done","node":"wt32"},{"id":"t_parts","status":"done"},{"id":"t_map","status":"done"}]},{"id":"m_parts","track":"hw","status":"now","needs":["m_concept"],"soft":[],"tasks":[{"id":"t_split","status":"done","node":"splitter"},{"id":"t_inhand","status":"done"},{"id":"t_mail","status":"done","node":"lilygo"},{"id":"t_order","status":"open","node":"mosfet"}]},{"id":"m_fit","track":"hw","status":"done","needs":["m_parts"],"soft":[],"tasks":[{"id":"t_measure","status":"done"},{"id":"t_cables","status":"done","node":"gland"},{"id":"t_alpha1","sta 0,1440,408],"cards":{"m_concept":[20,150,200,108],"m_parts":[260,20,200,108],"m_fit":[500,20,200,108],"m_soft":[500,150,200,108],"m_water":[260,280,440,108],"m_beta":[740,85,200,108],"m_pre":[980,182,200,108],"m_door":[1220,182,200,108]},"links":[{"from":"m_concept","to":"m_parts","pts":[[220,190],[240,190],[240,74],[260,74]]},{"from":"m_concept","to":"m_water","pts":[[220,218],[240,218],[240,334],[260,334]]},{"from":"m_parts","to":"m_fit","pts":[[460,60],[500,60]]},{"from":"m_parts","to":"m_soft","pts":[[460,96],[480,96],[480,204],[500,204]]},{"from":"m_fit","to":"m_beta","pts":[[700,74],[720,74],[720,125],[740,125]]},{"from":"m_soft","to":"m_beta","pts":[[700,204],[720,204],[720,155],[740,155]]},{"from":"m_water","to":"m_beta","soft":true,"pts":[[700,300],[840,300],[840,193]]},{"from":"m_water","to":"m_pre","pts":[[700,356],[950,356],[950,256],[980,256]]},{"from":"m_beta","to":"m_pre","pts":[[940,139],[962,139],[962,216],[980,216]]},{"from":"m_pre","to":"m_door","pts":[[1180,236],[1220,236]]}]}},"texts":{"nodes":{"telegram":{"en":{"label":"Telegram","what":"Messenger service on the internet. Planned: it delivers a visitor's voice message plus its transcript to your phone and carries your spoken reply back to the door.","specs":"Already in use with the household's own bots. Voice-message use: planned, not built yet.","why":"The household's Telegram bots and the local transcription pipeline already run. The cost is that the audio passes through Telegram's servers.","solder":""},"de":{"label":"Telegram","what":"Messenger-Dienst im Internet. Geplant: Er stellt die Sprachnachricht eines Besuchers samt Abschrift auf dein Handy zu und bringt deine gesprochene Antwort zurück an die Tür.","specs":"Im Haushalt schon mit eigenen Bots im Einsatz. Nutzung für Sprachnachrichten: geplant, noch nicht gebaut.","why":"Die Telegram-Bots des Haushalts und die lokale Transkription laufen bereits. Dafür nimmt man in Kauf, dass der Ton über die Server von Telegram läuft.","solder":""}},"ha":{"en":{"label":"Home Assistant","what":"The home automation server, already running. It talks to all three door computers via ESPHome (the firmware on them) and runs the automations: ring notification, silence toggle, screen content, light at dusk and, planned, starting a call.","specs":"Encrypted ESPHome API to the doorbell computer over the cable; the screen and talk computers by WiFi. Ring event first, then feedback. Planned: family app API.","why":"The door computers stay simple and all logic lives in one place, on a server the house already runs.","solder":""},"de":{"label":"Home Assistant","what":"Der Hausautomations-Server, läuft bereits. Er spricht per ESPHome (Firmware auf den Türrechnern) mit allen drei Rechnern an der Tür und steuert die Abläufe: Klingelmeldung, Stummschalter, Bildschirminhalt, Licht bei Dämmerung und, geplant, den Gesprächsaufbau.","specs":"Verschlüsselte ESPHome-API zum Klingelrechner über das Kabel, per WLAN zu Bildschirm- und Sprechrechner. Klingelereignis vor Rückmeldung. Geplant: API zur Familien-App.","why":"Die Türrechner bleiben einfach, die ganze Logik liegt an einer Stelle, auf einem Server, der im Haus ohnehin läuft.","solder":""}},"phone":{"en":{"label":"Your phone","what":"Gets the ring notification from the Home Assistant companion app on a loud channel, target under 1 second. Planned: Telegram voice messages with transcript, and your voice replies back to the door.","specs":"Loud channel 'Klingel' (doorbell), high priority, ttl 0 (deliver at once). A silence toggle picks a quiet channel. Target: under 1 s.","why":"The phone's own channel settings decide how the ring sounds. Home Assistant only picks the channel, loud or quiet.","solder":""},"de":{"label":"Dein Handy","what":"Bekommt die Klingelmeldung über die Companion-App von Home Assistant auf einem lauten Kanal, Ziel unter 1 Sekunde. Geplant: Sprachnachrichten mit Abschrift über Telegram und deine Antworten zurück an die Tür.","specs":"Kanal „Klingel“, hohe Priorität, ttl 0 (sofort zustellen). Ein Stummschalter leitet Klingeln auf einen leisen Kanal um. Ziel: unter 1 s.","why":"Wie das Klingeln klingt, legen die Kanaleinstellungen auf dem Handy fest. Home Assistant wählt nur den Kanal, laut oder leise.","solder":""}},"ap":{"en":{"label":"House Wi-Fi","what":"The existing house Wi-Fi. The screen and the talk computer use it only as a fallback: normally they join the doorbell computer's own Wi-Fi 'aikos', centimetres away.","specs":"The house Wi-Fi is entered once per device over Improv (a setup over USB or Bluetooth) and never stored in a file.","why":"Wi-Fi from outside the metal front was the uncertain part. With the access point inside the box the link no longer depends on it.","solder":""},"de":{"label":"Haus-WLAN","what":"Das vorhandene Haus-WLAN. Bildschirm und Sprechrechner nutzen es nur als Rückfallebene: normalerweise hängen sie im eigenen WLAN „aikos“ des Klingelrechners, Zentimeter entfernt.","specs":"Das Haus-WLAN wird pro Gerät einmal über Improv (Einrichtung über USB oder Bluetooth) eingegeben und nie in einer Datei gespeichert.","why":"WLAN von außen durch die Metallfront war der unsichere Teil. Mit dem Zugangspunkt im Kasten hängt die Verbindung nicht mehr davon ab.","solder":""}},"transcribe":{"en":{"label":"Transcription server","what":"A computer in the house that turns speech into text (Whisper). During a call it gets a copy of the door audio; what both sides say comes back as text and appears on the door screen.","specs":"Local Whisper speech-to-text with pause detection and an echo cut, so the resident's voice from the door speaker is not transcribed twice. Voice messages are planned.","why":"Transcription stays at home; no outside speech-to-text service is involved.","solder":""},"de":{"label":"Transkriptions-Server","what":"Ein Rechner im Haus, der Sprache in Text verwandelt (Whisper). Während eines Gesprächs bekommt er eine Kopie des Türtons; was beide Seiten sagen, kommt als Text zurück und erscheint auf dem Türbildschirm.","specs":"Lokale Whisper-Spracherkennung mit Pausenerkennung und Echo-Schnitt, damit die Stimme aus dem Türlautsprecher nicht doppelt mitgeschrieben wird. Sprachnachrichten sind geplant.","why":"Die Mitschrift bleibt im Haus; kein externer Spracherkennungsdienst ist beteiligt.","solder":""}},"speakers":{"en":{"label":"House speakers","what":"Planned WiFi speakers in the house. They play the doorbell chime and, also planned, the visitor's voice live during push-to-talk (speech in one direction at a time).","specs":"Planned; model not decided yet. Example: Home Assistant Voice PE (84 × 84 × 21 mm), needs its own USB-C 5 V / 3 A supply.","why":"The old indoor chime is probably broken. WiFi speakers play announcements and audio files from Home Assistant, so ringtone and volume become settings.","solder":""},"de":{"label":"Hauslautsprecher","what":"Geplante WLAN-Lautsprecher im Haus. Sie spielen den Klingelton und, ebenfalls geplant, die Stimme des Besuchers live per Push-to-Talk (Sprechen in jeweils eine Richtung).","specs":"Geplant, Modell noch nicht entschieden. Beispiel: Home Assistant Voice PE (84 × 84 × 21 mm), braucht ein eigenes USB-C-Netzteil 5 V / 3 A.","why":"Der alte Gong ist vermutlich defekt. WLAN-Lautsprecher spielen Ansagen und Audiodateien aus Home Assistant, Klingelton und Lautstärke sind dann Einstellungen.","solder":""}},"app":{"en":{"label":"Family app","what":"Planned for later: a self-hosted web app for the household to manage doorbell, speakers and other home systems (screen notices, ringtones, volumes). Could host the live push-to-talk relay (a server forwarding the audio).","specs":"Future, nothing built yet. Self-hosted web UI with an API to Home Assistant for status and control.","why":"Home Assistant stays the automation hub; the app becomes the household's interface and reaches the door's settings through an API.","solder":""},"de":{"label":"Familien-App","what":"Später geplant: eine selbst gehostete Web-App für den Haushalt, die Klingel, Lautsprecher und andere Haustechnik verwaltet (Bildschirmhinweise, Klingeltöne, Lautstärken). Könnte die Push-to-Talk-Weiterleitung übernehmen.","specs":"Zukunft, noch nichts gebaut. Selbst gehostete Weboberfläche mit API zu Home Assistant für Status und Steuerung.","why":"Home Assistant bleibt die Automationszentrale; die App wird die Oberfläche für den Haushalt und erreicht die Einstellungen der Tür über eine API.","solder":""}},"ups":{"en":{"label":"UPS","what":"Battery-backed mains supply (UPS, uninterruptible power supply) in the technical room. It feeds the network switch, so the whole doorbell keeps running during short power cuts.","specs":"Already in place. 230 V mains to the switch's power supply; the box itself gets its power through PoE.","why":"The doorbell is treated as critical. Since the box hangs off the switch by PoE, one UPS in front of the switch covers the whole door.","solder":""},"de":{"label":"USV","what":"Batteriegestützte Netzversorgung (USV, unterbrechungsfreie Stromversorgung) im Technikraum. Sie speist den Netzwerk-Switch, damit die ganze Klingel kurze Stromausfälle übersteht.","specs":"Vorhanden. 230 V an das Netzteil des Switches; der Kasten selbst bekommt seinen Strom per PoE.","why":"Die Klingel gilt als kritisch. Weil der Kasten per PoE am Switch hängt, sichert eine USV vor dem Switch die ganze Tür ab.","solder":""}},"poeswitch":{"en":{"label":"PoE switch port","what":"A UniFi switch port with PoE (Power over Ethernet: data and power on one network cable) switched on. It sends data and about 48 V down the single cable to the box.","specs":"To buy: a small UniFi PoE switch for the door is planned, powered from the UPS. About 48 V. The surge protector lists only 802.3af.","why":"One cable feeds the whole box. Opening the front exposes a live network port, so in any build give that port its own VLAN, port isolation and a MAC lock.","solder":""},"de":{"label":"PoE-Switch-Port","what":"Ein Port an einem UniFi-Switch mit eingeschaltetem PoE (Power over Ethernet: Daten und Strom über ein Netzwerkkabel). Er schickt Daten und etwa 48 V über das eine Kabel zum Kasten.","specs":"Zu kaufen: geplant ist ein kleiner UniFi-PoE-Switch für die Tür, versorgt von der USV. Etwa 48 V. Der Überspannungsschutz nennt nur 802.3af.","why":"Ein Kabel versorgt den Kasten. Hinter der Front liegt ein aktiver Netzwerkport; beim Nachbau gehört er in ein eigenes VLAN, mit Port-Isolation und MAC-Sperre.","solder":""}},"surge":{"en":{"label":"Surge protector","what":"Sits between the switch and the outdoor cable and diverts lightning-induced surges (short high-voltage spikes) to earth before they reach the switch. Works only once an electrician connects it to the house earth.","specs":"UniFi ETH-SP-G2, already owned. 91 × 61 × 32.5 mm. Datasheet lists only 802.3af (basic PoE standard, 12.95 W at the device).","why":"Keeps surges from the outdoor cable off the switch. As its datasheet lists only 802.3af, the box should stay within it; its real draw is not measured yet.","solder":""},"de":{"label":"Überspannungsschutz","what":"Sitzt zwischen Switch und Außenkabel und leitet durch Blitz eingekoppelte Überspannungen (kurze Spannungsspitzen) vor dem Switch zur Erde ab. Wirkt nur, wenn ein Elektriker ihn an die Hauserde anschließt.","specs":"UniFi ETH-SP-G2, vorhanden. 91 × 61 × 32,5 mm. Datenblatt nennt nur 802.3af (PoE-Grundstandard, 12,95 W am Gerät).","why":"Schützt den Switch vor Überspannungen aus dem Außenkabel. Das Datenblatt nennt nur 802.3af, dabei sollte der Kasten bleiben; Verbrauch noch nicht gemessen.","solder":""}},"earthbar":{"en":{"label":"House earth","what":"The house's equipotential bonding bar, the central point where the protective earth wires meet. The electrician connects the surge protector to it, which gives surges a path into the ground.","specs":"Existing. Of the doorbell parts, only the surge protector connects to it; no normal current flows here. An electrician makes the connection.","why":"Without earth the surge protector has nowhere to divert a surge. The electrician does it on the same visit as removing the old dead doorbell transformer.","solder":""},"de":{"label":"Hauserde","what":"Die Potentialausgleichsschiene des Hauses, der zentrale Punkt, an dem die Schutzleiter zusammenlaufen. Der Elektriker schließt den Überspannungsschutz dort an; so haben Überspannungen einen Weg in die Erde.","specs":"Vorhanden. Von der Klingel hängt nur der Überspannungsschutz daran; im Normalbetrieb fließt kein Strom. Anschluss durch den Elektriker.","why":"Ohne Erdung kann der Überspannungsschutz nichts ableiten. Der Elektriker erledigt das im selben Termin, in dem er den alten, defekten Klingeltrafo ausbaut.","solder":""}},"cable":{"en":{"label":"Outdoor Cat6 cable","what":"One ready-made outdoor network cable from the surge protector through the wall into the box. It carries data and PoE power. The exact route is not decided yet.","specs":"Cat6, about 10 m, solid copper AWG24 (wire gauge), -40 to +75 °C. Candidate goobay 55432; not the 94389, which is copper-clad aluminium.","why":"Ready-made plugs mean no crimping (fitting plugs by hand). Loss: about 0.29 V at 350 mA. An unconnected spare cable in the same bundle is not decided yet.","solder":""},"de":{"label":"Außenkabel Cat6","what":"Ein fertig konfektioniertes Outdoor-Netzwerkkabel vom Überspannungsschutz durch die Wand in den Kasten. Es führt Daten und PoE-Strom. Der genaue Kabelweg ist noch nicht entschieden.","specs":"Cat6, ca. 10 m, massives Kupfer AWG24 (Aderstärke), −40 bis +75 °C. Kandidat goobay 55432; nicht 94389, das ist kupferkaschiertes Aluminium.","why":"Fertige Stecker ersparen das Crimpen (Stecker selbst aufpressen). Verlust: etwa 0,29 V bei 350 mA. Ob ein Reservekabel mitkommt, ist noch nicht entschieden.","solder":""}},"gland":{"en":{"label":"Split cable gland","what":"The single sealed cable entry, in the bottom of the box. It opens so the moulded RJ45 plug (the network plug) passes through; then the split insert closes watertight around the cable.","specs":"Split M20 gland for a 6–8 mm cable: OBO V-TEC TB20 06-08 (with split lock nut) or PFLITSCH USG with split nut and sealing insert. One Ø20.5 mm hole in the bottom of the box; inside, the cable runs along five eyelets in an S-curve.","why":"Lets the ready-made cable in without cutting off its plug. Measure the cable's outer diameter first; it is not published.","solder":""},"de":{"label":"Kabelverschraubung","what":"Die einzige abgedichtete Kabeleinführung, im Kastenboden. Sie lässt sich öffnen, damit der angespritzte RJ45-Stecker (Netzwerkstecker) hindurchpasst; danach schließt der geteilte Einsatz wasserdicht um das Kabel.","specs":"Teilbare M20-Verschraubung für ein 6–8-mm-Kabel: OBO V-TEC TB20 06-08 (mit teilbarer Gegenmutter) oder PFLITSCH USG mit teilbarer Mutter und Dichteinsatz. Ein Loch Ø 20,5 mm im Kastenboden; innen läuft das Kabel in einer S-Kurve an fünf Ösen entlang.","why":"Das fertige Kabel kommt hinein, ohne dass man den Stecker abschneidet. Vorher den Außendurchmesser des Kabels messen; er ist nicht veröffentlicht.","solder":""}},"splitter":{"en":{"label":"PoE module","what":"Takes the power out of the network cable (PoE, Power over Ethernet: data and power on one cable) and makes 5 V. It is plugged onto the doorbell computer; its 5 V feeds the whole box.","specs":"Waveshare PoE Module (B), 802.3af. Measured at the switch port: 4.13 W with everything idle (bench), 4.82 W in the box, 9.37 W with the heater on; the 5 V rail sags from 5.0 to 4.8 V under the heater. No published temperature range.","why":"It replaced the planned industrial splitter and the 12 → 5 V converter: one part fewer, and the load test with the heater passed. Not tested: a cold start in frost. The industrial splitter stays the fallback.","solder":""},"de":{"label":"PoE-Modul","what":"Holt den Strom aus dem Netzwerkkabel (PoE, Power over Ethernet: Daten und Strom auf einer Leitung) und macht daraus 5 V. Es steckt auf dem Klingelrechner; seine 5 V versorgen den ganzen Kasten.","specs":"Waveshare PoE Module (B), 802.3af. Gemessen am Switch-Port: 4,13 W im Leerlauf (Labortisch), 4,82 W im Kasten, 9,37 W mit Heizung; die 5-V-Schiene sinkt dabei von 5,0 auf 4,8 V. Kein veröffentlichter Temperaturbereich.","why":"Es ersetzt den geplanten Industriesplitter und den 12→5-V-Wandler: ein Teil weniger, und der Lasttest mit Heizung war bestanden. Nicht getestet: ein Kaltstart im Frost. Der Industriesplitter bleibt der Plan B.","solder":""}},"rail5":{"en":{"label":"5 V distribution","what":"Where the 5 V from the PoE module is split into one wire per consumer. It is a soldered rail on the distribution board, a small perfboard at the bottom of the box.","specs":"Perfboard 30 × 70 mm, 10 × 24 holes. 5 V rail in column B, fed from the doorbell computer's header pin 40 (VBUS) with a thick wire; thick wires on to the screen and the amplifier. The talk computer takes its 5 V straight from pin 40, on the same carrier. Room left for the heater switch and the LED level shifter.","why":"On the bench two faults came from loose breadboard contacts. In the box every joint is soldered, and every wire has 10–15 cm of reserve, so parts can move to the next box without cutting.","solder":""},"de":{"label":"5-V-Verteilung","what":"Wo die 5 V vom PoE-Modul auf je eine Leitung pro Verbraucher aufgeteilt werden. Eine gelötete Schiene auf der Verteilerplatine, einer kleinen Lochrasterplatine unten im Kasten.","specs":"Lochrasterplatine 30 × 70 mm, 10 × 24 Löcher. 5-V-Schiene in Spalte B, gespeist von Pin 40 (VBUS) des Klingelrechners über einen dicken Draht; dicke Drähte weiter zum Bildschirm und zum Verstärker. Der Sprechrechner nimmt seine 5 V direkt von Pin 40, auf demselben Träger. Platz frei für Heizungsschalter und LED-Pegelwandler.","why":"Auf dem Labortisch kamen zwei Fehler von lockeren Steckbrett-Kontakten. Im Kasten ist jede Verbindung gelötet, und jede Leitung hat 10–15 cm Reserve, damit die Teile ohne Schneiden in den nächsten Kasten umziehen können.","solder":""}},"gndstar":{"en":{"label":"Common ground","what":"Where every ground wire in the box meets. Ground is 0 V, the return path for every part's current and the reference that every signal voltage is measured against.","specs":"The GND rail in column A of the distribution board, fed from the doorbell computer's GND (header pin 33). Joined here: the screen, the amplifier, the button, the sensors. The talk computer's ground runs straight from the doorbell computer (pin 13).","why":"Without a common ground the parts cannot read each other's signals. A loose amplifier ground on the bench distorted every sound and lifted its supply by a diode drop.","solder":""},"de":{"label":"Gemeinsame Masse","what":"Wo sich alle Masseleitungen im Kasten treffen. Masse sind 0 V, der Rückweg für den Strom jedes Teils und der Bezug, gegen den jede Signalspannung gemessen wird.","specs":"Die Masseschiene in Spalte A der Verteilerplatine, gespeist vom GND des Klingelrechners (Pin 33). Hier hängen Bildschirm, Verstärker, Taster und Sensoren. Die Masse des Sprechrechners kommt direkt vom Klingelrechner (Pin 13).","why":"Ohne gemeinsame Masse können die Teile ihre Signale nicht lesen. Eine lose Verstärker-Masse auf dem Labortisch verzerrte jeden Ton und verschob seine Versorgung um einen Diodenabfall.","solder":""}},"waveshare":{"en":{"label":"Talk computer","what":"The computer for two-way talk: it drives the microphone and the amplifier and talks to the room keys over Wi-Fi. A copy of the door audio goes to the transcription server.","specs":"ESP32-S3-N16R8 dev board, silkscreen HW678. Microphone (I2S): SCK IO1, WS IO2, SD IO6. Amplifier (I2S): BCLK IO15, LRC IO16, DIN IO17. Heartbeat and reset wires to the doorbell computer on IO8, IO18, IO9 and RST. Voice link aikos_voice v2.1.0; speech capped at −6 dB.","why":"The ESP32-S3 has the power for audio. On Wi-Fi it needs no switch in the box; centimetres from the doorbell c
