# Door screen (aikos-intercom-screen.yaml). Copy to secrets.yaml (never commit it) and fill in your own values.
# API key: 32 random bytes, base64, e.g.  python -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
screen_api_key: "REPLACE_WITH_BASE64_KEY"
screen_ota_password: "REPLACE_WITH_RANDOM_PASSWORD"
screen_ap_password: "REPLACE_WITH_RANDOM_PASSWORD_8_TO_63_CHARS"   # setup access point
# the bell's Wi-Fi "aikos" (same value as in the bell's secrets); the house Wi-Fi is entered on the setup page
aikos_wifi_password: "REPLACE_WITH_RANDOM_PASSWORD_8_TO_63_CHARS"
bell_host: "192.0.2.11"   # example address (RFC 5737): the bell
talk_host: "192.0.2.13"   # the talk computer
# encrypted links (packet_transport): same values as in the bell's and the talk computer's secrets
door_link_key: "REPLACE_WITH_RANDOM_STRING"
key_link_key: "REPLACE_WITH_RANDOM_STRING"
ring_transport_key: "REPLACE_WITH_RANDOM_STRING"
