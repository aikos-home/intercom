# Copy to secrets.yaml (never commit it) and fill in your own values.
# API key: 32 random bytes, base64, e.g.  python -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
talk_api_key: "REPLACE_WITH_BASE64_KEY"
talk_ota_password: "REPLACE_WITH_RANDOM_PASSWORD"
talk_ap_password: "REPLACE_WITH_RANDOM_PASSWORD_8_TO_63_CHARS"   # ESPHome's fallback access point
# the bell's Wi-Fi "aikos" (same value as in the bell's secrets); the house Wi-Fi is entered via Improv, never in a file
aikos_wifi_password: "REPLACE_WITH_RANDOM_PASSWORD_8_TO_63_CHARS"
bell_host: "192.0.2.11"   # example address (RFC 5737): the bell; pinged on the house Wi-Fi: answers = "aikos" is back
# encrypted links (packet_transport): the same keys go into the screen's and the room keys' secrets
door_link_key: "REPLACE_WITH_RANDOM_STRING"   # screen <-> talk computer
key_link_key: "REPLACE_WITH_RANDOM_STRING"    # room keys <-> talk computer
