# Presence radar HLK-LD2410C on the door screen (package of aikos-intercom-screen.yaml, 2026-10-20).
# Wiring (box, WIRING.md): radar VCC -> screen edge hole 2 (VBUS 5 V), GND -> screen GND, radar TX -> hole "RX" (GPIO44),
# radar RX -> hole "TX" (GPIO43), OUT free. UART0 is free: the logger runs on USB_SERIAL_JTAG. The ROM boot messages on
# GPIO43 reach the radar at 115200 Bd; it ignores them.
# the owner 2026-10-04: range filter against passing cars; the speaker cone moves during calls -> masked there.
# The radar keeps its gates, sensitivities and Bluetooth switch in its own flash: set them once from HA, no rebuild.

uart:
  id: radar_uart
  tx_pin: GPIO43   # edge row "TX" -> radar RX
  rx_pin: GPIO44   # edge row "RX" <- radar TX
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  id: radar
  uart_id: radar_uart

binary_sensor:
  - platform: ld2410
    ld2410_id: radar
    has_target:
      id: radar_target
      name: Radar target
      entity_category: diagnostic
    has_moving_target:
      name: Radar moving target
      entity_category: diagnostic
    has_still_target:
      name: Radar still target
      entity_category: diagnostic
  # What the house uses: someone stands at the door. During a call (and 3 s after it) the radar is not asked, because
  # the speaker cone moves right next to it; the state from before the call holds.
  - platform: template
    id: someone_at_door
    name: Someone at the door
    device_class: occupancy
    lambda: |-
      static bool held = false;
      static uint32_t call_ms = 0;
      const uint32_t now = millis();
      // Not in the first minute after the screen starts: in the box on 20 Oct 2026 it reported a target at 75-118 cm
      // for 40 s right after a restart, in an empty room. A power cut at night must not switch on light or alarm.
      if (now < 60000)
        return false;
      if (door_ui::call_active) {
        call_ms = now == 0 ? 1 : now;
        return held;
      }
      if (call_ms != 0 && now - call_ms < 3000)
        return held;
      held = id(radar_target).state;
      return held;

sensor:
  - platform: ld2410
    ld2410_id: radar
    detection_distance:
      name: Radar distance
    moving_distance:
      name: Radar moving distance
      entity_category: diagnostic
    still_distance:
      name: Radar still distance
      entity_category: diagnostic
    moving_energy:
      name: Radar moving energy
      entity_category: diagnostic
    still_energy:
      name: Radar still energy
      entity_category: diagnostic
    # Energy per range gate (gate n = n x 0.75 m from the radar), sent only while "Radar engineering mode" is on: the
    # HA-dev test page (Klingel-Test > Radar) shows them as bars, to tune the thresholds below against false targets
    # (20/21 Oct 2026: a still target at 75-118 cm in the empty room).
    g0:
      move_energy: {name: Radar gate 0 moving energy, entity_category: diagnostic}
      still_energy: {name: Radar gate 0 still energy, entity_category: diagnostic}
    g1:
      move_energy: {name: Radar gate 1 moving energy, entity_category: diagnostic}
      still_energy: {name: Radar gate 1 still energy, entity_category: diagnostic}
    g2:
      move_energy: {name: Radar gate 2 moving energy, entity_category: diagnostic}
      still_energy: {name: Radar gate 2 still energy, entity_category: diagnostic}
    g3:
      move_energy: {name: Radar gate 3 moving energy, entity_category: diagnostic}
      still_energy: {name: Radar gate 3 still energy, entity_category: diagnostic}
    g4:
      move_energy: {name: Radar gate 4 moving energy, entity_category: diagnostic}
      still_energy: {name: Radar gate 4 still energy, entity_category: diagnostic}
    g5:
      move_energy: {name: Radar gate 5 moving energy, entity_category: diagnostic}
      still_energy: {name: Radar gate 5 still energy, entity_category: diagnostic}
    g6:
      move_energy: {name: Radar gate 6 moving energy, entity_category: diagnostic}
      still_energy: {name: Radar gate 6 still energy, entity_category: diagnostic}
    g7:
      move_energy: {name: Radar gate 7 moving energy, entity_category: diagnostic}
      still_energy: {name: Radar gate 7 still energy, entity_category: diagnostic}
    g8:
      move_energy: {name: Radar gate 8 moving energy, entity_category: diagnostic}
      still_energy: {name: Radar gate 8 still energy, entity_category: diagnostic}

number:
  - platform: ld2410
    ld2410_id: radar
    timeout:
      name: Radar hold time
    max_move_distance_gate:
      name: Radar max moving gate
    max_still_distance_gate:
      name: Radar max still gate
    # The radar keeps these in its own flash (defaults: moving 50/50/40/30/20/15/15/15/15, still 0/0/40/40/30/30/20/20/20).
    g0:
      move_threshold: {name: Radar gate 0 moving threshold, entity_category: config}
      still_threshold: {name: Radar gate 0 still threshold, entity_category: config}
    g1:
      move_threshold: {name: Radar gate 1 moving threshold, entity_category: config}
      still_threshold: {name: Radar gate 1 still threshold, entity_category: config}
    g2:
      move_threshold: {name: Radar gate 2 moving threshold, entity_category: config}
      still_threshold: {name: Radar gate 2 still threshold, entity_category: config}
    g3:
      move_threshold: {name: Radar gate 3 moving threshold, entity_category: config}
      still_threshold: {name: Radar gate 3 still threshold, entity_category: config}
    g4:
      move_threshold: {name: Radar gate 4 moving threshold, entity_category: config}
      still_threshold: {name: Radar gate 4 still threshold, entity_category: config}
    g5:
      move_threshold: {name: Radar gate 5 moving threshold, entity_category: config}
      still_threshold: {name: Radar gate 5 still threshold, entity_category: config}
    g6:
      move_threshold: {name: Radar gate 6 moving threshold, entity_category: config}
      still_threshold: {name: Radar gate 6 still threshold, entity_category: config}
    g7:
      move_threshold: {name: Radar gate 7 moving threshold, entity_category: config}
      still_threshold: {name: Radar gate 7 still threshold, entity_category: config}
    g8:
      move_threshold: {name: Radar gate 8 moving threshold, entity_category: config}
      still_threshold: {name: Radar gate 8 still threshold, entity_category: config}

switch:
  - platform: ld2410
    ld2410_id: radar
    bluetooth:
      name: Radar Bluetooth   # the module advertises a config service by default: switch it OFF once at the door
    engineering_mode:
      name: Radar engineering mode

button:
  - platform: ld2410
    ld2410_id: radar
    restart:
      name: Radar restart
    query_params:
      name: Radar read settings

text_sensor:
  - platform: ld2410
    ld2410_id: radar
    version:
      name: Radar firmware
