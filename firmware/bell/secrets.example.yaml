# Copy to secrets.yaml (never commit it) and fill in your own values.
# API key: 32 random bytes, base64, e.g.  python -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
s3bell_api_key: "REPLACE_WITH_BASE64_KEY"
s3bell_ota_password: "REPLACE_WITH_RANDOM_PASSWORD"
# only for the old WT32-ETH01 build (wt32eth-intercom-bell.yaml)
bell_api_key: "REPLACE_WITH_BASE64_KEY"
bell_ota_password: "REPLACE_WITH_RANDOM_PASSWORD"
# direct ring path (packet_transport): the same key goes into the secrets of every receiver (room keys, door screen)
ring_transport_key: "REPLACE_WITH_RANDOM_STRING"
ring_target_1: "192.0.2.21"     # example address (RFC 5737): your first room key
ring_target_2: "192.0.2.22"     # your second room key
ring_target_3: "192.0.2.12"     # the door screen
# the bell's own Wi-Fi "aikos" (bridged into the LAN): only the door screen and the talk computer know it
aikos_wifi_password: "REPLACE_WITH_RANDOM_PASSWORD_8_TO_63_CHARS"
# only for the access-point bench test (aikos-intercom-bell-aptest.yaml)
aikos_test_ap_password: "REPLACE_WITH_RANDOM_PASSWORD_8_TO_63_CHARS"
